<svg width="680" viewBox="0 0 680 612" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Site Behavior Lab architecture</title>
<desc>A visitor loads the static Cloudflare Pages UI and submits a scan to the Front Worker, which enforces Turnstile and rate limits, then forwards to the Node and Playwright container scanner. The scanner reaches the target site only over public HTTP or HTTPS on standard ports, through an SSRF egress proxy that pins a public IP at connect time. It records detections including trackers, Brave Shields block simulation, fingerprinting, a keystroke probe, CNAME uncloaking, and pre-consent tracking, then writes durable saved reports to R2. The live Containers API emits public r2. Current Actions corpus scans use the same Node scanner but publish validated v1 compatibility reports. Paired PageGraph files import as request-only r2, and Browser Run is a retired legacy-v1 self-host path.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 13px; font-weight: 600; fill: #1e293b; }
  .ts { font-size: 11px; fill: #475569; }
  .c-blue rect, rect.c-blue { fill: #e8eefc; stroke: #4f6bed; stroke-width: 1.5; }
  .c-gray rect, rect.c-gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
  rect.box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  .leader { stroke: #cbd5e1; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
</style>
<defs>
