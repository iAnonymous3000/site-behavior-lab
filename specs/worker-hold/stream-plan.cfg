\* The stream world under the plan's axioms: the two rows that can be judged there (F4-AGE, and F4-TERM's first half).
\* The exclusion rows, the no-term row and F4-READ are not listed: no worker here is ever excluded, lands nowhere or
\* runs unobserved, so they would pass whatever the protocol did. README.md says why.
CONSTANTS
  WorkerCount = 1
  CollapseSessions = FALSE
  Stream = TRUE
  StartReleased = TRUE
  Reduced = FALSE
  Assumed = {"A1", "A2", "notA3", "A4", "A5fifo", "A5bound"}
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  ReadNoOlderThanTheFreeze
  HeardLandsInOneTerm
