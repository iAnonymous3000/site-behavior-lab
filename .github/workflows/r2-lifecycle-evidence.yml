name: R2 Lifecycle Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-lifecycle-evidence
  cancel-in-progress: false

jobs:
  readback:
    name: Read back production R2 lifecycle
    if: >-
      github.repository == 'iAnonymous3000/site-behavior-lab' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-evidence
    timeout-minutes: 5
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install the lockfile dependency graph
        run: npm ci --ignore-scripts

      - name: Compile the shared canonical evidence serializer
        run: npm run build:schema

      - name: Capture the exact production lifecycle readback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_LIFECYCLE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          mkdir -p hosted-r2-lifecycle-evidence
          node scripts/r2-lifecycle-readback.mjs \
            hosted-r2-lifecycle-evidence/receipt.json

      - name: Upload the exact lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-r2-lifecycle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-r2-lifecycle-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
