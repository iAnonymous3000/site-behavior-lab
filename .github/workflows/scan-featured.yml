name: Scan Featured Sites

on:
  workflow_dispatch:
    inputs:
      sites_file:
        description: Catalog to scan (featured gallery, or the corpus de-bias seed list)
        required: false
        default: public/featured-sites.json
        type: choice
        options:
          - public/featured-sites.json
          - public/corpus-seed-sites.json
      categories:
        description: Comma-separated category ids to scan (blank = all)
        required: false
        type: string
      limit:
        description: Max number of sites to scan (blank = all)
        required: false
        type: string
      compare_gpc:
        description: Run a GPC off/on comparison per site
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      compare_shields:
        description: Run a Shields off/on comparison per site (tried-vs-blocked; takes precedence over consent and GPC)
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      compare_consent:
        description: Run a consent accept-all/reject-all comparison per site (takes precedence over GPC; set compare_shields to false)
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      device:
        description: Viewport
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - mobile
      report_mode:
        description: Report contract (v1 is a manual compatibility lane only)
        required: true
        default: r2
        type: choice
        options:
          - r2
          - v1
  repository_dispatch:
    types:
      - site-behavior-featured-scan
  schedule:
    # Weekly corpus refresh (Mondays 05:23 UTC). Scheduled runs use Shields
    # comparisons over the featured catalog, proposed as a reviewed
    # automation/* pull request against the default branch; merging publishes
    # via the Pages build. They produce r2 on the controlled
    # runner once it is configured, and a loudly disclosed frozen v1 fallback
    # until then. Each site's newest generations are exempt from age pruning
    # (scripts/prune-static-reports.mjs), so the refresh feeds the directory's
    # "changed since last scan" view instead of replacing the corpus.
    - cron: "23 5 * * 1"
    # Second leg, same era, other catalog. The corpus is TWO disjoint lists:
    # public/featured-sites.json is the deliberately popular, tracker-heavy
    # "start here" gallery, and public/corpus-seed-sites.json is the de-bias
    # seed list that keeps the published percentiles from describing only
    # commercial media. A scheduled run reached the first and never the second,
    # because FEATURED_SITES_FILE below reads only dispatch inputs, so every
    # methodology or GPC era flip stranded the de-bias half in the previous era.
    # On 2026-07-27 that published a gallery-only cohort whose median
    # third-party requests read 87 where the mixed corpus read 11.
    - cron: "23 7 * * 1"

permissions:
  contents: read

# Shared with scan.yml and update-brave-lists.yml: one writer at a time per ref.
concurrency:
  group: site-behavior-repo-writers-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Committed-report acquisition is forbidden from launching Chromium without
  # its namespace/seccomp sandbox. Preflight and runtime health both assert it.
  SITE_BEHAVIOR_LAB_CHROMIUM_SANDBOX: "1"
  # Internal scanner builds still render canonical metadata. Keep the build
  # fail-closed on the same public origin as CI and the deployed Pages site.
  NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: "https://sitebehavior.org"
  # `/api/health` must identify the exact checkout before a scan can start.
  SITE_BEHAVIOR_LAB_BUILD_COMMIT: ${{ github.sha }}
  FEATURED_SITES_FILE: >-
    ${{ github.event.inputs.sites_file
      || github.event.client_payload.sites_file
      || (github.event.schedule == '23 7 * * 1' && 'public/corpus-seed-sites.json')
      || '' }}
  FEATURED_CATEGORIES: ${{ github.event.inputs.categories || github.event.client_payload.categories || '' }}
  FEATURED_LIMIT: ${{ github.event.inputs.limit || github.event.client_payload.limit || '' }}
  FEATURED_COMPARE_GPC: ${{ github.event.inputs.compare_gpc || github.event.client_payload.compare_gpc || 'false' }}
  FEATURED_COMPARE_SHIELDS: ${{ github.event.inputs.compare_shields || github.event.client_payload.compare_shields || 'true' }}
  FEATURED_COMPARE_CONSENT: ${{ github.event.inputs.compare_consent || github.event.client_payload.compare_consent || 'false' }}
  FEATURED_DEVICE: ${{ github.event.inputs.device || github.event.client_payload.device || 'desktop' }}
  # Scheduled and repository-dispatch corpus production is r2 the moment the
  # operator configures the controlled runner label. Until then, automated runs
  # fall back to the production-proven frozen v1 lane WITH a loud preflight
  # warning (never silently): the weekly refresh must not fail every Monday
  # against infrastructure that does not exist yet. A human workflow_dispatch
  # can still explicitly select frozen v1 for compatibility testing.
  FEATURED_REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.report_mode || (vars.FEATURED_RUNNER_LABEL && 'r2' || 'v1') }}
  # Lets the preflight distinguish "operator chose r2 but the runner label is
  # missing" (fail closed) from "the controlled runner is not provisioned yet"
  # (disclosed v1 fallback).
  FEATURED_CONTROLLED_RUNNER_CONFIGURED: ${{ vars.FEATURED_RUNNER_LABEL && '1' || '' }}
  FEATURED_R2_EGRESS_ATTESTED: ${{ vars.FEATURED_R2_EGRESS_ATTESTED || '' }}
  # This adjustable gate measures success among currently eligible sites.
  # Operators can raise it, but never lower its 80% floor. A separate fixed,
  # non-overridable gate in the orchestrator also requires at least 80% of the
  # whole featured catalog and at least 50 sites to remain eligible.
  FEATURED_MIN_SUCCESS_RATE: ${{ vars.FEATURED_MIN_SUCCESS_RATE || '0.8' }}
  # The GitHub-hosted fallback label makes missing controlled-runner setup fail
  # explicitly in preflight. r2 requires an operator-supplied truthful label.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS: ${{ vars.SCANNER_EGRESS || 'github-actions-ubuntu' }}
  # An r2 run reaches the scanner only after preflight verifies the controlled
  # self-hosted runner's operator-declared stable region. Manual v1 may omit it.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION: ${{ vars.SCANNER_EGRESS_REGION || '' }}

jobs:
  scan-featured:
    name: Populate Featured Gallery
    permissions:
      contents: read
    outputs:
      publication_artifact_id: ${{ steps.publication_artifact.outputs.artifact-id }}
      publication_artifact_digest: ${{ steps.publication_artifact.outputs.artifact-digest }}
      publishable: ${{ steps.refresh_policy.outputs.publishable }}
      healthy: ${{ steps.refresh_policy.outputs.healthy }}
      public_summary: ${{ steps.refresh_policy.outputs.public_summary }}
      scan_outcome: ${{ steps.featured_scan.outcome }}
    # Manual v1 compatibility uses GitHub-hosted Ubuntu. Every r2 producer asks
    # for the controlled runner label. The ubuntu fallback is intentional: if
    # the label is absent, the job starts and the preflight fails visibly on
    # RUNNER_ENVIRONMENT instead of silently publishing v1.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.report_mode == 'v1' && 'ubuntu-latest' || vars.FEATURED_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      # One dist/schema build for the WHOLE job (RFC 10.3): every later step
      # (preflight, featured scans, prune, manifest, corpus stats) sees the env
      # flag and skips its own compile of the same artifact.
      - name: Build the dist/schema artifact once
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Prepare featured report production
        # Exact HEAD, a clean checkout, consent verification, and truthful
        # comparison egress are checked before Next or Chromium can scan.
        run: node dist/schema/lib/featured-report-preflight-cli.js

      - name: Verify server-owned acquisition provenance
        run: |
          node -e '
            const { runtimeReportAcquisition } = require("./dist/schema/lib/scan-report-acquisition.js");
            const mode = process.env.FEATURED_REPORT_MODE;
            const expected = mode === "r2" ? "ci-workflow" : "public-api";
            const actual = runtimeReportAcquisition(mode);
            if (actual !== expected) throw new Error(`Report acquisition is ${actual}, expected ${expected}.`);
          '

      # GitHub-hosted Ubuntu 24.04 restricts unprivileged user namespaces with
      # AppArmor, so Chromium's namespace sandbox cannot initialize and EVERY
      # scan dies at browser launch ("No usable sandbox!"), which reaches the
      # client as the generic 500 and reads like a scanner outage.
      #
      # Committed-report acquisition is forbidden from launching Chromium
      # without that sandbox, and preflight and runtime health both assert it,
      # so the fix is to make the environment support sandboxing rather than to
      # launch without it. That is also Chromium's own preferred remedy; its
      # sandbox-disabling alternative is exactly what this repository refuses.
      - name: Allow the Chromium sandbox to initialize on the hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
          if [[ "$current" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unavailable)"

      - name: Verify Chromium sandbox support on the controlled runner
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if current="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)"; then
            if [[ "$current" != "0" ]]; then
              echo "::error title=Chromium sandbox host setup::The controlled self-hosted runner has kernel.apparmor_restrict_unprivileged_userns=$current. Provision the persistent host with unprivileged user namespaces enabled before this workflow; refusing to change a host-wide kernel setting from the job."
              exit 1
            fi
            echo "kernel.apparmor_restrict_unprivileged_userns=$current"
          else
            echo "kernel.apparmor_restrict_unprivileged_userns is not present; no AppArmor user-namespace restriction was detected."
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build scanner app
        run: npm run build

      - name: Start scanner app
        run: |
          if node -e '
            const socket = require("node:net").createConnection({ host: "127.0.0.1", port: 3100 });
            socket.setTimeout(1000);
            socket.once("connect", () => { socket.destroy(); process.exit(0); });
            socket.once("error", () => process.exit(1));
            socket.once("timeout", () => { socket.destroy(); process.exit(1); });
          '; then
            echo "::error::Port 3100 was already occupied before startup; refusing a stale scanner process."
            exit 1
          fi
          expected_egress_region="$SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION"
          if [[ -z "$expected_egress_region" ]]; then
            # An empty Actions env entry is still present in Node's process
            # environment. Remove it so the v1 runner truthfully reports the
            # region as unrecorded instead of rejecting a blank declaration.
            unset SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION
          fi
          node node_modules/next/dist/bin/next start --port 3100 > /tmp/site-behavior-lab-featured.log 2>&1 &
          app_pid=$!
          echo "$app_pid" > /tmp/site-behavior-lab-featured.pid
          health_path="${RUNNER_TEMP}/site-behavior-lab-featured-health.json"
          for attempt in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The scanner process exited before it became ready; refusing a response from any stale port owner."
              cat /tmp/site-behavior-lab-featured.log
              exit 1
            fi
            if curl -fsS --connect-timeout 2 --max-time 5 \
              --output "$health_path" http://127.0.0.1:3100/api/health; then
              if node -e '
                const fs = require("node:fs");
                const [file, expectedSha, requestedMode, expectedRegion] = process.argv.slice(1);
                let health;
                try {
                  health = JSON.parse(fs.readFileSync(file, "utf8"));
                } catch (error) {
                  console.error(`Health response is not valid JSON: ${error instanceof Error ? error.message : error}`);
                  process.exit(1);
                }
                const mode = requestedMode.trim().toLowerCase();
                const failures = [];
                const expect = (condition, message) => { if (!condition) failures.push(message); };
                expect(mode === "v1" || mode === "r2", `unsupported requested mode ${requestedMode}`);
                expect(health?.ok === true, "health.ok is not true");
                expect(health?.deployment === expectedSha.toLowerCase(), `deployment is ${health?.deployment ?? "missing"}, expected ${expectedSha}`);
                expect(health?.scansAvailable === true, "scansAvailable is not true");
                expect(health?.checks?.chromiumSandbox === "enabled", `Chromium sandbox is ${health?.checks?.chromiumSandbox ?? "missing"}, expected enabled`);
                const expectedR2Status = mode === "r2" ? "enabled" : "disabled";
                expect(health?.checks?.publicR2Reports?.status === expectedR2Status, `public r2 status is ${health?.checks?.publicR2Reports?.status ?? "missing"}, expected ${expectedR2Status}`);
                const expectedRegionStatus = expectedRegion.trim() ? "configured" : "unrecorded";
                expect(health?.checks?.scannerEgressRegion === expectedRegionStatus, `egress-region status is ${health?.checks?.scannerEgressRegion ?? "missing"}, expected ${expectedRegionStatus}`);
                const expectedConsentStatus = mode === "r2" ? "enabled" : "disabled";
                expect(health?.checks?.consentVerification === expectedConsentStatus, `consent-verification status is ${health?.checks?.consentVerification ?? "missing"}, expected ${expectedConsentStatus}`);
                if (mode === "r2") expect(expectedRegion.trim() !== "", "r2 requires an expected stable egress region");
                if (failures.length) {
                  console.error(`Scanner health contract rejected: ${failures.join("; ")}`);
                  process.exit(1);
                }
              ' "$health_path" "$GITHUB_SHA" "$FEATURED_REPORT_MODE" "$expected_egress_region" && \
                kill -0 "$app_pid" 2>/dev/null; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "::error::The scanner did not satisfy the expected process and health contract."
          cat /tmp/site-behavior-lab-featured.log
          exit 1

      - name: Run featured scans
        id: featured_scan
        continue-on-error: true
        run: npm run scan:featured
        env:
          BASE_URL: http://127.0.0.1:3100
          FEATURED_SUMMARY_PATH: ${{ runner.temp }}/featured-scan-summary.json

      # The scanner writes to its own log, and until now that log was dumped
      # only when STARTUP failed. A scan step that fails after a healthy start
      # (every site refused in well under a second, for instance) left no
      # server-side evidence at all, so the cause was invisible from the run.
      # Bounded, and workflow logs are already the documented place maintainers
      # inspect private diagnostics.
      - name: Show scanner log when the scans failed
        if: always() && steps.featured_scan.outcome != 'success'
        run: |
          echo "::group::scanner log (last 200 lines)"
          tail -n 200 /tmp/site-behavior-lab-featured.log || echo "no scanner log present"
          echo "::endgroup::"

      - name: Classify reports for partial publication
        id: refresh_policy
        if: always()
        env:
          FEATURED_SUMMARY_PATH: ${{ runner.temp }}/featured-scan-summary.json
          FEATURED_SCAN_OUTCOME: ${{ steps.featured_scan.outcome }}
        run: node scripts/run-featured-scans-diagnostics.mjs --classify-publication

      - name: Verify report redaction and provenance
        id: report_validation
        if: steps.refresh_policy.outputs.publishable == 'true'
        run: npm run reports:remediate -- --check

      - name: Build static report manifest
        id: report_manifest
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.report_validation.outcome == 'success'
        run: npm run reports:manifest

      - name: Build corpus stats
        id: corpus_stats
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.report_validation.outcome == 'success' &&
          steps.report_manifest.outcome == 'success'
        run: npm run corpus:stats

      - name: Summarize corpus
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.corpus_stats.outcome == 'success'
        run: |
          REPORTS=$(jq '.reports | length' public/reports/index.json 2>/dev/null || echo 0)
          SAMPLE=$(jq '.sampleSize' public/corpus-stats.json 2>/dev/null || echo 0)
          {
            echo "## Featured scan corpus"
            echo ""
            echo "- Producer contract: **${FEATURED_REPORT_MODE}**"
            echo "- Listed reports in manifest: **$REPORTS**"
            echo "- Distinct sites in corpus (sampleSize): **$SAMPLE**"
            echo "- Corpus-relative percentile findings activate at 50 distinct sites (CORPUS_MIN_SAMPLE)."
            echo "- Acquisition produced a bounded data artifact. A separate GitHub-hosted publisher must validate it before any report can be committed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare bounded data-only publication artifact
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.corpus_stats.outcome == 'success'
        run: |
          npm run reports:publication-artifact -- \
            --prepare \
            --artifact-dir "$RUNNER_TEMP/report-publication" \
            --source-commit "$GITHUB_SHA" \
            --kind featured \
            --report-mode "$FEATURED_REPORT_MODE"

      - name: Upload bounded data-only publication artifact
        id: publication_artifact
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.corpus_stats.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-featured-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-publication/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Validate and Publish Featured Reports
    needs: scan-featured
    if: >-
      needs.scan-featured.result == 'success' &&
      needs.scan-featured.outputs.publication_artifact_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # GITHUB_TOKEN pushes do not recursively trigger CI, so the publisher
      # explicitly dispatches the required workflow after a successful push.
      actions: write
    env:
      BASE_BRANCH: ${{ github.ref_name }}
      PROPOSAL_BRANCH: automation/featured-scan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact acquisition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install trusted validator dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build the trusted publication validator once
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Verify immutable artifact identity
        env:
          ARTIFACT_ID: ${{ needs.scan-featured.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.scan-featured.outputs.publication_artifact_digest }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Precheck exact raw artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.scan-featured.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.scan-featured.outputs.publication_artifact_digest }}
          ARTIFACT_NAME: site-behavior-featured-publication-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f "name=$ARTIFACT_NAME" \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            > "$RUNNER_TEMP/report-publication-metadata.json"
          npm run reports:publication-archive -- \
            --validate-metadata \
            --metadata "$RUNNER_TEMP/report-publication-metadata.json" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" \
            --digest "$ARTIFACT_DIGEST"

      - name: Download raw artifact archive by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.scan-featured.outputs.publication_artifact_id }}
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/report-publication.zip"

      - name: Centrally validate and safely extract raw artifact archive
        env:
          ARTIFACT_ID: ${{ needs.scan-featured.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.scan-featured.outputs.publication_artifact_digest }}
          ARTIFACT_NAME: site-behavior-featured-publication-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run reports:publication-archive -- \
            --extract \
            --metadata "$RUNNER_TEMP/report-publication-metadata.json" \
            --archive "$RUNNER_TEMP/report-publication.zip" \
            --artifact-dir "$RUNNER_TEMP/report-publication" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" \
            --digest "$ARTIFACT_DIGEST"

      - name: Validate and copy only canonical new report data
        run: |
          npm run reports:publication-artifact -- \
            --publish \
            --artifact-dir "$RUNNER_TEMP/report-publication" \
            --source-commit "$GITHUB_SHA" \
            --kind featured \
            --report-mode "$FEATURED_REPORT_MODE"

      - name: Rebuild trusted retention and aggregate outputs
        # Retention decisions are made in the trusted exact-SHA checkout. No
        # deletion proposed by the acquisition artifact is ever applied.
        run: |
          npm run reports:prune
          npm run reports:remediate -- --check
          npm run reports:manifest
          npm run corpus:stats

      - name: Commit static reports
        id: commit
        # A below-threshold batch remains red in reconciliation, but any
        # independently validated reports can still advance the evidence base.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Committed reports may only publish to a branch."
            exit 1
          fi
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add public/reports public/corpus-stats.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          if [[ "$FEATURED_REPORT_MODE" == "v1" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git commit -m "Add manual v1 compatibility scan reports"
          elif [[ "$FEATURED_REPORT_MODE" == "v1" ]]; then
            git commit -m "Add scheduled v1 fallback scan reports"
          else
            git commit -m "Add featured r2 site behavior scan reports"
          fi
          # The validated tree becomes a reviewed automation/* proposal, never a
          # direct write to the source branch: a base branch that advanced
          # since validation surfaces as an ordinary merge conflict on the pull
          # request instead of a transplanted stale tree. The per-attempt
          # branch name is unique, so this push never needs force.
          git push origin "HEAD:refs/heads/$PROPOSAL_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          proposal_body="$RUNNER_TEMP/report-proposal-pr.md"
          printf '%s\n' \
            '<!-- site-behavior-lab:featured-publication-pr -->' \
            '# Add validated featured scan report data' \
            '' \
            'This proposal contains validated, privacy-reduced featured report data produced by the trusted publisher from a bounded acquisition artifact.' \
            '' \
            '- The publisher validated artifact identity, redaction, provenance, pruning, manifests, and corpus statistics before proposing.' \
            '- Merging still requires normal review and a fresh main-branch CI run.' \
            '- If another proposal merges first and this one conflicts in the report manifest or corpus statistics, close it and re-run the workflow; never hand-merge regenerated output.' \
            > "$proposal_body"
          # The proposal branch is already pushed and every gate above passed,
          # so a refusal to OPEN the pull request must not discard validated
          # report data or report a working publisher as broken. Exactly one
          # refusal is tolerated: the repository policy that forbids Actions
          # from creating pull requests. It is surfaced as an error annotation
          # with the one-click URL, and CI still runs on the branch. Every
          # other failure is real and still fails the job.
          pr_error="$RUNNER_TEMP/report-proposal-pr-error.txt"
          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$PROPOSAL_BRANCH" \
            --title "Add validated featured scan report data" \
            --body-file "$proposal_body" 2>"$pr_error"; then
            cat "$pr_error" >&2
            if ! grep -q "not permitted to create or approve pull requests" "$pr_error"; then
              exit 1
            fi
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${PROPOSAL_BRANCH}?expand=1"
            echo "::error title=Featured publication needs its pull request opened by hand::The validated report data is pushed to ${PROPOSAL_BRANCH}, but this repository does not permit Actions to create pull requests. Open it at ${compare_url}, or enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
            {
              echo "- Proposal branch: \`${PROPOSAL_BRANCH}\` (validated, pushed)"
              echo "- Pull request: **not created**; Actions are not permitted to create pull requests in this repository"
              echo "- Open it here: ${compare_url}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger CI on the proposal branch
        # Pushes made with GITHUB_TOKEN never fire `on: push` workflows, so the
        # proposal would stay untested. Dispatch CI on the proposal branch
        # only; its attest and promote jobs are gated on refs/heads/main, so
        # this run tests the proposal and can never deploy it. Promotion
        # happens from the fresh main CI run after the pull request merges.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$PROPOSAL_BRANCH"

  reconcile:
    name: Reconcile Featured Refresh Health
    needs:
      - scan-featured
      - publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Prepare public-safe refresh alert
        id: refresh_alert
        env:
          FEATURED_ALERT_REPORT_PATH: ${{ runner.temp }}/featured-corpus-refresh.md
          FEATURED_PUBLIC_SUMMARY_JSON: ${{ needs.scan-featured.outputs.public_summary }}
          FEATURED_SCAN_OUTCOME: ${{ needs.scan-featured.outputs.scan_outcome }}
          FEATURED_BATCH_HEALTHY: ${{ needs.scan-featured.outputs.healthy }}
          FEATURED_JOB_STATUS: ${{ needs.scan-featured.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && 'success' || 'failure' }}
          FEATURED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/run-featured-scans-diagnostics.mjs --prepare-alert

      - name: Reconcile the featured-corpus refresh issue
        # Only an unfiltered, default-mode full catalog run on the default
        # branch is authoritative. Filtered or alternate-mode dispatches cannot
        # open or close the repository-wide weekly-health issue. Scheduled runs
        # stay authoritative on the disclosed v1 fallback lane, so a failing
        # weekly refresh still alerts while the r2 runner is unprovisioned.
        if: >-
          (env.FEATURED_REPORT_MODE == 'r2' || github.event_name == 'schedule') &&
          steps.refresh_alert.outcome == 'success' &&
          steps.refresh_alert.outputs.authoritative == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Repair the weekly featured corpus refresh
          MANAGED_ISSUE_LABEL: site-behavior-lab-featured-refresh
          REFRESH_REPORT_FILE: ${{ runner.temp }}/featured-corpus-refresh.md
          REFRESH_FAILED: ${{ steps.refresh_alert.outputs.failed }}
        run: |
          set -euo pipefail

          if ! gh api --silent "repos/${GITHUB_REPOSITORY}/labels/${MANAGED_ISSUE_LABEL}"; then
            gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f "name=${MANAGED_ISSUE_LABEL}" \
              -f color=1d76db \
              -f description="Managed by the Site Behavior Lab featured-refresh workflow" || \
              gh api --silent "repos/${GITHUB_REPOSITORY}/labels/${MANAGED_ISSUE_LABEL}"
          fi

          candidates=$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          match=$(printf '%s' "$candidates" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const marker = "<!-- site-behavior-lab:featured-corpus-refresh -->";
              const managedLabel = process.env.MANAGED_ISSUE_LABEL;
              const trusted = JSON.parse(source)
                .flat()
                .map((issue) => {
                  const labels = Array.isArray(issue.labels)
                    ? issue.labels.map((label) => typeof label === "string" ? label : label?.name)
                    : [];
                  return !issue.pull_request &&
                    issue.user?.login === "github-actions[bot]" &&
                    issue.user?.type === "Bot" &&
                    typeof issue.body === "string" &&
                    issue.body.includes(marker) ? { issue, labels } : null;
                })
                .filter(Boolean);
              const managed = trusted.filter(({ labels }) => labels.includes(managedLabel));
              const legacy = trusted.filter(({ issue, labels }) =>
                !labels.includes(managedLabel) && issue.title === process.env.ISSUE_TITLE);
              if (managed.length > 1 || legacy.length > 1 || (managed.length === 1 && legacy.length === 1)) {
                throw new Error("Found conflicting canonical refresh issues; expected at most one trusted managed or legacy issue.");
              }
              const selected = managed[0] ?? legacy[0];
              if (selected) {
                process.stdout.write(`${selected.issue.number}|${selected.issue.state}|${legacy.length === 1 ? "true" : "false"}`);
              }
            });
          ')

          IFS='|' read -r issue_number issue_state issue_needs_label <<< "$match"
          if [[ -z "$match" ]]; then
            issue_number=""
            issue_state=""
            issue_needs_label="false"
          elif [[ "$issue_needs_label" == "true" ]]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label "$MANAGED_ISSUE_LABEL"
          fi

          if [[ "$REFRESH_FAILED" == "true" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$REFRESH_REPORT_FILE" \
                --label "$MANAGED_ISSUE_LABEL"
            else
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$REFRESH_REPORT_FILE"
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "The authoritative featured-corpus refresh is failing again; the issue body now links to the current run."
              fi
            fi
          elif [[ "$REFRESH_FAILED" == "false" ]]; then
            if [[ -n "$issue_number" && "$issue_state" == "open" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$REFRESH_REPORT_FILE"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "The authoritative featured-corpus refresh validated its batch and proposed it for review; the corpus advances when the proposal merges."
            fi
          else
            echo "::error title=Invalid featured refresh status::The alert preparer returned an invalid failure status."
            exit 1
          fi

      - name: Preserve featured-refresh failure
        if: >-
          always() &&
          (needs.scan-featured.result != 'success' ||
          (needs.scan-featured.outputs.publication_artifact_id != '' && needs.publish.result != 'success') ||
          steps.refresh_alert.outcome != 'success' ||
          steps.refresh_alert.outputs.failed == 'true')
        run: |
          echo "::error title=Featured corpus refresh failed::The refresh or its required trusted publication/reconciliation did not complete. The canonical issue contains only public-safe aggregate details; maintainers can inspect the private workflow logs."
          exit 1
