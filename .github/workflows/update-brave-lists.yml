name: Update Brave Shields Lists

# Keeps the vendored Brave Shields snapshot current so the block simulation and
# tried-vs-blocked classification track Brave's real default lists:
#   1. Weekly refresh of the default filter lists from Brave's own catalog,
#      validated end to end (the WASM engine must load the new snapshot and
#      still block known ad URLs) before the refresh is committed. Scheduled
#      failures are tracked in a separate canonical issue and remain job-red.
#   2. A measurement-toolchain drift check against crates.io, npm, and Chrome's
#      consumer stable channel. Actionable drift is tracked in one canonical issue;
#      browser-channel lag without a stable Playwright upgrade remains informational.
#      malformed local pins or unavailable upstream metadata fail the job.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Shared with scan.yml and scan-featured.yml: one writer at a time per ref.
concurrency:
  group: site-behavior-repo-writers-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  measurement-freeze-notice:
    name: Measurement freeze notice
    if: vars.SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the withheld refresh
        run: |
          echo "::warning title=Measurement freeze::SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE=1 quiesces the filter-list refresh: a mid-epoch list change would move the Shields methodology identity under collected evidence. Unset the repository variable once the freeze ends."

  refresh-lists:
    name: Refresh and validate filter lists
    # A manual run may target any ref. Never let an arbitrary feature ref
    # become the base of the repository-wide refresh proposal. The measurement
    # freeze quiesces refreshes entirely: a mid-epoch filter change would move
    # the Shields methodology identity under evidence already collected.
    if: >-
      github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch &&
      vars.SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE != '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # The unit suite includes real scanner regressions that launch the
        # pinned Playwright browser. npm ci installs the client package, not
        # chromium_headless_shell itself.
        run: npx playwright install --with-deps chromium

      - name: Fetch Brave default filter lists
        run: npm run lists:brave

      - name: Validate the refreshed engine snapshot
        run: npm run lists:verify

      # THIRD_PARTY_INVENTORY.json pins bundle.sourceManifestSha256 and every
      # per-list digest, so new list bytes invalidate it by construction. Left
      # stale, the proposal fails CI's required supply-chain gate and no
      # refresh can ever merge. Regenerate it here, then re-verify so the
      # committed inventory is proven to describe these exact bytes.
      - name: Regenerate the third-party inventory for the new list bytes
        run: node scripts/third-party-inventory.mjs

      - name: Verify the regenerated inventory
        run: npm run supply-chain:third-party:check

      - name: Run unit tests against the new snapshot
        run: npm run test:unit

      # Remote list bytes are third-party measurement inputs. Validation may
      # prepare a proposal, but it must never advance main or production without
      # a human-reviewed PR. GITHUB_TOKEN-created PRs do not trigger CI, so the
      # following step dispatches CI on the proposal branch only; its promotion
      # guard requires refs/heads/main and therefore cannot deploy the proposal.
      - name: Publish reviewed refresh proposal
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PROPOSAL_BRANCH: automation/brave-list-refresh
        run: |
          set -euo pipefail
          echo "proposed=false" >> "$GITHUB_OUTPUT"
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add lib/adblock-wasm/brave-default-filters.txt.gz lib/adblock-wasm/brave-default-filters.meta.json THIRD_PARTY_INVENTORY.json
          if git diff --cached --quiet; then
            echo "No filter list changes to commit."
            exit 0
          fi

          remote_oid=""
          if git fetch origin "$PROPOSAL_BRANCH"; then
            remote_oid=$(git rev-parse FETCH_HEAD)
          fi
          git checkout -B "$PROPOSAL_BRANCH"
          git commit -m "Refresh the vendored Brave Shields default filter lists"

          if [[ -n "$remote_oid" ]]; then
            git push \
              --force-with-lease="refs/heads/${PROPOSAL_BRANCH}:${remote_oid}" \
              origin "HEAD:refs/heads/${PROPOSAL_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${PROPOSAL_BRANCH}"
          fi

          proposal_body="$RUNNER_TEMP/brave-list-refresh-pr.md"
          printf '%s\n' \
            '<!-- site-behavior-lab:brave-list-refresh-pr -->' \
            '# Reviewed Brave Shields list refresh' \
            '' \
            'This proposal contains newly fetched third-party filter-list bytes from the repository-pinned Brave catalog and reviewed URL lock.' \
            '' \
            '- The fetcher forbids redirects and non-approved hosts or paths.' \
            '- Every source and the combined ruleset are byte-capped and SHA-256 recorded.' \
            '- The WASM engine check and unit suite passed before this proposal was published.' \
            '- Merging still requires normal review and a fresh main-branch CI run.' \
            > "$proposal_body"

          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$PROPOSAL_BRANCH" \
            --limit 2 \
            --json number \
            --jq 'if length > 1 then error("multiple open Brave-list refresh PRs") elif length == 1 then .[0].number else empty end')
          if [[ -z "$pr_number" ]]; then
            # The proposal branch is already pushed and every gate above passed,
            # so a refusal to OPEN the pull request must not discard a validated
            # refresh or report a working one as broken. Exactly one refusal is
            # tolerated: the repository/organization policy that forbids Actions
            # from creating pull requests ("Allow GitHub Actions to create and
            # approve pull requests", off by default). It is surfaced as an
            # error annotation with the one-click URL, and CI still runs on the
            # branch. Every other failure is real and still fails the job.
            pr_error="$RUNNER_TEMP/brave-list-pr-error.txt"
            if ! gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$PROPOSAL_BRANCH" \
              --title "Refresh the vendored Brave Shields default filter lists" \
              --body-file "$proposal_body" 2>"$pr_error"; then
              cat "$pr_error" >&2
              if ! grep -q "not permitted to create or approve pull requests" "$pr_error"; then
                exit 1
              fi
              compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${PROPOSAL_BRANCH}?expand=1"
              echo "::error title=Brave-list refresh needs its pull request opened by hand::The refreshed snapshot is validated and pushed to ${PROPOSAL_BRANCH}, but this repository does not permit Actions to create pull requests. Open it at ${compare_url}, or enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
              {
                echo "- Proposal branch: \`${PROPOSAL_BRANCH}\` (validated, pushed)"
                echo "- Pull request: **not created**; Actions are not permitted to create pull requests in this repository"
                echo "- Open it here: ${compare_url}"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "pr_blocked=true" >> "$GITHUB_OUTPUT"
            fi
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Refresh the vendored Brave Shields default filter lists" \
              --body-file "$proposal_body"
          fi
          echo "proposed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger non-promoting CI on the proposal branch
        if: steps.commit.outputs.proposed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_BRANCH: automation/brave-list-refresh
        run: gh workflow run ci.yml --ref "$PROPOSAL_BRANCH"

      - name: Prepare scheduled Brave-list refresh alert
        id: brave_list_alert
        if: always() && github.event_name == 'schedule'
        env:
          BRAVE_LIST_JOB_STATUS: ${{ job.status }}
          BRAVE_LIST_REPORT_FILE: ${{ runner.temp }}/brave-list-refresh.md
        run: |
          set -euo pipefail

          if [[ "$BRAVE_LIST_JOB_STATUS" == "success" ]]; then
            failed=false
            outcome=completed
            summary="The scheduled fetch, engine validation, unit suite, reviewed-PR proposal step, and any required non-promoting CI dispatch completed."
          else
            failed=true
            outcome=failed
            summary="The scheduled refresh did not complete every required fetch, validation, proposal, and non-promoting CI dispatch step."
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s\n' \
            '<!-- site-behavior-lab:brave-list-refresh -->' \
            '# Scheduled Brave Shields list refresh' \
            '' \
            "$summary" \
            '' \
            "- Outcome: **${outcome}**" \
            "- Workflow run: [run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}](${run_url})" \
            '' \
            'This public issue intentionally contains only aggregate status. Use the linked workflow run for bounded diagnostics.' \
            > "$BRAVE_LIST_REPORT_FILE"

          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Reconcile the scheduled Brave-list refresh issue
        id: brave_list_issue
        # Manual dispatches are diagnostic and must never open or close the
        # repository-wide health issue. The sibling drift job is independent.
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          steps.brave_list_alert.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Repair the scheduled Brave Shields list refresh
          BRAVE_LIST_REPORT_FILE: ${{ runner.temp }}/brave-list-refresh.md
          REFRESH_FAILED: ${{ steps.brave_list_alert.outputs.failed }}
        run: |
          set -euo pipefail

          candidates=$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          match=$(printf '%s' "$candidates" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const marker = "<!-- site-behavior-lab:brave-list-refresh -->";
              const matches = JSON.parse(source)
                .flat()
                .filter((issue) => !issue.pull_request && typeof issue.body === "string" && issue.body.includes(marker));
              if (matches.length > 1) throw new Error(`Found ${matches.length} canonical Brave-list refresh issues; expected at most one.`);
              if (matches.length === 1) process.stdout.write(`${matches[0].number}|${matches[0].state}`);
            });
          ')

          issue_number="${match%%|*}"
          issue_state="${match#*|}"
          if [[ -z "$match" ]]; then
            issue_number=""
            issue_state=""
          fi

          if [[ "$REFRESH_FAILED" == "true" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$BRAVE_LIST_REPORT_FILE"
            else
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$BRAVE_LIST_REPORT_FILE"
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "The scheduled Brave Shields list refresh is failing again; the issue body links to the current run."
              fi
            fi
          elif [[ "$REFRESH_FAILED" == "false" ]]; then
            if [[ -n "$issue_number" && "$issue_state" == "open" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$BRAVE_LIST_REPORT_FILE"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "The scheduled Brave Shields list refresh completed successfully."
            fi
          else
            echo "::error title=Invalid Brave-list refresh status::The alert preparer returned an invalid failure status."
            exit 1
          fi

      - name: Preserve scheduled Brave-list refresh failure
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          (steps.brave_list_alert.outcome != 'success' ||
          steps.brave_list_issue.outcome != 'success' ||
          steps.brave_list_alert.outputs.failed == 'true')
        run: |
          message="The scheduled refresh or its required issue reconciliation did not complete."
          message+=" Inspect this workflow run; the canonical issue is updated when reconciliation succeeds."
          echo "::error title=Brave Shields list refresh failed::${message}"
          exit 1

  toolchain-drift-check:
    name: Check measurement toolchain drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install integrity-checked package metadata
        run: npm ci --ignore-scripts

      - name: Compare resolved pins with upstream stable versions
        id: drift
        env:
          DRIFT_REPORT_FILE: ${{ runner.temp }}/measurement-toolchain-drift.md
        run: node scripts/check-toolchain-drift.mjs --report "$DRIFT_REPORT_FILE"

      - name: Reconcile the measurement toolchain issue
        # workflow_dispatch may target a feature ref; only the default branch
        # is authoritative for the repository-wide maintenance issue.
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Update measurement toolchain pins
          DRIFT_REPORT_FILE: ${{ runner.temp }}/measurement-toolchain-drift.md
          HAS_DRIFT: ${{ steps.drift.outputs.drift }}
        run: |
          set -euo pipefail

          candidates=$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          match=$(printf '%s' "$candidates" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const marker = "<!-- site-behavior-lab:measurement-toolchain-drift -->";
              const matches = JSON.parse(source)
                .flat()
                .filter((issue) => !issue.pull_request && typeof issue.body === "string" && issue.body.includes(marker));
              if (matches.length > 1) throw new Error(`Found ${matches.length} canonical drift issues; expected at most one.`);
              if (matches.length === 1) process.stdout.write(`${matches[0].number}|${matches[0].state}`);
            });
          ')

          issue_number="${match%%|*}"
          issue_state="${match#*|}"
          if [[ -z "$match" ]]; then
            issue_number=""
            issue_state=""
          fi

          if [[ "$HAS_DRIFT" == "true" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$DRIFT_REPORT_FILE"
            else
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$DRIFT_REPORT_FILE"
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "Measurement toolchain drift is present again; the issue body has the current resolved and upstream versions."
              fi
            fi
          elif [[ "$HAS_DRIFT" == "false" ]]; then
            if [[ -n "$issue_number" && "$issue_state" == "open" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$DRIFT_REPORT_FILE"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "No actionable measurement-toolchain upgrades remain. The issue body retains any informational browser-channel lag until stable Playwright catches up."
            fi
          else
            echo "::error::The drift checker returned an invalid drift output: ${HAS_DRIFT}"
            exit 1
          fi
