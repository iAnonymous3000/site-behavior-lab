name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Dispatched by the data workflows (scan, scan-featured, update-brave-lists)
  # after their GITHUB_TOKEN pushes, which never fire `on: push`: the corpus
  # commit gets a real CI run. This workflow promotes its own tested SHA because
  # a token-dispatched run does not reliably cascade into a third workflow via
  # `workflow_run`; Promote Production remains an idempotent fallback.
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR revisions need no further feedback. Main and manual runs keep
# unique groups so source-bound promotion and evidence runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: "https://sitebehavior.org"

jobs:
  supply-chain:
    name: Supply-chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install locked dependencies
        id: supply_chain_npm_ci
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Verify third-party supply-chain inventory
        id: third_party_supply_chain
        continue-on-error: true
        run: npm run supply-chain:third-party:check

      # A new or bumped dependency cannot merge without at least an explicit
      # unreviewed row in the review ledger; review COMPLETENESS is reported
      # here and gated only at release readiness.
      - name: Verify third-party review ledger coverage
        id: third_party_review_ledger
        continue-on-error: true
        run: npm run supply-chain:reviews:check

      # This validates the committed status=blocked integrity/provenance
      # contract. It intentionally does not claim local rebuild byte parity.
      - name: Verify vendored WASM static integrity contract
        id: wasm_static_integrity
        continue-on-error: true
        run: npm run wasm:verify-reproducibility

      - name: Prepare supply-chain report directory
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/site-behavior-lab-supply-chain"
          install -d -m 700 "$report_dir"
          echo "SUPPLY_CHAIN_REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

      # npm audit contacts the configured registry for every run. The explicit
      # ping and online-only config keep a stale local cache from satisfying the
      # gate when the advisory service is unavailable.
      - name: Audit npm dependencies against the live registry
        id: npm_audit
        continue-on-error: true
        env:
          NPM_CONFIG_OFFLINE: "false"
          NPM_CONFIG_PREFER_OFFLINE: "false"
          NPM_CONFIG_PREFER_ONLINE: "true"
        run: |
          set -euo pipefail
          npm ping --registry=https://registry.npmjs.org/
          set +e
          npm audit \
            --json \
            --audit-level=low \
            --package-lock-only \
            --ignore-scripts \
            --registry=https://registry.npmjs.org/ \
            > "$SUPPLY_CHAIN_REPORT_DIR/npm-audit.json"
          audit_status=$?
          set -e
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$SUPPLY_CHAIN_REPORT_DIR/npm-audit.json"
          exit "$audit_status"

      # A unique database path forces cargo-audit to clone/fetch RustSec during
      # this run. Omitting --no-fetch and --stale makes an unavailable or stale
      # advisory database a hard failure rather than a cache-only success.
      - name: Audit Rust dependencies against a fresh RustSec database
        id: cargo_audit
        continue-on-error: true
        env:
          RUSTSEC_DB: ${{ runner.temp }}/rustsec-advisory-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$RUSTSEC_DB"
          cargo install cargo-audit --locked --version 0.22.1 --force
          test "$(cargo audit --version)" = "cargo-audit-audit 0.22.1"
          set +e
          cargo audit \
            --db "$RUSTSEC_DB" \
            --url https://github.com/RustSec/advisory-db.git \
            --file tools/adblock-wasm/Cargo.lock \
            --deny warnings \
            --format json \
            > "$SUPPLY_CHAIN_REPORT_DIR/cargo-audit.json"
          audit_status=$?
          set -e
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$SUPPLY_CHAIN_REPORT_DIR/cargo-audit.json"
          exit "$audit_status"

      # Filesystem mode covers lockfiles plus the deployable Dockerfile and
      # repository configuration. Action caching is disabled and DB updates are
      # mandatory so the gate cannot pass on a stale cached vulnerability DB.
      - name: Scan repository and container configuration with Trivy
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: ${{ runner.temp }}/site-behavior-lab-supply-chain/trivy-filesystem.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          cache: "false"
          # This pinned action version ignores the retired skip-db-update
          # inputs; a fresh DB download is its default. Keep that download
          # OUTSIDE the workspace: a DB dropped into the checkout dirties the
          # worktree and the exact-SHA evidence gate refuses a dirty tree.
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Validate Trivy machine-readable report
        id: trivy_report
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$SUPPLY_CHAIN_REPORT_DIR/trivy-filesystem.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$SUPPLY_CHAIN_REPORT_DIR/trivy-filesystem.json"

      - name: Preserve supply-chain security reports
        id: supply_chain_report_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-security-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-supply-chain/
          if-no-files-found: error
          retention-days: 90

      # Scanner steps continue only so every available report can be retained.
      # This final step converts any scanner, report, or upload failure back into
      # a blocking job failure.
      - name: Enforce all supply-chain security gates
        if: always()
        env:
          NPM_CI_OUTCOME: ${{ steps.supply_chain_npm_ci.outcome }}
          THIRD_PARTY_OUTCOME: ${{ steps.third_party_supply_chain.outcome }}
          REVIEW_LEDGER_OUTCOME: ${{ steps.third_party_review_ledger.outcome }}
          WASM_STATIC_INTEGRITY_OUTCOME: ${{ steps.wasm_static_integrity.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
          CARGO_AUDIT_OUTCOME: ${{ steps.cargo_audit.outcome }}
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy_scan.outcome }}
          TRIVY_REPORT_OUTCOME: ${{ steps.trivy_report.outcome }}
          REPORT_UPLOAD_OUTCOME: ${{ steps.supply_chain_report_upload.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            "npm ci:$NPM_CI_OUTCOME" \
            "third-party inventory:$THIRD_PARTY_OUTCOME" \
            "third-party review ledger:$REVIEW_LEDGER_OUTCOME" \
            "WASM static integrity:$WASM_STATIC_INTEGRITY_OUTCOME" \
            "npm audit:$NPM_AUDIT_OUTCOME" \
            "cargo audit:$CARGO_AUDIT_OUTCOME" \
            "Trivy scan:$TRIVY_SCAN_OUTCOME" \
            "Trivy report:$TRIVY_REPORT_OUTCOME" \
            "report upload:$REPORT_UPLOAD_OUTCOME"; do
            name=${gate%%:*}
            outcome=${gate#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error title=Supply-chain gate failed::${name} finished with ${outcome}."
              failed=1
            fi
          done
          exit "$failed"

  app:
    name: Typecheck, Unit Tests, Build
    needs:
      - tests
      - pages
    # Keep the existing required check as a fail-closed join. A skipped
    # dependency must fail this check, not become an implicitly passing skip.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tests and builds to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.pages.result }}
        run: |
          set -euo pipefail
          if [[ "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            echo "::error::Tests: $TEST_RESULT; builds and static smoke: $BUILD_RESULT"
            exit 1
          fi

  tests:
    name: Typecheck and Unit Tests
    runs-on: ubuntu-latest
    # A deadlocked unit test must fail this job fast, never consume the 6-hour default budget.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      # The baseline decides what "append-only" is measured against, so it must
      # be a revision this repository already stood behind, never a relative
      # ref. A HEAD^ fallback compared exactly one commit back, so a manual run
      # could rewrite the whole ledger across two commits and still pass.
      - name: Resolve the trusted corrections baseline
        id: corrections_baseline
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request) candidate="$PULL_REQUEST_BASE" ;;
            push) candidate="$PUSH_BEFORE" ;;
            *) candidate="" ;;
          esac
          # A first push to a new ref reports the all-zero SHA, and a manual
          # dispatch reports nothing at all. Both fall back to the last state
          # this repository actually promoted, which is the strongest baseline
          # available without trusting the run's own history.
          if [[ -z "$candidate" || "$candidate" == "$zero" ]]; then
            git fetch --no-tags --quiet origin production
            candidate="$(git rev-parse FETCH_HEAD)"
          fi
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Corrections baseline unresolved::Refusing to verify against a malformed baseline."
            exit 1
          fi
          if ! git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
            echo "::error title=Corrections baseline unresolved::Baseline ${candidate} is not a commit in this checkout."
            exit 1
          fi
          # An unrelated baseline would compare the ledger against history this
          # revision never descended from, which proves nothing about appends.
          if ! git merge-base --is-ancestor "$candidate" HEAD; then
            echo "::error title=Corrections baseline unresolved::Baseline ${candidate} is not an ancestor of HEAD."
            exit 1
          fi
          echo "baseline=${candidate}" >> "$GITHUB_OUTPUT"
          echo "Corrections baseline ${candidate} resolved for ${EVENT_NAME}."

      - name: Verify append-only corrections history
        run: npm run corrections:verify-history -- "${{ steps.corrections_baseline.outputs.baseline }}"

      # Same trusted ancestor, a different property: the corrections gate proves
      # published qualifications were not rewritten, this one proves the
      # publication chain itself was only ever appended to. Reusing the resolved
      # baseline keeps one definition of "trusted ancestor" in this workflow.
      - name: Verify append-only publication transparency log
        run: npm run transparency:verify-history -- "${{ steps.corrections_baseline.outputs.baseline }}"

      # Append-only is not coverage. This re-derives every committed report's
      # wire digest and fails if a published report is missing from the chain,
      # which the history check above cannot see.
      - name: Verify transparency log covers every committed report
        run: npm run transparency:log:check

      # The printed evidence footer instructs readers to run this command, so
      # it must be a command this project actually runs. --from is required:
      # the CLI otherwise defaults to fetching the live site, which would make
      # an unrelated pull request fail on a deploy lag or a network blip, and
      # would silently assert something stronger than CI can know about the
      # tree it just checked out.
      - name: Verify a committed report offline, exactly as the printed footer instructs
        run: |
          set -euo pipefail
          newest=$(node -e 'const r=require("./public/reports/index.json").reports; if(!r.length){console.error("no committed reports");process.exit(1);} console.log([...r].sort((a,b)=>a.id<b.id?1:-1)[0].id)')
          echo "Verifying $newest"
          npm run verify:report -- "$newest" --from public/reports

      # Keyed on the committed FRAME, not on the carrier file: a pilot frame
      # that names no carrier, or that does not re-derive byte-for-byte from
      # the carrier it names, fails here. Needs the full history checked out
      # above, because it reads the carrier commit's own tree.
      - name: Verify every committed pilot frame derives from its carrier
        run: |
          set -euo pipefail
          # The gate requires the carrier to have LANDED, so the ref it
          # compares against must exist here. A runner's checkout does not
          # necessarily carry origin/<default branch> as a remote-tracking
          # ref, and a gate that fails for a missing ref would read as a
          # carrier defect, so fetch it explicitly first.
          git fetch --no-tags --quiet origin "${{ github.event.repository.default_branch }}"
          CALIBRATION_PILOT_UPSTREAM_REF=FETCH_HEAD npm run calibration:pilot-carrier-gate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Cloudflare Worker typecheck
        run: npm run cf:typecheck

      - name: Unit tests
        run: npm run test:unit

  pages:
    name: Build and Static Export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: GitHub Pages static export
        run: npm run build:pages

      - name: Static export smoke test
        run: npm run test:smoke:static

      # This deterministic receipt binds every byte in the tested static tree
      # to the exact clean checkout. It does not claim that Cloudflare served
      # those bytes; production-health independently proves the live SHA.
      - name: Record exact-SHA static build evidence
        run: >-
          npm run release:evidence --
          --static-dir out
          --output "$RUNNER_TEMP/site-behavior-lab-static-release-evidence.json"

      - name: Preserve exact-SHA static build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-sha-static-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-static-release-evidence.json
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Chromium Smoke Test
    runs-on: ubuntu-latest
    # A hung build or smoke run must fail this job fast, never consume the 6-hour default budget.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm run start -- --port 3100 > /tmp/site-behavior-lab.log 2>&1 &
          echo $! > /tmp/site-behavior-lab.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/site-behavior-lab.log
          exit 1

      - name: Smoke test
        run: BASE_URL=http://127.0.0.1:3100 npm run test:smoke

  docker:
    name: Docker Runtime and Public R2 Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the exact deployable image once, preserves the v1/filesystem
      # smoke, then restarts that image against a process-local S3-compatible
      # endpoint with the production public-v2/R2 gates enabled.
      - name: Smoke deployable Docker image
        run: npm run test:smoke:docker
        env:
          DOCKER_SMOKE_PUBLIC_R2: "1"

      # Scan the exact image produced and exercised by the smoke step. Both
      # fixed and unfixed HIGH/CRITICAL findings are blocking; disabling action
      # caching and DB-skip flags requires a current vulnerability database.
      - name: Scan smoke-tested container image with Trivy
        id: trivy_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: site-behavior-lab:smoke
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/trivy-container-image.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          cache: "false"
          # This pinned action version ignores the retired skip-db-update
          # inputs; a fresh DB download is its default. Keep that download
          # OUTSIDE the workspace: a DB dropped into the checkout dirties the
          # worktree and the exact-SHA evidence gate refuses a dirty tree.
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Validate Trivy container machine-readable report
        id: trivy_image_report
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/trivy-container-image.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$RUNNER_TEMP/trivy-container-image.json"

      # A second pass inventories every final-image OS package and the license
      # evidence Trivy observes for it. Trivy's raw report is deliberately not
      # the attested subject: ReportID, CreatedAt, targets, and tags are
      # scan-local noise. The repo-owned normalizer below binds only exact
      # image/layer/package facts after the container receipt exists.
      - name: Inventory smoke-tested container OS-package licenses with Trivy
        id: trivy_image_license_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: site-behavior-lab:smoke
          scanners: license
          vuln-type: os
          list-all-pkgs: "true"
          format: json
          output: ${{ runner.temp }}/trivy-container-image-licenses.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          cache: "false"
          cache-dir: ${{ runner.temp }}/trivy-license-cache

      - name: Validate Trivy container license inventory report
        id: trivy_image_license_report
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/trivy-container-image-licenses.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$RUNNER_TEMP/trivy-container-image-licenses.json"

      # Runs only after both image smoke lanes pass. The receipt records the
      # exact local image/layer identities and OCI source labels; it remains
      # distinct from the separately configured Cloudflare deployment artifact.
      - name: Record exact-SHA container build evidence
        run: >-
          npm run release:evidence --
          --container-image site-behavior-lab:smoke
          --output "$RUNNER_TEMP/site-behavior-lab-container-release-evidence.json"

      - name: Normalize exact-image OS-package license inventory
        id: container_package_inventory
        continue-on-error: true
        run: >-
          npm run supply-chain:container-inventory --
          --trivy-report "$RUNNER_TEMP/trivy-container-image-licenses.json"
          --container-evidence "$RUNNER_TEMP/site-behavior-lab-container-release-evidence.json"
          --source-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/site-behavior-lab-container-package-inventory.json"

      - name: Verify exact-image package review coverage
        id: container_package_reviews
        if: always()
        continue-on-error: true
        run: >-
          npm run supply-chain:container-reviews:check --
          --inventory "$RUNNER_TEMP/site-behavior-lab-container-package-inventory.json"

      - name: Preserve exact-SHA container build evidence
        id: container_evidence_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-sha-container-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/site-behavior-lab-container-release-evidence.json
            ${{ runner.temp }}/site-behavior-lab-container-package-inventory.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve raw container security reports
        id: trivy_image_report_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/trivy-container-image.json
            ${{ runner.temp }}/trivy-container-image-licenses.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce container security and package-evidence gates
        if: always()
        env:
          TRIVY_IMAGE_SCAN_OUTCOME: ${{ steps.trivy_image_scan.outcome }}
          TRIVY_IMAGE_REPORT_OUTCOME: ${{ steps.trivy_image_report.outcome }}
          TRIVY_IMAGE_LICENSE_SCAN_OUTCOME: ${{ steps.trivy_image_license_scan.outcome }}
          TRIVY_IMAGE_LICENSE_REPORT_OUTCOME: ${{ steps.trivy_image_license_report.outcome }}
          CONTAINER_PACKAGE_INVENTORY_OUTCOME: ${{ steps.container_package_inventory.outcome }}
          CONTAINER_PACKAGE_REVIEWS_OUTCOME: ${{ steps.container_package_reviews.outcome }}
          CONTAINER_EVIDENCE_UPLOAD_OUTCOME: ${{ steps.container_evidence_upload.outcome }}
          TRIVY_IMAGE_UPLOAD_OUTCOME: ${{ steps.trivy_image_report_upload.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            "Trivy image scan:$TRIVY_IMAGE_SCAN_OUTCOME" \
            "Trivy image report:$TRIVY_IMAGE_REPORT_OUTCOME" \
            "Trivy image license scan:$TRIVY_IMAGE_LICENSE_SCAN_OUTCOME" \
            "Trivy image license report:$TRIVY_IMAGE_LICENSE_REPORT_OUTCOME" \
            "Container package inventory:$CONTAINER_PACKAGE_INVENTORY_OUTCOME" \
            "Container package review coverage:$CONTAINER_PACKAGE_REVIEWS_OUTCOME" \
            "Exact-SHA container evidence upload:$CONTAINER_EVIDENCE_UPLOAD_OUTCOME" \
            "Raw container security report upload:$TRIVY_IMAGE_UPLOAD_OUTCOME"; do
            name=${gate%%:*}
            outcome=${gate#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error title=Container security gate failed::${name} finished with ${outcome}."
              failed=1
            fi
          done
          exit "$failed"

  # This job never checks out or executes candidate code. OIDC and attestation
  # writes are isolated here and are unavailable to pull-request code. The three
  # subjects are the exact JSON evidence manifests and normalized image-package
  # inventory produced by the gated Pages and Docker jobs; they are not the
  # Cloudflare deployment or a registry image.
  attest:
    name: Attest exact-SHA evidence manifests
    needs:
      - supply-chain
      - app
      - docker
      - smoke
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact-SHA static evidence manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exact-sha-static-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/static

      - name: Download exact-SHA container evidence manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exact-sha-container-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container

      - name: Validate exact-SHA evidence subjects
        env:
          STATIC_EVIDENCE_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/static/site-behavior-lab-static-release-evidence.json
          CONTAINER_EVIDENCE_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-release-evidence.json
          CONTAINER_PACKAGE_INVENTORY_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-package-inventory.json
        run: |
          set -euo pipefail
          test -s "$STATIC_EVIDENCE_PATH"
          test -s "$CONTAINER_EVIDENCE_PATH"
          test -s "$CONTAINER_PACKAGE_INVENTORY_PATH"
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            for (const [label, file] of [["static", process.env.STATIC_EVIDENCE_PATH], ["container", process.env.CONTAINER_EVIDENCE_PATH]]) {
              const receipt = JSON.parse(readFileSync(file, "utf8"));
              if (receipt?.source?.commit !== process.env.GITHUB_SHA) {
                throw new Error(`${label} evidence identifies ${receipt?.source?.commit ?? "no commit"}, expected ${process.env.GITHUB_SHA}`);
              }
            }
            const container = JSON.parse(readFileSync(process.env.CONTAINER_EVIDENCE_PATH, "utf8"));
            const inventoryBytes = readFileSync(process.env.CONTAINER_PACKAGE_INVENTORY_PATH);
            const inventory = JSON.parse(inventoryBytes.toString("utf8"));
            const requireKeys = (value, expected, label) => {
              if (
                !value ||
                typeof value !== "object" ||
                Array.isArray(value) ||
                JSON.stringify(Object.keys(value)) !== JSON.stringify(expected)
              ) {
                throw new Error(`${label} does not contain exactly the canonical fields in canonical order`);
              }
            };
            requireKeys(
              inventory,
              ["schemaVersion", "artifactKind", "source", "image", "scanner", "summary", "packageSetDigest", "packages"],
              "Container package inventory"
            );
            requireKeys(inventory.source, ["commit"], "Container package inventory source");
            requireKeys(
              inventory.image,
              ["id", "digest", "os", "architecture", "rootfsLayers"],
              "Container package inventory image"
            );
            requireKeys(
              inventory.scanner,
              ["name", "version", "reportSchemaVersion", "scope", "licenseMode"],
              "Container package inventory scanner"
            );
            requireKeys(
              inventory.summary,
              ["packageCount", "packagesWithDetectedLicenses", "packagesWithoutDetectedLicenses", "classifiedLicenseFindingCount"],
              "Container package inventory summary"
            );
            const artifact = container?.artifacts?.filter(
              (value) => value?.name === "container-image" && value?.kind === "docker-image-inspection"
            );
            if (!Array.isArray(artifact) || artifact.length !== 1) {
              throw new Error("Container evidence does not contain exactly one inspected image");
            }
            const image = artifact[0];
            if (
              inventory?.schemaVersion !== 1 ||
              inventory?.artifactKind !== "site-behavior-container-image-package-inventory" ||
              inventory?.source?.commit !== process.env.GITHUB_SHA ||
              inventory?.image?.id !== image.imageId ||
              inventory?.image?.digest !== image.imageId?.replace(/^sha256:/, "") ||
              inventory?.image?.os !== image.os ||
              inventory?.image?.architecture !== image.architecture ||
              JSON.stringify(inventory?.image?.rootfsLayers) !== JSON.stringify(image.rootfsLayers)
            ) {
              throw new Error("Container package inventory does not bind the exact container evidence");
            }
            if (
              inventory?.scanner?.name !== "trivy" ||
              inventory?.scanner?.version !== "0.70.0" ||
              inventory?.scanner?.reportSchemaVersion !== 2 ||
              inventory?.scanner?.scope !== "os-packages" ||
              inventory?.scanner?.licenseMode !== "standard"
            ) {
              throw new Error("Container package inventory scanner contract is not the reviewed contract");
            }
            if (!Array.isArray(inventory.packages) || inventory.packages.length === 0) {
              throw new Error("Container package inventory contains no packages");
            }
            const sha256 = (value) => createHash("sha256").update(value).digest("hex");
            let previousKey = null;
            let packagesWithDetectedLicenses = 0;
            const keys = new Set();
            for (const pkg of inventory.packages) {
              const expectedFields = [
                "key", "packageType", "name", "version", "architecture",
                "sourceName", "sourceVersion", "detectedLicenses", "evidenceDigest"
              ];
              if (
                !pkg ||
                typeof pkg !== "object" ||
                JSON.stringify(Object.keys(pkg)) !== JSON.stringify(expectedFields)
              ) {
                throw new Error("Container package inventory contains a noncanonical package row");
              }
              const requiredStrings = [pkg.packageType, pkg.name, pkg.version, pkg.architecture];
              if (
                requiredStrings.some((value) => typeof value !== "string" || value.length === 0 || value !== value.trim()) ||
                ![pkg.sourceName, pkg.sourceVersion].every(
                  (value) => value === null || (typeof value === "string" && value.length > 0 && value === value.trim())
                ) ||
                !Array.isArray(pkg.detectedLicenses) ||
                pkg.detectedLicenses.some((value) => typeof value !== "string" || value.length === 0 || value !== value.trim()) ||
                new Set(pkg.detectedLicenses).size !== pkg.detectedLicenses.length ||
                JSON.stringify([...pkg.detectedLicenses].sort()) !== JSON.stringify(pkg.detectedLicenses)
              ) {
                throw new Error(`Container package inventory row ${pkg.key ?? "(missing key)"} is malformed`);
              }
              const expectedKey = `os:${pkg.packageType}:${pkg.name}@${pkg.version}#${pkg.architecture}`;
              const evidence = {
                packageType: pkg.packageType,
                name: pkg.name,
                version: pkg.version,
                architecture: pkg.architecture,
                sourceName: pkg.sourceName,
                sourceVersion: pkg.sourceVersion,
                detectedLicenses: pkg.detectedLicenses
              };
              if (
                pkg.key !== expectedKey ||
                pkg.evidenceDigest !== sha256(JSON.stringify(evidence)) ||
                keys.has(pkg.key) ||
                (previousKey !== null && previousKey >= pkg.key)
              ) {
                throw new Error(`Container package inventory row ${pkg.key ?? "(missing key)"} has stale identity or ordering`);
              }
              keys.add(pkg.key);
              previousKey = pkg.key;
              if (pkg.detectedLicenses.length > 0) packagesWithDetectedLicenses += 1;
            }
            if (
              inventory.packageSetDigest !== sha256(JSON.stringify(inventory.packages)) ||
              inventory?.summary?.packageCount !== inventory.packages.length ||
              inventory?.summary?.packagesWithDetectedLicenses !== packagesWithDetectedLicenses ||
              inventory?.summary?.packagesWithoutDetectedLicenses !== inventory.packages.length - packagesWithDetectedLicenses ||
              !Number.isSafeInteger(inventory?.summary?.classifiedLicenseFindingCount) ||
              inventory.summary.classifiedLicenseFindingCount <= 0
            ) {
              throw new Error("Container package inventory aggregate digests or counts are stale");
            }
            if (!inventoryBytes.equals(Buffer.from(`${JSON.stringify(inventory, null, 2)}\n`, "utf8"))) {
              throw new Error("Container package inventory is not canonical JSON");
            }
          '

      - name: Attest static evidence manifest
        id: attest_static
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/static/site-behavior-lab-static-release-evidence.json

      - name: Attest container evidence manifest
        id: attest_container
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-release-evidence.json

      - name: Attest container OS-package inventory
        id: attest_container_packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-package-inventory.json

      - name: Collect attestation bundles and result references
        env:
          STATIC_BUNDLE: ${{ steps.attest_static.outputs.bundle-path }}
          STATIC_ATTESTATION_ID: ${{ steps.attest_static.outputs.attestation-id }}
          STATIC_ATTESTATION_URL: ${{ steps.attest_static.outputs.attestation-url }}
          CONTAINER_BUNDLE: ${{ steps.attest_container.outputs.bundle-path }}
          CONTAINER_ATTESTATION_ID: ${{ steps.attest_container.outputs.attestation-id }}
          CONTAINER_ATTESTATION_URL: ${{ steps.attest_container.outputs.attestation-url }}
          CONTAINER_PACKAGES_BUNDLE: ${{ steps.attest_container_packages.outputs.bundle-path }}
          CONTAINER_PACKAGES_ATTESTATION_ID: ${{ steps.attest_container_packages.outputs.attestation-id }}
          CONTAINER_PACKAGES_ATTESTATION_URL: ${{ steps.attest_container_packages.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -s "$STATIC_BUNDLE"
          test -n "$STATIC_ATTESTATION_ID"
          test -n "$STATIC_ATTESTATION_URL"
          test -s "$CONTAINER_BUNDLE"
          test -n "$CONTAINER_ATTESTATION_ID"
          test -n "$CONTAINER_ATTESTATION_URL"
          test -s "$CONTAINER_PACKAGES_BUNDLE"
          test -n "$CONTAINER_PACKAGES_ATTESTATION_ID"
          test -n "$CONTAINER_PACKAGES_ATTESTATION_URL"

          report_dir="$RUNNER_TEMP/site-behavior-lab-attestations"
          install -d -m 700 "$report_dir"
          install -m 600 "$STATIC_BUNDLE" "$report_dir/static-evidence-manifest.bundle.json"
          install -m 600 "$CONTAINER_BUNDLE" "$report_dir/container-evidence-manifest.bundle.json"
          install -m 600 "$CONTAINER_PACKAGES_BUNDLE" "$report_dir/container-package-inventory.bundle.json"
          node -e '
            const { writeFileSync } = require("node:fs");
            const result = {
              schemaVersion: 1,
              sourceCommit: process.env.GITHUB_SHA,
              subjects: {
                staticEvidenceManifest: {
                  attestationId: process.env.STATIC_ATTESTATION_ID,
                  attestationUrl: process.env.STATIC_ATTESTATION_URL
                },
                containerEvidenceManifest: {
                  attestationId: process.env.CONTAINER_ATTESTATION_ID,
                  attestationUrl: process.env.CONTAINER_ATTESTATION_URL
                },
                containerPackageInventory: {
                  attestationId: process.env.CONTAINER_PACKAGES_ATTESTATION_ID,
                  attestationUrl: process.env.CONTAINER_PACKAGES_ATTESTATION_URL
                }
              }
            };
            writeFileSync(process.argv[1], `${JSON.stringify(result, null, 2)}\n`, { encoding: "utf8", flag: "wx", mode: 0o600 });
          ' "$report_dir/attestation-results.json"

      - name: Preserve exact-SHA attestation bundles and results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-sha-provenance-attestations-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestations/
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Advance production to the tested SHA
    needs:
      - supply-chain
      - app
      - docker
      - smoke
      - attest
    # PR code never receives a write token. Pushes and explicit dispatches must
    # both target this repository's main ref before they can promote.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.SITE_BEHAVIOR_LAB_PROMOTION_PAUSED != '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Shared with promote-production.yml so direct and workflow_run fallbacks
    # cannot race one another.
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # The push below authenticates explicitly as the promotion App;
          # nothing in this job may rely on credentials quietly persisted into
          # .git/config.
          persist-credentials: false

      # v3 deprecates app-id in favor of client-id. The client-id step takes
      # over the moment the operator stores the App's client id in
      # vars.PROMOTION_APP_CLIENT_ID; until then the app-id step runs and logs
      # the action's deprecation warning. Exactly one of the two mints.
      - name: Mint promotion App token (client id)
        id: promotion_app_token_client
        if: ${{ vars.PROMOTION_APP_CLIENT_ID }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Mint promotion App token
        id: promotion_app_token
        if: ${{ !vars.PROMOTION_APP_CLIENT_ID }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Fast-forward production to the tested SHA
        env:
          CANDIDATE: ${{ github.sha }}
          APP_TOKEN: ${{ steps.promotion_app_token_client.outputs.token || steps.promotion_app_token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin production || echo "No production branch yet; this promotion creates it."

          if ! git cat-file -e "${CANDIDATE}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "::error::Tested SHA ${CANDIDATE} is not reachable from main; refusing to promote rewritten or stale history."
            exit 1
          fi

          if git rev-parse --verify --quiet origin/production >/dev/null; then
            CURRENT="$(git rev-parse origin/production)"
            if [ "$CURRENT" = "$CANDIDATE" ]; then
              echo "production already points at ${CANDIDATE}; nothing to promote."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$CURRENT" "$CANDIDATE"; then
              echo "production (${CURRENT}) is ahead of or divergent from tested SHA ${CANDIDATE}; skipping out-of-order promotion."
              exit 0
            fi
          fi

          echo "Promotion push authenticates as the dedicated promotion App."
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="${auth_header}" push origin "${CANDIDATE}:refs/heads/production"
          echo "production advanced to ${CANDIDATE}."
