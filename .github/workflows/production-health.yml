name: Production Health

on:
  schedule:
    # GitHub schedule delivery is best-effort, not a 15-minute SLA. These still
    # request four posture checks per hour; the :07 run also executes the
    # bounded synthetic when its two matching operator secrets are activated.
    - cron: "7 * * * *"
    - cron: "22,37,52 * * * *"
  workflow_dispatch:
  # An independent scheduler may dispatch this event when tighter delivery
  # guarantees are required than GitHub's best-effort cron provides.
  repository_dispatch:
    types:
      - production-health

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health
  # Never cancel a delivered probe. The :07 lane owns the bounded synthetic and
  # the R2 canary and is the slowest run of the hour, so cancel-in-progress
  # would preferentially kill exactly the run that proves the most, and a
  # cancelled run reaches the alert path as a production failure.
  cancel-in-progress: false

jobs:
  scanner:
    name: Verify scanner health and posture
    runs-on: ubuntu-latest
    # Rollout polling + contract fetches can use ~3 minutes and the synthetic
    # owns a separate five-minute total deadline. Leave explicit alerting
    # headroom instead of letting the job-level timeout race the canary.
    timeout-minutes: 12
    steps:
      - name: Resolve expected production revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: production
          # Full history so the rollout gate can prove that a live revision is
          # a genuinely earlier promotion (`git merge-base --is-ancestor`)
          # rather than an unknown or hand-rolled-back commit. `production` is
          # only ever fast-forwarded, so every prior deployment is an ancestor.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Record expected production revision and gated feature states
        env:
          PRODUCTION_CONFIG_FILE: ${{ github.workspace }}/wrangler.container.jsonc
        run: |
          set -euo pipefail
          echo "EXPECTED_PRODUCTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require("node:fs");

          const source = fs.readFileSync(process.env.PRODUCTION_CONFIG_FILE, "utf8");
          const matches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_DURABLE_JOBS"\s*:\s*"([^"]*)"/g)
          ];
          if (matches.length !== 1 || (matches[0][1] !== "0" && matches[0][1] !== "1")) {
            console.error(
              "::error title=Invalid production durable-jobs expectation::" +
                "wrangler.container.jsonc must declare SITE_BEHAVIOR_LAB_DURABLE_JOBS exactly once as \"0\" or \"1\"."
            );
            process.exit(1);
          }

          const shardingMatches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_CONTAINER_SHARDING"\s*:\s*"([^"]*)"/g)
          ];
          const shardCountMatches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_CONTAINER_SHARD_COUNT"\s*:\s*"([^"]*)"/g)
          ];
          const shardingFlag = shardingMatches[0]?.[1];
          const shardCountWire = shardCountMatches[0]?.[1];
          const shardCount = Number(shardCountWire);
          if (
            shardingMatches.length !== 1 ||
            (shardingFlag !== "0" && shardingFlag !== "1") ||
            shardCountMatches.length !== 1 ||
            !/^[1-3]$/.test(shardCountWire ?? "") ||
            !Number.isSafeInteger(shardCount) ||
            (shardingFlag === "1" && (matches[0][1] !== "1" || shardCount < 2))
          ) {
            console.error(
              "::error title=Invalid production container-sharding expectation::" +
                "wrangler.container.jsonc must declare one exact 0/1 sharding flag and one shard count from 1 to 3; enabled sharding requires durable jobs and at least two shards."
            );
            process.exit(1);
          }

          const watchMatches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_ENCRYPTED_WATCHES"\s*:\s*"([^"]*)"/g)
          ];
          if (watchMatches.length !== 1 || (watchMatches[0][1] !== "0" && watchMatches[0][1] !== "1")) {
            console.error(
              "::error title=Invalid production encrypted-watches expectation::" +
                "wrangler.container.jsonc must declare SITE_BEHAVIOR_LAB_ENCRYPTED_WATCHES exactly once as \"0\" or \"1\"."
            );
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_DURABLE_JOBS=${matches[0][1]}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_CONTAINER_SHARDING=${shardingFlag}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_CONTAINER_SHARD_COUNT=${shardCountWire}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_ENCRYPTED_WATCHES=${watchMatches[0][1]}\n`);
          NODE

      - name: Wait for exact scanner and Pages revisions
        id: rollout
        env:
          HEALTH_URL: https://scan.sitebehavior.org/api/health
          PAGES_DEPLOYMENT_URL: https://sitebehavior.org/deployment.json
          # A promoted commit is not deployed instantly: Cloudflare Pages and
          # Workers Builds each run their own build. Within this budget, an
          # older but already-promoted revision is a rollout in progress, not a
          # production failure. Past it, the deploy is genuinely stuck and the
          # monitor must say so.
          ROLLOUT_BUDGET_MINUTES: ${{ vars.PRODUCTION_ROLLOUT_BUDGET_MINUTES || '45' }}
        run: |
          set -euo pipefail
          echo "pending=false" >> "$GITHUB_OUTPUT"
          for attempt in {1..6}; do
            scanner=""
            pages=""
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$HEALTH_URL" > "$RUNNER_TEMP/production-health.json"; then
              scanner=$(jq -r '.deployment // empty' "$RUNNER_TEMP/production-health.json" 2>/dev/null || true)
            fi
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$PAGES_DEPLOYMENT_URL" > "$RUNNER_TEMP/production-pages-deployment.json"; then
              pages=$(jq -r '.deployment // empty' "$RUNNER_TEMP/production-pages-deployment.json" 2>/dev/null || true)
            fi
            if [[ "$scanner" == "$EXPECTED_PRODUCTION_SHA" && "$pages" == "$EXPECTED_PRODUCTION_SHA" ]]; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              # An in-flight rollout is provable, not assumed: both live
              # revisions must be the SAME commit and that commit must be a
              # real ancestor of the promoted head, so an unknown, forked, or
              # hand-rolled-back revision still fails immediately.
              promoted_at=$(git log -1 --format=%ct HEAD)
              age_minutes=$(( ( $(date +%s) - promoted_at ) / 60 ))
              if [[ -n "$scanner" && "$scanner" == "$pages" ]] &&
                git merge-base --is-ancestor "$scanner" HEAD 2>/dev/null &&
                (( age_minutes < ROLLOUT_BUDGET_MINUTES )); then
                echo "pending=true" >> "$GITHUB_OUTPUT"
                echo "::warning title=Production rollout in progress::production serves ${scanner}; ${EXPECTED_PRODUCTION_SHA} was promoted ${age_minutes}m ago and is still deploying (budget ${ROLLOUT_BUDGET_MINUTES}m)."
                {
                  echo "- Rollout: **in progress** (production serves \`${scanner}\`, promoted \`${EXPECTED_PRODUCTION_SHA}\` is ${age_minutes}m old)"
                  echo "- Posture checks: **deferred** until the promoted revision is live"
                } >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              echo "::error title=Production rollout stale::expected $EXPECTED_PRODUCTION_SHA, scanner=${scanner:-unavailable}, Pages=${pages:-unavailable}"
              exit 1
            fi
            echo "Waiting for production rollout (attempt $attempt/6): scanner=${scanner:-unavailable}, Pages=${pages:-unavailable}"
            sleep 15
          done

      - name: Fetch live Pages report contract
        # Every check below asserts the contract of the PROMOTED revision. While
        # that revision is still deploying they would be asserted against the
        # previous one, so they are deferred rather than evaluated against the
        # wrong source.
        if: steps.rollout.outputs.pending != 'true'
        env:
          SCHEMA_URL: https://sitebehavior.org/scan-report.schema.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 75 \
            "$SCHEMA_URL" > "$RUNNER_TEMP/production-scan-report-schema.json"

      - name: Probe visitor-facing ingress dependencies without submitting a scan
        if: steps.rollout.outputs.pending != 'true'
        env:
          PUBLIC_INGRESS_URL: https://scan.sitebehavior.org/api/health/public-ingress
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 10 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 25 \
            "$PUBLIC_INGRESS_URL" > "$RUNNER_TEMP/production-public-ingress.json"

      - name: Validate availability and production posture
        id: posture
        if: steps.rollout.outputs.pending != 'true'
        env:
          HEALTH_FILE: ${{ runner.temp }}/production-health.json
          PAGES_DEPLOYMENT_FILE: ${{ runner.temp }}/production-pages-deployment.json
          SCHEMA_FILE: ${{ runner.temp }}/production-scan-report-schema.json
          PUBLIC_INGRESS_FILE: ${{ runner.temp }}/production-public-ingress.json
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function readJson(path, label) {
            try {
              return JSON.parse(fs.readFileSync(path, "utf8"));
            } catch (error) {
              console.error(`::error title=${label} is not valid JSON::${error.message}`);
              process.exit(1);
            }
          }

          const health = readJson(process.env.HEALTH_FILE, "Health response");
          const pagesDeployment = readJson(process.env.PAGES_DEPLOYMENT_FILE, "Pages deployment provenance");
          const schema = readJson(process.env.SCHEMA_FILE, "Pages report schema");
          const publicIngress = readJson(process.env.PUBLIC_INGRESS_FILE, "Public ingress preflight");
          const expectedDeployment = process.env.EXPECTED_PRODUCTION_SHA;
          const expectedDurableJobs = process.env.EXPECTED_DURABLE_JOBS;
          const expectedContainerSharding = process.env.EXPECTED_CONTAINER_SHARDING;
          const expectedContainerShardCount = Number(process.env.EXPECTED_CONTAINER_SHARD_COUNT);
          const expectedEncryptedWatches = process.env.EXPECTED_ENCRYPTED_WATCHES;
          const failures = [];
          const assertPosture = (condition, message) => {
            if (!condition) failures.push(message);
          };

          assertPosture(health?.ok === true, "ok must be true");
          assertPosture(health?.status === "ok", `status must be ok (received ${JSON.stringify(health?.status)})`);
          assertPosture(health?.scansAvailable === true, "scansAvailable must be true");
          assertPosture(Array.isArray(health?.warnings) && health.warnings.length === 0, "warnings must be an empty array");
          assertPosture(health?.authenticated === false, "temporary access-token authentication must be disabled");
          assertPosture(health?.openAccess === true, "public scan access must be enabled");
          assertPosture(health?.turnstile === true, "Turnstile must be enabled");
          assertPosture(health?.storage === "r2", "report storage must be R2");
          assertPosture(health?.checks?.scanAccess === "open", "scan access check must report open");
          assertPosture(health?.checks?.adblock?.active === true, "adblock engine must be active");
          assertPosture(health?.checks?.adblock?.engine === "loaded", "adblock engine must report loaded");
          assertPosture(health?.checks?.chromiumSandbox === "enabled", "Chromium sandbox must be enabled");
          assertPosture(health?.checks?.reportStore?.kind === "r2", "report store check must report R2");
          assertPosture(health?.checks?.reportStore?.configuredPath === true, "R2 report path must be configured");
          assertPosture(health?.checks?.reportStore?.maxAgeDays === 7, "R2 report retention must be seven days");
          // This endpoint intentionally proves configuration only. The scoped
          // synthetic lane below separately proves scan execution, remote R2
          // write/readback, and report rendering when its credential is active.
          assertPosture(health?.checks?.scannerEgress === "configured", "scanner egress proxy must be configured");
          assertPosture(health?.checks?.scannerEgressRegion === "configured",
            "scanner egress region must be recorded so r2 comparison metrics remain eligible");
          assertPosture(health?.checks?.consentVerification === "enabled",
            "consent registration verification must be enabled");
          assertPosture(health?.checks?.publicR2Reports?.status === "enabled",
            "public ScanReport v2/r2 production must be enabled");
          assertPosture(health?.checks?.v2ShadowEmission?.status === "disabled",
            "private v2 shadow emission must be disabled during normal public operation");
          assertPosture(health?.checks?.durableJobs?.faultInjection === undefined,
            "production must never advertise the staging replay-fault hook");
          if (expectedDurableJobs === "1") {
            assertPosture(health?.checks?.durableJobs?.requested === true,
              "durable jobs must report requested when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.enabled === true,
              "durable jobs must report enabled when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.readiness === "ready",
              "durable jobs must report ready when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.coordinatorOrigin === "https://scan.sitebehavior.org",
              "durable jobs must use the exact production coordinator origin");
          } else if (expectedDurableJobs === "0") {
            assertPosture(health?.checks?.durableJobs?.requested === false,
              "durable jobs must not report requested while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.enabled === false,
              "durable jobs must not report enabled while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.readiness === "disabled",
              "durable jobs must report disabled while disabled in production config");
          } else {
            failures.push(`production durable-jobs expectation must be 0 or 1 (received ${JSON.stringify(expectedDurableJobs)})`);
          }
          if (expectedContainerSharding === "1") {
            assertPosture(expectedDurableJobs === "1",
              "container sharding must not be enabled unless durable jobs are enabled");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.requested === true,
              "container sharding must report requested when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.enabled === true,
              "container sharding must report enabled when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.readiness === "ready",
              "container sharding must report ready when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.shardCount === expectedContainerShardCount,
              `container sharding must report configured count ${expectedContainerShardCount}`);
          } else if (expectedContainerSharding === "0") {
            assertPosture(health?.checks?.durableJobs?.containerSharding?.requested === false,
              "container sharding must not report requested while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.enabled === false,
              "container sharding must not report enabled while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.readiness === "disabled",
              "container sharding must report disabled while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.shardCount === 1,
              "disabled container sharding must collapse effective topology to one shard");
          } else {
            failures.push(`production container-sharding expectation must be 0 or 1 (received ${JSON.stringify(expectedContainerSharding)})`);
          }
          if (expectedEncryptedWatches === "1") {
            assertPosture(health?.checks?.encryptedWatches?.requested === true,
              "encrypted watches must report requested when enabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.enabled === true,
              "encrypted watches must report enabled when enabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.readiness === "ready",
              "encrypted watches must report ready when enabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.creationAuthorization === "public",
              "production encrypted watches must use the public Turnstile and atomic-quota creation path");
            assertPosture(health?.capabilities?.scheduledRescans === true,
              "scheduled rescans must be advertised when encrypted watches are ready");
          } else if (expectedEncryptedWatches === "0") {
            assertPosture(health?.checks?.encryptedWatches?.requested === false,
              "encrypted watches must not report requested while disabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.enabled === false,
              "encrypted watches must not report enabled while disabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.readiness === "disabled",
              "encrypted watches must report disabled while disabled in production config");
            assertPosture(health?.capabilities?.scheduledRescans === false,
              "scheduled rescans must not be advertised while encrypted watches are disabled");
          } else {
            failures.push(`production encrypted-watches expectation must be 0 or 1 (received ${JSON.stringify(expectedEncryptedWatches)})`);
          }
          assertPosture(schema?.$id === "https://sitebehavior.org/schemas/scan-report.v2.r2.schema.json",
            "live Pages must advertise the ScanReport v2/r2 contract");
          assertPosture(Number.isFinite(health?.limits?.publicScanRateLimitPerMinute) && health.limits.publicScanRateLimitPerMinute > 0,
            "per-minute public scan rate limit must be active");
          assertPosture(Number.isFinite(health?.limits?.publicScanRateLimitPerDay) && health.limits.publicScanRateLimitPerDay > 0,
            "daily public scan rate limit must be active");
          // This visitor-facing preflight intentionally does not solve a
          // CAPTCHA or submit a scan. It independently proves that Siteverify
          // recognizes the configured secret and that the public quota ledger
          // is reachable through a non-consuming, public-scope peek.
          assertPosture(publicIngress?.ok === true && publicIngress?.status === "ready",
            "visitor-facing public ingress preflight must be ready");
          assertPosture(publicIngress?.scope === "public-ingress-preflight",
            "public ingress preflight must report its exact limited scope");
          assertPosture(publicIngress?.checks?.openAccess === true,
            "public ingress preflight must observe open access");
          assertPosture(publicIngress?.checks?.turnstile?.configuration === "verified",
            "Siteverify must recognize the configured Turnstile secret");
          assertPosture(publicIngress?.checks?.turnstile?.challengeSolved === false,
            "public ingress preflight must not claim to solve a visitor challenge");
          assertPosture(publicIngress?.checks?.quota?.readiness === "ready",
            "public quota ledger must accept a non-consuming readiness peek");
          assertPosture(publicIngress?.checks?.quota?.consumed === false,
            "public ingress preflight must not consume visitor quota");
          assertPosture(publicIngress?.checks?.monitorBypassUsed === false,
            "public ingress preflight must not use the operator monitor bypass");
          assertPosture(publicIngress?.checks?.scanSubmitted === false,
            "public ingress preflight must not claim a visitor scan was submitted");
          assertPosture(typeof health?.deployment === "string" && /^[0-9a-f]{40}$/.test(health.deployment),
            "live deployment must report a full commit SHA");
          assertPosture(health?.deployment === expectedDeployment,
            `scanner deployment must match production (${expectedDeployment}, received ${health?.deployment})`);
          assertPosture(pagesDeployment?.schemaVersion === 1,
            "Pages deployment provenance must use schema version 1");
          assertPosture(typeof pagesDeployment?.deployment === "string" && /^[0-9a-f]{40}$/.test(pagesDeployment.deployment),
            "Pages deployment must report a full commit SHA");
          assertPosture(pagesDeployment?.deployment === expectedDeployment,
            `Pages deployment must match production (${expectedDeployment}, received ${pagesDeployment?.deployment})`);

          const timestamp = Date.parse(health?.timestamp);
          const ageMs = Date.now() - timestamp;
          assertPosture(Number.isFinite(timestamp), "health timestamp must be a valid date");
          assertPosture(ageMs >= -60_000, "health timestamp must not be more than one minute in the future");
          assertPosture(ageMs <= 5 * 60_000, "health timestamp must be no more than five minutes old");

          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error title=Production health regression::${failure}`);
            console.error(JSON.stringify(health, null, 2));
            process.exit(1);
          }

          const summary = [
            "## Production scanner health",
            "",
            "- Status: **ok**",
            "- Public scanning: **available** (Turnstile protected)",
            "- Visitor ingress preflight: **ready** (Siteverify secret recognized; public quota store reachable without consuming quota)",
            "- Visitor challenge/scan: **not exercised** (no CAPTCHA solved and no public scan submitted)",
            "- Public report contract: **ScanReport v2/r2**",
            "- Scanner egress region: **configured**",
            "- Consent registration verification: **enabled**",
            `- Durable jobs: **${expectedDurableJobs === "1" ? "ready" : "disabled"}** (matches production config)`,
            `- Container sharding: **${expectedContainerSharding === "1" ? `${expectedContainerShardCount} shards ready` : "disabled"}** (matches production config)`,
            `- Encrypted scheduled rescans: **${expectedEncryptedWatches === "1" ? "ready" : "disabled"}** (matches production config)`,
            "- Pages report contract: **v2/r2**",
            "- Report storage: **R2**, seven-day retention",
            `- Scanner deployment: \`${health.deployment}\``,
            `- Pages deployment: \`${pagesDeployment.deployment}\``,
            "- Warnings: **none**"
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(`Production scanner is healthy at ${health.timestamp}.`);
          NODE

      - name: Resolve synthetic-monitor activation
        id: synthetic_monitor
        if: >-
          steps.rollout.outputs.pending != 'true' &&
          (github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '7 * * * *' ||
          github.event.client_payload.synthetic == true)
        env:
          PRODUCTION_SYNTHETIC_MONITOR_TOKEN: ${{ secrets.PRODUCTION_SYNTHETIC_MONITOR_TOKEN }}
          PRODUCTION_SYNTHETIC_MONITOR_REQUIRED: ${{ vars.PRODUCTION_SYNTHETIC_MONITOR_REQUIRED }}
        run: |
          if [[ -n "$PRODUCTION_SYNTHETIC_MONITOR_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [[ "$PRODUCTION_SYNTHETIC_MONITOR_REQUIRED" == "1" ]]; then
              echo "::error title=Production synthetic credential missing::The monitor was activated but its GitHub secret is unavailable."
              exit 1
            fi
            echo "::warning title=Operator synthetic not activated::Configure matching Cloudflare SITE_BEHAVIOR_LAB_SYNTHETIC_MONITOR_TOKEN and GitHub PRODUCTION_SYNTHETIC_MONITOR_TOKEN secrets."
            echo "- Operator-only synthetic: **not activated** (operator secrets are missing)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run production scan, R2 readback, and report-page synthetic
        id: synthetic_run
        if: steps.synthetic_monitor.outputs.configured == 'true'
        env:
          SCAN_BASE_URL: https://scan.sitebehavior.org
          PRODUCTION_SYNTHETIC_MONITOR_TOKEN: ${{ secrets.PRODUCTION_SYNTHETIC_MONITOR_TOKEN }}
          PRODUCTION_SYNTHETIC_REQUEST_TIMEOUT_MS: "15000"
          PRODUCTION_SYNTHETIC_TOTAL_TIMEOUT_MS: "300000"
        run: |
          npm run test:smoke:production-synthetic
          echo "- Operator-only synthetic: **passed** (fixed scan contract, persisted report, and render readback)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve R2 delete-canary activation
        id: r2_delete_canary
        if: >-
          steps.rollout.outputs.pending != 'true' &&
          (github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '7 * * * *' ||
          github.event.client_payload.synthetic == true)
        env:
          PRODUCTION_R2_DELETE_CANARY_URL: ${{ vars.PRODUCTION_R2_DELETE_CANARY_URL }}
          PRODUCTION_R2_DELETE_CANARY_TOKEN: ${{ secrets.PRODUCTION_R2_DELETE_CANARY_TOKEN }}
          PRODUCTION_R2_DELETE_CANARY_REQUIRED: ${{ vars.PRODUCTION_R2_DELETE_CANARY_REQUIRED }}
        run: |
          set -euo pipefail
          # Activation order mirrors the synthetic monitor above it, and the
          # runbook: the dedicated canary Worker must pass a direct readback
          # BEFORE PRODUCTION_R2_DELETE_CANARY_REQUIRED is set. An operator who
          # has not reached that step has an un-activated canary, which is a
          # disclosed gap, not a production incident. Once required, a missing
          # or broken credential IS a failure.
          if [[ "$PRODUCTION_R2_DELETE_CANARY_REQUIRED" != "1" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Operator R2 delete canary not activated::Deploy the dedicated canary Worker, verify a direct write/read/delete readback, then set PRODUCTION_R2_DELETE_CANARY_REQUIRED=1."
            echo "- R2 write/read/delete canary: **not activated** (operator configuration is incomplete)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$PRODUCTION_R2_DELETE_CANARY_URL" || -z "$PRODUCTION_R2_DELETE_CANARY_TOKEN" ]]; then
            echo "::error title=Production R2 delete canary missing::The required dedicated Worker URL and token must both be configured."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run isolated production R2 write/read/delete canary
        id: r2_delete_canary_run
        if: steps.r2_delete_canary.outputs.configured == 'true'
        env:
          PRODUCTION_R2_DELETE_CANARY_URL: ${{ vars.PRODUCTION_R2_DELETE_CANARY_URL }}
          PRODUCTION_R2_DELETE_CANARY_TOKEN: ${{ secrets.PRODUCTION_R2_DELETE_CANARY_TOKEN }}
          PRODUCTION_R2_DELETE_CANARY_TIMEOUT_MS: "30000"
        run: |
          node scripts/smoke-production-r2-delete.mjs
          echo "- R2 write/read/delete canary: **passed** (one isolated health object, absence verified)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare public-safe production-health alert
        id: production_health_alert
        if: always()
        env:
          HEALTH_JOB_STATUS: ${{ job.status }}
          HEALTH_REPORT_FILE: ${{ runner.temp }}/production-health-alert.md
          ROLLOUT_PENDING: ${{ steps.rollout.outputs.pending }}
          POSTURE_OUTCOME: ${{ steps.posture.outcome }}
          SYNTHETIC_OUTCOME: ${{ steps.synthetic_run.outcome }}
          R2_DELETE_CANARY_OUTCOME: ${{ steps.r2_delete_canary_run.outcome }}
        run: |
          set -euo pipefail
          # Which lanes this invocation actually EXECUTED. Only these may be
          # claimed as proven, and only an issue whose recorded lanes are all
          # covered here may be closed. A skipped step reports "skipped"; a
          # step that never ran at all reports the empty string.
          lanes=()
          [[ "$POSTURE_OUTCOME" == "success" || "$POSTURE_OUTCOME" == "failure" ]] && lanes+=("posture")
          [[ "$SYNTHETIC_OUTCOME" == "success" || "$SYNTHETIC_OUTCOME" == "failure" ]] && lanes+=("synthetic")
          [[ "$R2_DELETE_CANARY_OUTCOME" == "success" || "$R2_DELETE_CANARY_OUTCOME" == "failure" ]] && lanes+=("r2-delete")
          [[ "$ROLLOUT_PENDING" == "true" ]] && lanes+=("rollout-pending")
          coverage="$(IFS=,; echo "${lanes[*]:-none}")"
          echo "coverage=${coverage}" >> "$GITHUB_OUTPUT"

          if [[ "$HEALTH_JOB_STATUS" == "cancelled" ]]; then
            # A cancelled run measured nothing. Reporting it as a production
            # failure would file an incident for an infrastructure event.
            echo "failed=cancelled" >> "$GITHUB_OUTPUT"
            echo "::warning title=Production health run cancelled::No production claim was measured; the canonical issue is left unchanged."
            exit 0
          fi
          if [[ "$HEALTH_JOB_STATUS" == "success" ]]; then
            failed=false
            outcome=completed
            summary="Every production check this run executed completed successfully."
          else
            failed=true
            outcome=failed
            summary="A delivered production posture check, visitor-ingress preflight, activated operator canary, or required alerting step failed."
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s\n' \
            '<!-- site-behavior-lab:production-health -->' \
            '# Production health monitor' \
            '' \
            "$summary" \
            '' \
            "- Outcome: **${outcome}**" \
            "- Checks executed: **${coverage}**" \
            "- Workflow run: [run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}](${run_url})" \
            '' \
            'The issue intentionally contains only aggregate status; inspect the linked private workflow logs for bounded diagnostics.' \
            > "$HEALTH_REPORT_FILE"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Reconcile the production-health issue
        id: production_health_issue
        if: always() && steps.production_health_alert.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Repair the production health monitor
          MANAGED_ISSUE_LABEL: site-behavior-lab-production-health
          HEALTH_REPORT_FILE: ${{ runner.temp }}/production-health-alert.md
          HEALTH_FAILED: ${{ steps.production_health_alert.outputs.failed }}
          HEALTH_COVERAGE: ${{ steps.production_health_alert.outputs.coverage }}
          COVERAGE_MARKER_PREFIX: "<!-- site-behavior-lab:production-health-required-lanes: "
        run: |
          set -euo pipefail
          if [[ "$HEALTH_FAILED" == "cancelled" ]]; then
            echo "The run was cancelled; leaving the canonical issue untouched."
            exit 0
          fi
          if ! gh api --silent "repos/${GITHUB_REPOSITORY}/labels/${MANAGED_ISSUE_LABEL}"; then
            gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f "name=${MANAGED_ISSUE_LABEL}" \
              -f color=7a1fa2 \
              -f description="Managed by the Site Behavior Lab production-health workflow" || \
              gh api --silent "repos/${GITHUB_REPOSITORY}/labels/${MANAGED_ISSUE_LABEL}"
          fi
          candidates=$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          match=$(printf '%s' "$candidates" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const marker = "<!-- site-behavior-lab:production-health -->";
              const managedLabel = process.env.MANAGED_ISSUE_LABEL;
              const trusted = JSON.parse(source)
                .flat()
                .map((issue) => {
                  const labels = Array.isArray(issue.labels)
                    ? issue.labels.map((label) => typeof label === "string" ? label : label?.name)
                    : [];
                  return !issue.pull_request &&
                    issue.user?.login === "github-actions[bot]" &&
                    issue.user?.type === "Bot" &&
                    typeof issue.body === "string" &&
                    issue.body.includes(marker) ? { issue, labels } : null;
                })
                .filter(Boolean);
              const managed = trusted.filter(({ labels }) => labels.includes(managedLabel));
              const legacy = trusted.filter(({ issue, labels }) =>
                !labels.includes(managedLabel) && issue.title === process.env.ISSUE_TITLE);
              if (managed.length > 1 || legacy.length > 1 || (managed.length === 1 && legacy.length === 1)) {
                throw new Error("Found conflicting canonical production-health issues; expected at most one trusted managed or legacy issue.");
              }
              const selected = managed[0] ?? legacy[0];
              if (selected) {
                // Lanes the open issue is waiting on. Absent on a legacy or
                // pre-upgrade body, which then requires no specific lane.
                const prefix = process.env.COVERAGE_MARKER_PREFIX;
                const line = selected.issue.body
                  .split("\n")
                  .map((value) => value.trim())
                  .find((value) => value.startsWith(prefix));
                const required = line ? line.slice(prefix.length).replace(/-->$/, "").trim() : "";
                process.stdout.write(
                  `${selected.issue.number}|${selected.issue.state}|${legacy.length === 1 ? "true" : "false"}|${required}`
                );
              }
            });
          ')
          IFS='|' read -r issue_number issue_state issue_needs_label issue_required_lanes <<< "$match"
          if [[ -z "$match" ]]; then
            issue_number=""
            issue_state=""
            issue_needs_label="false"
            issue_required_lanes=""
          elif [[ "$issue_needs_label" == "true" ]]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label "$MANAGED_ISSUE_LABEL"
          fi

          covers_required_lanes() {
            # Every lane the open issue is waiting on must have been executed by
            # THIS run. Three of the four hourly runs never execute the deep
            # lanes, so without this a shallow pass would retract a synthetic or
            # canary alarm it never re-measured.
            local required="$1" executed="$2" lane
            [[ -z "$required" ]] && return 0
            IFS=',' read -ra required_lanes <<< "$required"
            for lane in "${required_lanes[@]}"; do
              [[ -z "$lane" || "$lane" == "none" || "$lane" == "rollout-pending" ]] && continue
              [[ ",${executed}," == *",${lane},"* ]] || return 1
            done
            return 0
          }

          if [[ "$HEALTH_FAILED" == "true" ]]; then
            # A failing run must not shrink what an open issue is waiting on:
            # a shallow failure that superseded a deep one would otherwise let
            # the next shallow pass close an unproven deep lane.
            required_lanes="$HEALTH_COVERAGE"
            if [[ "$issue_state" == "open" && -n "$issue_required_lanes" ]]; then
              required_lanes=$(printf '%s\n%s\n' "${issue_required_lanes//,/$'\n'}" "${HEALTH_COVERAGE//,/$'\n'}" |
                grep -v '^$' | grep -v '^none$' | sort -u | paste -sd, -)
            fi
            printf '\n%s%s -->\n' "$COVERAGE_MARKER_PREFIX" "${required_lanes:-none}" >> "$HEALTH_REPORT_FILE"
            if [[ -z "$issue_number" ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$HEALTH_REPORT_FILE" --label "$MANAGED_ISSUE_LABEL"
            else
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$HEALTH_REPORT_FILE"
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$issue_number" --repo "$GITHUB_REPOSITORY" --comment "Production health is failing again; the issue body links to the current run."
              fi
            fi
          elif [[ "$HEALTH_FAILED" == "false" ]]; then
            if [[ -n "$issue_number" && "$issue_state" == "open" ]]; then
              if covers_required_lanes "$issue_required_lanes" "$HEALTH_COVERAGE"; then
                gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$HEALTH_REPORT_FILE"
                gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "The production health monitor recovered; this run re-ran every check the issue was waiting on (${HEALTH_COVERAGE})."
              else
                echo "::notice title=Production health issue kept open::this run executed ${HEALTH_COVERAGE} but the open issue is waiting on ${issue_required_lanes}."
                echo "- Canonical issue: **kept open** (waiting on ${issue_required_lanes}, this run executed ${HEALTH_COVERAGE})" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "::error title=Invalid production health status::The alert preparer returned an invalid failure status."
            exit 1
          fi

      - name: Preserve production-health failure
        if: >-
          always() &&
          (job.status != 'success' ||
          steps.production_health_alert.outcome != 'success' ||
          steps.production_health_issue.outcome != 'success' ||
          steps.production_health_alert.outputs.failed == 'true')
        run: |
          echo "::error title=Production health failed::The delivered monitor or its canonical issue reconciliation did not complete."
          exit 1
