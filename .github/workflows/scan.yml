name: Run Site Scan

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public URL to scan
        required: true
        type: string
      device:
        description: Viewport
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - mobile
      report_mode:
        description: Report contract (v1 is a manual compatibility lane only)
        required: true
        default: r2
        type: choice
        options:
          - r2
          - v1
      gpc_enabled:
        description: Send Global Privacy Control for single scans
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      compare_gpc:
        description: Run a GPC off/on comparison
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      compare_shields:
        description: Run a Shields off/on comparison (takes precedence over consent and GPC)
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      compare_consent:
        description: Run a consent accept-all/reject-all comparison (takes precedence over GPC)
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  repository_dispatch:
    types:
      - site-behavior-scan

permissions:
  contents: read

# All three repo-writing workflows (scan, scan-featured, update-brave-lists)
# share one concurrency group per ref so their commit+push steps never race.
# A human push can still land mid-run, so publication fails closed on NFF.
concurrency:
  group: site-behavior-repo-writers-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Committed-report acquisition is forbidden from launching Chromium without
  # its namespace/seccomp sandbox. Preflight and runtime health both assert it.
  SITE_BEHAVIOR_LAB_CHROMIUM_SANDBOX: "1"
  # Internal scanner builds still render canonical metadata. Keep the build
  # fail-closed on the same public origin as CI and the deployed Pages site.
  NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: "https://sitebehavior.org"
  # Repository dispatch is always r2. Only an explicit human dispatch may
  # select frozen v1 compatibility; missing payload/config never downgrades a
  # committed report.
  FEATURED_REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.report_mode || 'r2' }}
  FEATURED_R2_EGRESS_ATTESTED: ${{ vars.FEATURED_R2_EGRESS_ATTESTED || '' }}
  # The preflight refuses the manual v1 compatibility lane during a
  # measurement freeze; the publish job below is gated on the same variable.
  SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE: ${{ vars.SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE || '' }}
  SITE_BEHAVIOR_LAB_BUILD_COMMIT: ${{ github.sha }}
  SCAN_URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
  SCAN_DEVICE: ${{ github.event.inputs.device || github.event.client_payload.device || 'desktop' }}
  SCAN_GPC_ENABLED: ${{ github.event.inputs.gpc_enabled || github.event.client_payload.gpc_enabled || 'true' }}
  SCAN_COMPARE_GPC: ${{ github.event.inputs.compare_gpc || github.event.client_payload.compare_gpc || 'false' }}
  SCAN_COMPARE_SHIELDS: ${{ github.event.inputs.compare_shields || github.event.client_payload.compare_shields || 'false' }}
  SCAN_COMPARE_CONSENT: ${{ github.event.inputs.compare_consent || github.event.client_payload.compare_consent || 'false' }}
  # Disclose the CI runner egress exactly as the featured-gallery workflow does.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS: ${{ vars.SCANNER_EGRESS || 'github-actions-ubuntu' }}
  # GitHub-hosted runners have no reliable region metadata, so the recorded r2
  # egress region stays empty (and comparison deltas stay refused) unless the
  # operator declares one that truthfully names the runner egress.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION: ${{ vars.SCANNER_EGRESS_REGION || '' }}

jobs:
  scan:
    name: Generate Static Report
    permissions:
      contents: read
    outputs:
      publication_artifact_id: ${{ steps.publication_artifact.outputs.artifact-id }}
      publication_artifact_digest: ${{ steps.publication_artifact.outputs.artifact-digest }}
      # The name is minted HERE, once. A publish-only rerun keeps this job's
      # outputs from its successful attempt; a publisher that rebuilt the name
      # from its own github.run_attempt would look for an artifact that was
      # never uploaded under the rerun's attempt number.
      publication_artifact_name: site-behavior-report-publication-${{ github.run_id }}-${{ github.run_attempt }}
    # A missing controlled-runner label falls back to GitHub-hosted execution
    # only so the r2 preflight can fail visibly; it never falls back to v1.
    # Explicit manual v1 compatibility remains on GitHub-hosted Ubuntu.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.report_mode == 'v1' && 'ubuntu-latest' || vars.FEATURED_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      # One dist/schema build for the WHOLE job (RFC 10.3): every later step
      # (the scan publisher, prune, manifest, corpus stats) sees the env flag
      # and skips its own compile of the same artifact.
      - name: Build the dist/schema artifact once
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Prepare committed report production
        # Exact HEAD, a clean checkout, consent verification, and truthful
        # r2 egress are checked before Next or Chromium can scan.
        run: node dist/schema/lib/featured-report-preflight-cli.js

      - name: Verify server-owned acquisition provenance
        run: |
          node -e '
            const { runtimeReportAcquisition } = require("./dist/schema/lib/scan-report-acquisition.js");
            const mode = process.env.FEATURED_REPORT_MODE;
            const expected = mode === "r2" ? "ci-workflow" : "public-api";
            const actual = runtimeReportAcquisition(mode);
            if (actual !== expected) throw new Error(`Report acquisition is ${actual}, expected ${expected}.`);
          '

      # GitHub-hosted Ubuntu 24.04 restricts unprivileged user namespaces with
      # AppArmor, so Chromium's namespace sandbox cannot initialize and EVERY
      # scan dies at browser launch ("No usable sandbox!"), which reaches the
      # client as the generic 500 and reads like a scanner outage.
      #
      # This workflow already REQUIRES the sandbox (SITE_BEHAVIOR_LAB_CHROMIUM_SANDBOX
      # above, asserted again by the runtime health check below) but never
      # prepared the host for it, so every hosted one-off scan failed once that
      # requirement was enabled. Make the environment support sandboxing rather
      # than launch without it, exactly as scan-featured.yml does; Chromium's
      # sandbox-disabling alternative is what this repository refuses.
      - name: Allow the Chromium sandbox to initialize on the hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          current="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
          if [[ "$current" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unavailable)"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build scanner app
        run: npm run build

      - name: Start scanner app
        run: |
          if node -e '
            const socket = require("node:net").createConnection({ host: "127.0.0.1", port: 3100 });
            socket.setTimeout(1000);
            socket.once("connect", () => { socket.destroy(); process.exit(0); });
            socket.once("error", () => process.exit(1));
            socket.once("timeout", () => { socket.destroy(); process.exit(1); });
          '; then
            echo "::error::Port 3100 was already occupied before startup; refusing a stale scanner process."
            exit 1
          fi
          expected_egress_region="$SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION"
          if [[ -z "$expected_egress_region" ]]; then
            # Actions exports configured empty strings. The scanner treats an
            # explicit blank as invalid, so omit it for the manual v1
            # compatibility lane whose region is intentionally unrecorded.
            unset SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION
          fi
          node node_modules/next/dist/bin/next start --port 3100 > /tmp/site-behavior-lab-scan.log 2>&1 &
          app_pid=$!
          echo "$app_pid" > /tmp/site-behavior-lab-scan.pid
          health_path="${RUNNER_TEMP}/site-behavior-lab-scan-health.json"
          for attempt in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The scanner process exited before it became ready; refusing a response from any stale port owner."
              cat /tmp/site-behavior-lab-scan.log
              exit 1
            fi
            if curl -fsS --connect-timeout 2 --max-time 5 \
              --output "$health_path" http://127.0.0.1:3100/api/health; then
              if node -e '
                const fs = require("node:fs");
                const [file, expectedSha, requestedMode, expectedRegion] = process.argv.slice(1);
                let health;
                try {
                  health = JSON.parse(fs.readFileSync(file, "utf8"));
                } catch (error) {
                  console.error(`Health response is not valid JSON: ${error instanceof Error ? error.message : error}`);
                  process.exit(1);
                }
                const failures = [];
                const expect = (condition, message) => { if (!condition) failures.push(message); };
                expect(health?.ok === true, "health.ok is not true");
                expect(health?.deployment === expectedSha.toLowerCase(), `deployment is ${health?.deployment ?? "missing"}, expected ${expectedSha}`);
                expect(health?.scansAvailable === true, "scansAvailable is not true");
                expect(health?.checks?.chromiumSandbox === "enabled", `Chromium sandbox is ${health?.checks?.chromiumSandbox ?? "missing"}, expected enabled`);
                const mode = requestedMode.trim().toLowerCase();
                expect(mode === "v1" || mode === "r2", `unsupported requested mode ${requestedMode}`);
                const expectedR2Status = mode === "r2" ? "enabled" : "disabled";
                expect(health?.checks?.publicR2Reports?.status === expectedR2Status, `public r2 status is ${health?.checks?.publicR2Reports?.status ?? "missing"}, expected ${expectedR2Status}`);
                const expectedRegionStatus = expectedRegion.trim() ? "configured" : "unrecorded";
                expect(health?.checks?.scannerEgressRegion === expectedRegionStatus, `egress-region status is ${health?.checks?.scannerEgressRegion ?? "missing"}, expected ${expectedRegionStatus}`);
                const expectedConsentStatus = mode === "r2" ? "enabled" : "disabled";
                expect(health?.checks?.consentVerification === expectedConsentStatus, `consent-verification status is ${health?.checks?.consentVerification ?? "missing"}, expected ${expectedConsentStatus}`);
                if (mode === "r2") expect(expectedRegion.trim() !== "", "r2 requires an expected stable egress region");
                if (failures.length) {
                  console.error(`Scanner health contract rejected: ${failures.join("; ")}`);
                  process.exit(1);
                }
              ' "$health_path" "$GITHUB_SHA" "$FEATURED_REPORT_MODE" "$expected_egress_region" && kill -0 "$app_pid" 2>/dev/null; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "::error::The scanner did not satisfy the expected process and health contract."
          cat /tmp/site-behavior-lab-scan.log
          exit 1

      - name: Run scan
        id: scan
        run: npm run scan:ci
        env:
          BASE_URL: http://127.0.0.1:3100

      - name: Verify report redaction and provenance
        run: npm run reports:remediate -- --check

      - name: Build static report manifest
        run: npm run reports:manifest

      - name: Build corpus stats
        run: npm run corpus:stats

      - name: Prepare bounded data-only publication artifact
        env:
          REPORT_ID: ${{ steps.scan.outputs.report_id }}
        run: |
          npm run reports:publication-artifact -- \
            --prepare \
            --artifact-dir "$RUNNER_TEMP/report-publication" \
            --source-commit "$GITHUB_SHA" \
            --kind single \
            --report-mode "$FEATURED_REPORT_MODE" \
            --expected-report-id "$REPORT_ID"

      - name: Upload bounded data-only publication artifact
        id: publication_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-report-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-publication/
          if-no-files-found: error
          retention-days: 7

  measurement-freeze-notice:
    name: Measurement freeze notice
    if: vars.SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE == '1'
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Explain the withheld publication
        run: |
          echo "::warning title=Measurement freeze::SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE=1: the validated report artifact was produced and uploaded, but ad-hoc corpus publication is withheld during the measurement freeze so non-epoch reports cannot join the frozen cohort. Unset the repository variable once the freeze ends."

  publish:
    name: Validate and Publish Static Report
    # The measurement freeze quiesces ad-hoc corpus publication; the scan job
    # above still runs and uploads its bounded artifact as evidence.
    if: vars.SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE != '1'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # GITHUB_TOKEN pushes do not recursively trigger CI, so the publisher
      # explicitly dispatches the required workflow after a successful push.
      actions: write
    env:
      BASE_BRANCH: ${{ github.ref_name }}
      PROPOSAL_BRANCH: automation/scan-report-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact acquisition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install trusted validator dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build the trusted publication validator once
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Verify immutable artifact identity
        env:
          ARTIFACT_ID: ${{ needs.scan.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.scan.outputs.publication_artifact_digest }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Precheck exact raw artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.scan.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.scan.outputs.publication_artifact_digest }}
          ARTIFACT_NAME: ${{ needs.scan.outputs.publication_artifact_name }}
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f "name=$ARTIFACT_NAME" \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            > "$RUNNER_TEMP/report-publication-metadata.json"
          npm run reports:publication-archive -- \
            --validate-metadata \
            --metadata "$RUNNER_TEMP/report-publication-metadata.json" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" \
            --digest "$ARTIFACT_DIGEST"

      - name: Download raw artifact archive by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.scan.outputs.publication_artifact_id }}
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/report-publication.zip"

      - name: Centrally validate and safely extract raw artifact archive
        env:
          ARTIFACT_ID: ${{ needs.scan.outputs.publication_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.scan.outputs.publication_artifact_digest }}
          ARTIFACT_NAME: ${{ needs.scan.outputs.publication_artifact_name }}
        run: |
          npm run reports:publication-archive -- \
            --extract \
            --metadata "$RUNNER_TEMP/report-publication-metadata.json" \
            --archive "$RUNNER_TEMP/report-publication.zip" \
            --artifact-dir "$RUNNER_TEMP/report-publication" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" \
            --digest "$ARTIFACT_DIGEST"

      - name: Validate and copy only canonical new report data
        run: |
          npm run reports:publication-artifact -- \
            --publish \
            --artifact-dir "$RUNNER_TEMP/report-publication" \
            --source-commit "$GITHUB_SHA" \
            --kind single \
            --report-mode "$FEATURED_REPORT_MODE"

      - name: Rebuild trusted retention and aggregate outputs
        run: |
          npm run reports:prune
          npm run reports:remediate -- --check
          npm run reports:manifest
          npm run corpus:stats

      - name: Commit static report
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Committed reports may only publish to a branch."
            exit 1
          fi
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add public/reports public/corpus-stats.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          if [[ "$FEATURED_REPORT_MODE" == "v1" ]]; then
            git commit -m "Add manual v1 compatibility scan report"
          else
            git commit -m "Add r2 site behavior scan report"
          fi
          # Reports and pruning were validated against this exact checkout. The
          # validated tree becomes a reviewed automation/* proposal, never a
          # direct write to the source branch: a base branch that advanced
          # since validation surfaces as an ordinary merge conflict on the pull
          # request instead of a transplanted stale tree. The per-attempt
          # branch name is unique, so this push never needs force.
          git push origin "HEAD:refs/heads/$PROPOSAL_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          proposal_body="$RUNNER_TEMP/report-proposal-pr.md"
          printf '%s\n' \
            '<!-- site-behavior-lab:report-publication-pr -->' \
            '# Add validated scan report data' \
            '' \
            'This proposal contains validated, privacy-reduced report data produced by the trusted publisher from a bounded acquisition artifact.' \
            '' \
            '- The publisher validated artifact identity, redaction, provenance, pruning, manifests, and corpus statistics before proposing.' \
            '- Merging still requires normal review and a fresh main-branch CI run.' \
            '- If another proposal merges first and this one conflicts in the report manifest or corpus statistics, close it and re-run the workflow; never hand-merge regenerated output.' \
            > "$proposal_body"
          # The proposal branch is already pushed, but a proposal nobody can
          # merge is not a publication. A refusal to OPEN the pull request,
          # including the repository policy that forbids Actions from creating
          # pull requests, fails this job so reconciliation and the managed
          # failure issue stay open instead of reporting success over an
          # orphaned branch. The policy refusal keeps its one-click remediation
          # annotation; every failure path here is loud.
          pr_error="$RUNNER_TEMP/report-proposal-pr-error.txt"
          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$PROPOSAL_BRANCH" \
            --title "Add validated scan report data" \
            --body-file "$proposal_body" 2>"$pr_error"; then
            cat "$pr_error" >&2
            if ! grep -q "not permitted to create or approve pull requests" "$pr_error"; then
              exit 1
            fi
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${PROPOSAL_BRANCH}?expand=1"
            echo "::error title=Report publication needs its pull request opened by hand::The validated report data is pushed to ${PROPOSAL_BRANCH}, but this repository does not permit Actions to create pull requests. Open it at ${compare_url}, or enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
            {
              echo "- Proposal branch: \`${PROPOSAL_BRANCH}\` (validated, pushed)"
              echo "- Pull request: **not created**; Actions are not permitted to create pull requests in this repository"
              echo "- Open it here: ${compare_url}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Trigger CI on the proposal branch
        # Pushes made with GITHUB_TOKEN never fire `on: push` workflows, so the
        # proposal would stay untested. Dispatch CI on the proposal branch
        # only; its attest and promote jobs are gated on refs/heads/main, so
        # this run tests the proposal and can never deploy it. Promotion
        # happens from the fresh main CI run after the pull request merges.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$PROPOSAL_BRANCH"
