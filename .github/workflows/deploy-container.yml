name: Deploy Tested Container

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  # Read exact main-CI evidence and dispatch the existing independent health run.
  actions: write
  attestations: read

concurrency:
  group: deploy-production-container
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the attested production image
    # Activate only after the existing Workers Builds trigger is disabled.
    # This cutover switch prevents two independent production deployers racing.
    if: >-
      github.ref == 'refs/heads/production' &&
      vars.SITE_BEHAVIOR_LAB_PREBUILT_CONTAINER_DEPLOY == '1'
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.candidate.outputs.current }}
      # The attempt that deployed and kept the record. A rerun of the failed
      # signing job alone runs as a later attempt and reuses this job's
      # outputs and artifact, so the signing job names the record by this
      # value, never by its own run_attempt.
      attempt: ${{ github.run_attempt }}
    # Includes a bounded 20-minute provider/runtime convergence check. Cloudflare
    # can drain an old process for 15 minutes after accepting the new image.
    timeout-minutes: 25
    steps:
      - name: Checkout the promoted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Verify exact Node and npm runtime
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      # This job holds the deploy token, so it runs no install script and
      # restores no package cache that a script-running job could have
      # written. setup-node caches by default when package.json names a
      # package manager, so the cache is turned off by name.
      - name: Install deployment tools
        run: npm ci --ignore-scripts

      - name: Resolve the gated main image
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-production-container.mjs

      - name: Verify attestation and deploy the immutable image
        if: steps.candidate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dea2502fea1fef952043925374196ae9
          PUBLISHED_EVIDENCE: ${{ steps.candidate.outputs.evidence }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/deploy-container.mjs --published-evidence "$PUBLISHED_EVIDENCE"

      - name: Verify provider image and live scanner revision
        if: steps.candidate.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dea2502fea1fef952043925374196ae9
          EXPECTED_IMAGE: ${{ steps.candidate.outputs.image }}
          CI_RUN_ID: ${{ steps.candidate.outputs.ci_run }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/verify-deployed-container.mjs

      - name: Preserve deployment readback
        if: steps.candidate.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-container-readback-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-container-readback.json
          if-no-files-found: error
          retention-days: 90

      - name: Request independent production scan and R2 verification
        if: steps.candidate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-health.yml --ref production

  # This job never checks out or executes the promoted code and holds no
  # Cloudflare secret. It signs the deployment record the job above wrote:
  # the image the provider reported running and the commit the live scanner
  # reported for itself. The signature shows that this workflow, at this
  # commit, wrote the record. It does not show that any one scan ran in that
  # image, and nothing in the promotion path reads it.
  attest-deployment:
    name: Attest the deployment record
    needs:
      - deploy
    if: needs.deploy.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the deployment record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-container-readback-${{ github.sha }}-${{ needs.deploy.outputs.attempt }}
          path: ${{ runner.temp }}/production-deployment-record

      - name: Hold the deployment record to this commit and run
        env:
          RECORD: ${{ runner.temp }}/production-deployment-record/production-container-readback.json
          DEPLOY_RUN_ATTEMPT: ${{ needs.deploy.outputs.attempt }}
        run: |
          set -euo pipefail
          test -s "$RECORD"
          node -e '
            const deployAttempt = process.env.DEPLOY_RUN_ATTEMPT ?? "";
            if (!/^[1-9][0-9]*$/.test(deployAttempt) || Number(deployAttempt) > Number(process.env.GITHUB_RUN_ATTEMPT)) {
              throw new Error(`the deploy job names no attempt of this run: ${JSON.stringify(deployAttempt)}`);
            }
            const record = JSON.parse(require("node:fs").readFileSync(process.env.RECORD, "utf8"));
            if (record?.kind !== "site-behavior-lab-production-deployment-record" || record?.sourceCommit !== process.env.GITHUB_SHA) {
              throw new Error(`the record is of ${record?.sourceCommit ?? "no commit"}, not ${process.env.GITHUB_SHA}`);
            }
            if (String(record?.deployRun?.id) !== process.env.GITHUB_RUN_ID || String(record?.deployRun?.attempt) !== deployAttempt) {
              throw new Error("the record is of another deployment run");
            }
            if (!/^registry\.cloudflare\.com\/[0-9a-f]{32}\/site-behavior-lab-scanner@sha256:[0-9a-f]{64}$/.test(record?.image ?? "")) {
              throw new Error("the record names no immutable production image");
            }
          '

      - name: Attest the deployment record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/production-deployment-record/production-container-readback.json
