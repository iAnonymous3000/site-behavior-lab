name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Dispatched by the data workflows (scan, scan-featured, update-brave-lists)
  # after their GITHUB_TOKEN pushes, which never fire `on: push`: the corpus
  # commit gets a real CI run. This workflow promotes its own tested SHA because
  # a token-dispatched run does not reliably cascade into a third workflow via
  # `workflow_run`; Promote Production remains an idempotent fallback.
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR revisions need no further feedback. Main and manual runs keep
# unique groups so source-bound promotion and evidence runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: "https://sitebehavior.org"

jobs:
  supply-chain:
    name: Supply-chain Security
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install locked dependencies
        id: supply_chain_npm_ci
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Verify third-party supply-chain inventory
        id: third_party_supply_chain
        continue-on-error: true
        run: npm run supply-chain:third-party:check

      # This validates the committed status=blocked integrity/provenance
      # contract. It intentionally does not claim local rebuild byte parity.
      - name: Verify vendored WASM static integrity contract
        id: wasm_static_integrity
        continue-on-error: true
        run: npm run wasm:verify-reproducibility

      - name: Prepare supply-chain report directory
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/site-behavior-lab-supply-chain"
          install -d -m 700 "$report_dir"
          echo "SUPPLY_CHAIN_REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

      # npm audit contacts the configured registry for every run. The explicit
      # ping and online-only config keep a stale local cache from satisfying the
      # gate when the advisory service is unavailable.
      - name: Audit npm dependencies against the live registry
        id: npm_audit
        continue-on-error: true
        env:
          NPM_CONFIG_OFFLINE: "false"
          NPM_CONFIG_PREFER_OFFLINE: "false"
          NPM_CONFIG_PREFER_ONLINE: "true"
        run: |
          set -euo pipefail
          npm ping --registry=https://registry.npmjs.org/
          set +e
          npm audit \
            --json \
            --audit-level=low \
            --package-lock-only \
            --ignore-scripts \
            --registry=https://registry.npmjs.org/ \
            > "$SUPPLY_CHAIN_REPORT_DIR/npm-audit.json"
          audit_status=$?
          set -e
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$SUPPLY_CHAIN_REPORT_DIR/npm-audit.json"
          exit "$audit_status"

      # A unique database path forces cargo-audit to clone/fetch RustSec during
      # this run. Omitting --no-fetch and --stale makes an unavailable or stale
      # advisory database a hard failure rather than a cache-only success.
      - name: Audit Rust dependencies against a fresh RustSec database
        id: cargo_audit
        continue-on-error: true
        env:
          RUSTSEC_DB: ${{ runner.temp }}/rustsec-advisory-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$RUSTSEC_DB"
          cargo install cargo-audit --locked --version 0.22.1 --force
          test "$(cargo audit --version)" = "cargo-audit-audit 0.22.1"
          set +e
          cargo audit \
            --db "$RUSTSEC_DB" \
            --url https://github.com/RustSec/advisory-db.git \
            --file tools/adblock-wasm/Cargo.lock \
            --deny warnings \
            --format json \
            > "$SUPPLY_CHAIN_REPORT_DIR/cargo-audit.json"
          audit_status=$?
          set -e
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$SUPPLY_CHAIN_REPORT_DIR/cargo-audit.json"
          exit "$audit_status"

      # Filesystem mode covers lockfiles plus the deployable Dockerfile and
      # repository configuration. Action caching is disabled and DB updates are
      # mandatory so the gate cannot pass on a stale cached vulnerability DB.
      - name: Scan repository and container configuration with Trivy
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: ${{ runner.temp }}/site-behavior-lab-supply-chain/trivy-filesystem.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          cache: "false"
          # This pinned action version ignores the retired skip-db-update
          # inputs; a fresh DB download is its default. Keep that download
          # OUTSIDE the workspace: a DB dropped into the checkout dirties the
          # worktree and the exact-SHA evidence gate refuses a dirty tree.
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Validate Trivy machine-readable report
        id: trivy_report
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$SUPPLY_CHAIN_REPORT_DIR/trivy-filesystem.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$SUPPLY_CHAIN_REPORT_DIR/trivy-filesystem.json"

      - name: Preserve supply-chain security reports
        id: supply_chain_report_upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-security-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-supply-chain/
          if-no-files-found: error
          retention-days: 90

      # Scanner steps continue only so every available report can be retained.
      # This final step converts any scanner, report, or upload failure back into
      # a blocking job failure.
      - name: Enforce all supply-chain security gates
        if: always()
        env:
          NPM_CI_OUTCOME: ${{ steps.supply_chain_npm_ci.outcome }}
          THIRD_PARTY_OUTCOME: ${{ steps.third_party_supply_chain.outcome }}
          WASM_STATIC_INTEGRITY_OUTCOME: ${{ steps.wasm_static_integrity.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
          CARGO_AUDIT_OUTCOME: ${{ steps.cargo_audit.outcome }}
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy_scan.outcome }}
          TRIVY_REPORT_OUTCOME: ${{ steps.trivy_report.outcome }}
          REPORT_UPLOAD_OUTCOME: ${{ steps.supply_chain_report_upload.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            "npm ci:$NPM_CI_OUTCOME" \
            "third-party inventory:$THIRD_PARTY_OUTCOME" \
            "WASM static integrity:$WASM_STATIC_INTEGRITY_OUTCOME" \
            "npm audit:$NPM_AUDIT_OUTCOME" \
            "cargo audit:$CARGO_AUDIT_OUTCOME" \
            "Trivy scan:$TRIVY_SCAN_OUTCOME" \
            "Trivy report:$TRIVY_REPORT_OUTCOME" \
            "report upload:$REPORT_UPLOAD_OUTCOME"; do
            name=${gate%%:*}
            outcome=${gate#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error title=Supply-chain gate failed::${name} finished with ${outcome}."
              failed=1
            fi
          done
          exit "$failed"

  app:
    name: Typecheck, Unit Tests, Build
    needs:
      - typecheck
      - tests
      - pages
      - formal-verification
      - image-tests
    # Keep the existing required check as a fail-closed join. A skipped
    # dependency must fail this check, not become an implicitly passing skip.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require typecheck, tests, and builds to succeed
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.pages.result }}
          FORMAL_VERIFICATION_RESULT: ${{ needs.formal-verification.result }}
          IMAGE_TEST_RESULT: ${{ needs.image-tests.result }}
        run: |
          set -euo pipefail
          if [[ "$TYPECHECK_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$FORMAL_VERIFICATION_RESULT" != "success" || "$IMAGE_TEST_RESULT" != "success" ]]; then
            echo "::error::Typecheck: $TYPECHECK_RESULT; tests: $TEST_RESULT; builds and static smoke: $BUILD_RESULT; formal verification report: $FORMAL_VERIFICATION_RESULT; image-Node tests: $IMAGE_TEST_RESULT"
            exit 1
          fi

  typecheck:
    name: Typecheck and History Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Cloudflare Worker typecheck
        run: npm run cf:typecheck

      - name: Resolve the trusted corrections baseline
        id: corrections_baseline
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          production=""
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            git fetch --no-tags --quiet origin production
            production="$(git rev-parse FETCH_HEAD)"
          fi
          node scripts/resolve-history-baselines.mjs \
            --event "$EVENT_NAME" \
            --push-before "$PUSH_BEFORE" \
            --pull-request-base "$PULL_REQUEST_BASE" \
            --production "$production" >> "$GITHUB_OUTPUT"

      - name: Verify append-only corrections history
        run: npm run corrections:verify-history -- "${{ steps.corrections_baseline.outputs.baseline }}"

      - name: Verify append-only publication transparency log
        run: npm run transparency:verify-history -- "${{ steps.corrections_baseline.outputs.baseline }}"

      - name: Verify append-only corrections history against the last promoted state
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run corrections:verify-history -- "${{ steps.corrections_baseline.outputs.production_baseline }}"

      - name: Verify append-only publication transparency log against the last promoted state
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run transparency:verify-history -- "${{ steps.corrections_baseline.outputs.production_baseline }}"

      - name: Verify transparency log covers every committed report
        run: npm run transparency:log:check

      - name: Verify a committed report offline
        run: |
          set -euo pipefail
          newest=$(node -e 'const r=require("./public/reports/index.json").reports; if(!r.length){console.error("no committed reports");process.exit(1);} console.log([...r].sort((a,b)=>a.id<b.id?1:-1)[0].id)')
          echo "Verifying $newest"
          npm run verify:report -- "$newest" --from public/reports

  tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [parallel, serial-1, serial-2, serial-3, serial-4, tail]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: startsWith(matrix.leg, 'serial-')
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit:leg -- ${{ matrix.leg }}

  formal-verification:
    name: Formal Verification Execution Report
    runs-on: ubuntu-24.04
    # The report's suites take about nine minutes; one that hangs must fail this job, not hold the run.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      # A green unit run does not show that a bounded suite ran: a suite a
      # stage stopped naming and a skipped test both leave it green. The
      # suites the formal-verification release gate requires therefore run
      # once more here, each alone, and what they did is written down for this
      # exact commit: every test by name, and every catch the harness recorded
      # with the property named. The attest job signs that file. The producer
      # refuses a dirty tree before and after its run and writes nothing
      # unless the run meets the gate's rule, so this step comes first, on the
      # tree npm ci left. It needs no browser. It does not replace the same
      # suites in the unit tests, which are what gate a change. It runs in a
      # job of its own, beside the tests job, and the required check
      # "Typecheck, Unit Tests, Build" fails unless it succeeds.
      - name: Record exact-SHA formal verification execution report
        run: >-
          npm run release:formal-verification-report --
          --output "$RUNNER_TEMP/site-behavior-lab-formal-verification-report.json"

      - name: Preserve exact-SHA formal verification execution report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-formal-verification-report-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-formal-verification-report.json
          if-no-files-found: error
          retention-days: 90

  pages:
    name: Build and Static Export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Test the actual production browser configuration, including root paths.
      SITE_BEHAVIOR_LAB_PAGES_BASE_PATH: ""
      NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SCAN_API_BASE: https://scan.sitebehavior.org
      NEXT_PUBLIC_SITE_BEHAVIOR_LAB_PDF_EXPORT_ENABLED: "1"
      NEXT_PUBLIC_SITE_BEHAVIOR_LAB_TURNSTILE_SITE_KEY: 0x4AAAAAADo4etedrrGyi43a
      # UI contract checks use explicit test responses. Live service health is
      # independently verified after deployment, never a prerequisite to fix it.
      STATIC_SMOKE_SCANNER_FIXTURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: GitHub Pages static export
        run: npm run build:pages

      - name: Static export smoke test
        run: npm run test:smoke:static

      # This deterministic receipt binds every byte in the tested static tree
      # to the exact clean checkout. It does not claim that Cloudflare served
      # those bytes; production-health independently proves the live SHA.
      - name: Record exact-SHA static build evidence
        run: >-
          npm run release:evidence --
          --static-dir out
          --output "$RUNNER_TEMP/site-behavior-lab-static-release-evidence.json"

      - name: Preserve exact-SHA static build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-static-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-static-release-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve the tested production Pages files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-pages-${{ github.sha }}
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          # This is a deployment transfer, not the permanent evidence archive.
          # Keep signed manifests for 90 days; avoid retaining large exports.
          retention-days: 1

  smoke:
    name: Chromium Smoke Test
    runs-on: ubuntu-24.04
    # A hung build or smoke run must fail this job fast, never consume the 6-hour default budget.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      # Annotates, and never fails, when fewer than 21 days remain before the
      # bundled Chromium's estimated HSTS preload cutoff.
      - name: Warn before the bundled Chromium's HSTS preload cutoff
        run: node scripts/chromium-hsts-preload-cutoff.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm run start -- --port 3100 > /tmp/site-behavior-lab.log 2>&1 &
          echo $! > /tmp/site-behavior-lab.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/site-behavior-lab.log
          exit 1

      - name: Smoke test
        run: BASE_URL=http://127.0.0.1:3100 npm run test:smoke

  # Builds the Dockerfile's source stage once and hands it to the image-Node
  # unit legs and the release image build by digest, so every leg and the
  # release build consume the exact same source image. No deploy or publish
  # secret is in scope here.
  image-source:
    name: Build the exact source image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      oci-digest: ${{ steps.source_image.outputs.oci_digest }}
      image-id: ${{ steps.source_image.outputs.image_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Set up Docker layer caching
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0
          cleanup: false

      - name: Resolve exact container build inputs
        id: container_inputs
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          proof=$(node scripts/measurement-candidate-build-proof.mjs)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "proof=$proof" >> "$GITHUB_OUTPUT"

      # Cache dependency/base layers, not a successful check result for another
      # revision: the Dockerfile consumes the exact SHA before COPY and check.
      # GitHub isolates PR caches from main. Only the deps stage is exported:
      # every later layer follows COPY . . and can never be reused by another
      # commit, and exporting those took 14 to 113 seconds of every run.
      - name: Refresh the dependency-layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: deps
          push: false
          provenance: false
          cache-from: type=gha,scope=scanner-amd64-v1,version=2
          cache-to: type=gha,scope=scanner-amd64-v1,version=2,mode=max

      - name: Build the exact source image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: source
          push: false
          provenance: false
          build-args: |
            SITE_BEHAVIOR_LAB_BUILD_COMMIT=${{ steps.container_inputs.outputs.commit }}
            SITE_BEHAVIOR_LAB_VERIFIED_MEASUREMENT_CANDIDATE_PROOF=${{ steps.container_inputs.outputs.proof }}
          cache-from: type=gha,scope=scanner-amd64-v1,version=2
          outputs: type=oci,dest=${{ runner.temp }}/source-oci,tar=false

      # docker load on the runners' classic image store needs a docker-save
      # manifest.json beside index.json, and BuildKit writes none. It names the
      # config and layer blobs already in the layout; index.json, and so the
      # recorded OCI digest, is unchanged.
      - name: Write the docker load manifest of the exact source image
        run: node scripts/split-image.mjs docker-manifest "$RUNNER_TEMP/source-oci"

      # Packed here with its exact member names, which every reader of the
      # archive names in turn: GNU tar finds index.json only under that name.
      - name: Pack the exact source image
        run: tar -C "$RUNNER_TEMP/source-oci" -cf "$RUNNER_TEMP/source-image.oci.tar" index.json manifest.json oci-layout blobs

      - name: Record the exact source image's identity
        id: source_image
        run: node scripts/split-image.mjs digests "$RUNNER_TEMP/source-image.oci.tar" >> "$GITHUB_OUTPUT"

      # Kept one day: only this run's own jobs read it.
      - name: Preserve the exact source image for this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-source-image-${{ github.sha }}
          path: ${{ runner.temp }}/source-image.oci.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The unit suite on the image's own Node, as the image build ran it until
  # 2026-11-16, now as the same legs as the tests job, each in a container of
  # the exact source image. The source image has no .git (.dockerignore), as
  # the image build's tree never had. app requires every leg to succeed.
  image-tests:
    name: Image-Node Unit Tests
    needs:
      - image-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [parallel, serial-1, serial-2, serial-3, serial-4, tail]
    steps:
      - name: Download the exact source image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exact-sha-source-image-${{ github.sha }}
          path: ${{ runner.temp }}/source-image

      - name: Load the exact source image and check its identity
        env:
          SOURCE_OCI_DIGEST: ${{ needs.image-source.outputs.oci-digest }}
          SOURCE_IMAGE_ID: ${{ needs.image-source.outputs.image-id }}
        run: |
          set -euo pipefail
          tar="$RUNNER_TEMP/source-image/source-image.oci.tar"
          test "$(tar -xOf "$tar" index.json | jq -r '.manifests | length')" = "1"
          test "$(tar -xOf "$tar" index.json | jq -r '.manifests[0].digest')" = "$SOURCE_OCI_DIGEST"
          docker load --input "$tar"
          rm "$tar"
          test "$(docker image inspect --format '{{.Id}}' "$SOURCE_IMAGE_ID")" = "$SOURCE_IMAGE_ID"

      # --init puts a reaper at PID 1, as a build RUN has one: without it an
      # orphaned child is never reaped, stays a zombie, and a test that waits
      # for a process to be gone (the investigation stage's signal test) waits
      # out its bound.
      - name: Unit tests on the image's Node
        env:
          SOURCE_IMAGE_ID: ${{ needs.image-source.outputs.image-id }}
          LEG: ${{ matrix.leg }}
        run: docker run --rm --init "$SOURCE_IMAGE_ID" npm run test:unit:leg -- "$LEG"

      - name: Record this leg's verdict
        env:
          SOURCE_IMAGE_ID: ${{ needs.image-source.outputs.image-id }}
          LEG: ${{ matrix.leg }}
        run: >-
          jq -n --arg leg "$LEG" --arg commit "$GITHUB_SHA" --arg image "$SOURCE_IMAGE_ID"
          --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT"
          '{schema: "site-behavior-lab/image-test-verdict/v1", leg: $leg, commit: $commit, runId: $run, runAttempt: $attempt, sourceImageId: $image, exitCode: 0}'
          > "$RUNNER_TEMP/image-test-verdict-$LEG.json"

      - name: Preserve this leg's verdict
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-test-verdict-${{ matrix.leg }}-${{ github.sha }}
          path: ${{ runner.temp }}/image-test-verdict-${{ matrix.leg }}.json
          if-no-files-found: error
          retention-days: 90

  docker:
    name: Docker Runtime and Public R2 Smoke
    needs:
      - image-source
    # The required check fails closed: a source image that failed or was
    # skipped must fail this check, not leave it a passing skip.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require the exact source image
        env:
          SOURCE_IMAGE_RESULT: ${{ needs.image-source.result }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_IMAGE_RESULT" != "success" ]]; then
            echo "::error::Exact source image: $SOURCE_IMAGE_RESULT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Start installing host Chromium
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/host-chromium-install.status"
          nohup bash -c 'npx playwright install --with-deps chromium > "$RUNNER_TEMP/host-chromium-install.log" 2>&1; echo "$?" > "$RUNNER_TEMP/host-chromium-install.status"' > /dev/null 2>&1 &

      - name: Set up Docker layer caching
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0
          cleanup: false

      - name: Resolve exact container build inputs
        id: container_inputs
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          proof=$(node scripts/measurement-candidate-build-proof.mjs)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "proof=$proof" >> "$GITHUB_OUTPUT"

      - name: Download the exact source image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exact-sha-source-image-${{ github.sha }}
          path: ${{ runner.temp }}/source-image

      # The tar is the bytes image-source built and the image-Node legs test.
      # A build context reads a directory, so it is unpacked, and its index
      # must still carry the digest image-source recorded.
      - name: Unpack the exact source image
        env:
          SOURCE_OCI_DIGEST: ${{ needs.image-source.outputs.oci-digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/source-oci"
          tar -xf "$RUNNER_TEMP/source-image/source-image.oci.tar" -C "$RUNNER_TEMP/source-oci"
          rm -rf "$RUNNER_TEMP/source-image"
          read_digest() { node scripts/split-image.mjs digests "$1" | sed -n 's/^oci_digest=//p'; }
          test "$(read_digest "$RUNNER_TEMP/source-oci")" = "$SOURCE_OCI_DIGEST"

      # check without the unit suite, from the exact source image by digest:
      # the image-Node legs run the suite on that same image beside this job.
      - name: Build the compiled stage from the exact source image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: compiled
          push: false
          provenance: false
          build-contexts: |
            source=oci-layout://${{ runner.temp }}/source-oci@${{ needs.image-source.outputs.oci-digest }}
          outputs: type=oci,dest=${{ runner.temp }}/compiled-oci,tar=false

      - name: Check the compiled image sits on the exact source image
        id: compiled_image
        run: node scripts/split-image.mjs prefix "$RUNNER_TEMP/source-oci" "$RUNNER_TEMP/compiled-oci" >> "$GITHUB_OUTPUT"

      # Smoke and fresh Trivy scans use this local image; only trusted main may
      # publish it after the gates. Its build stage is the compiled image
      # above, by digest, so this build runs no part of check again.
      - name: Build exact deployable Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: site-behavior-lab:smoke
          build-args: |
            SITE_BEHAVIOR_LAB_BUILD_COMMIT=${{ steps.container_inputs.outputs.commit }}
            SITE_BEHAVIOR_LAB_VERIFIED_MEASUREMENT_CANDIDATE_PROOF=${{ steps.container_inputs.outputs.proof }}
          build-contexts: |
            build=oci-layout://${{ runner.temp }}/compiled-oci@${{ steps.compiled_image.outputs.oci_digest }}
          cache-from: type=gha,scope=scanner-amd64-v1,version=2

      # Binds the loaded release image to the exact source image the
      # image-Node legs tested and the compiled image it was built from.
      # attest refuses the release image without it.
      - name: Record the split build
        run: >-
          node scripts/split-image.mjs record
          "$RUNNER_TEMP/source-oci" "$RUNNER_TEMP/compiled-oci"
          "$(docker image inspect --format '{{.Id}}' site-behavior-lab:smoke)"
          "$GITHUB_SHA"
          "$RUNNER_TEMP/site-behavior-lab-split-build.json"

      - name: Finish installing host Chromium
        run: |
          set -euo pipefail
          until test -s "$RUNNER_TEMP/host-chromium-install.status"; do sleep 1; done
          cat "$RUNNER_TEMP/host-chromium-install.log"
          exit "$(cat "$RUNNER_TEMP/host-chromium-install.status")"

      # Exercise the image just built, including v1/filesystem and public-v2/R2.
      - name: Smoke deployable Docker image
        run: npm run test:smoke:docker
        env:
          DOCKER_SMOKE_PUBLIC_R2: "1"
          DOCKER_SMOKE_SKIP_BUILD: "1"

      # Scan the exact image produced and exercised by the smoke step. Both
      # fixed and unfixed HIGH/CRITICAL findings are blocking; disabling action
      # caching and DB-skip flags requires a current vulnerability database.
      - name: Scan smoke-tested container image with Trivy
        id: trivy_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: site-behavior-lab:smoke
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/trivy-container-image.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          cache: "false"
          # This pinned action version ignores the retired skip-db-update
          # inputs; a fresh DB download is its default. Keep that download
          # OUTSIDE the workspace: a DB dropped into the checkout dirties the
          # worktree and the exact-SHA evidence gate refuses a dirty tree.
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Validate Trivy container machine-readable report
        id: trivy_image_report
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/trivy-container-image.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$RUNNER_TEMP/trivy-container-image.json"

      # A second pass inventories every final-image OS package and the license
      # evidence Trivy observes for it. Trivy's raw report is deliberately not
      # the attested subject: ReportID, CreatedAt, targets, and tags are
      # scan-local noise. The repo-owned normalizer below binds only exact
      # image/layer/package facts after the container receipt exists.
      - name: Inventory smoke-tested container OS-package licenses with Trivy
        id: trivy_image_license_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: site-behavior-lab:smoke
          scanners: license
          vuln-type: os
          list-all-pkgs: "true"
          format: json
          output: ${{ runner.temp }}/trivy-container-image-licenses.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          cache: "false"
          cache-dir: ${{ runner.temp }}/trivy-license-cache

      - name: Validate Trivy container license inventory report
        id: trivy_image_license_report
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/trivy-container-image-licenses.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$RUNNER_TEMP/trivy-container-image-licenses.json"

      # The receipt's byte size is counted by the daemon that unpacked the
      # image and can depend on that host's overlay driver settings, so the
      # log names the daemon the receipt was taken on.
      - name: Name the daemon the receipt is taken on
        run: >-
          docker info --format
          'server {{.ServerVersion}}; storage {{.Driver}}; {{range .DriverStatus}}{{index . 0}}: {{index . 1}}; {{end}}kernel {{.KernelVersion}}'

      # Runs only after both image smoke lanes pass. The receipt records the
      # exact local image/layer identities and OCI source labels; it remains
      # distinct from the separately configured Cloudflare deployment artifact.
      - name: Record exact-SHA container build evidence
        run: >-
          npm run release:evidence --
          --container-image site-behavior-lab:smoke
          --output "$RUNNER_TEMP/site-behavior-lab-container-release-evidence.json"

      - name: Normalize exact-image OS-package license inventory
        id: container_package_inventory
        continue-on-error: true
        run: >-
          npm run supply-chain:container-inventory --
          --trivy-report "$RUNNER_TEMP/trivy-container-image-licenses.json"
          --container-evidence "$RUNNER_TEMP/site-behavior-lab-container-release-evidence.json"
          --source-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/site-behavior-lab-container-package-inventory.json"

      - name: Verify exact-image package review coverage
        id: container_package_reviews
        if: always()
        continue-on-error: true
        run: >-
          npm run supply-chain:container-reviews:check --
          --inventory "$RUNNER_TEMP/site-behavior-lab-container-package-inventory.json"

      - name: Preserve exact-SHA container build evidence
        id: container_evidence_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-container-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/site-behavior-lab-container-release-evidence.json
            ${{ runner.temp }}/site-behavior-lab-container-package-inventory.json
            ${{ runner.temp }}/site-behavior-lab-split-build.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve raw container security reports
        id: trivy_image_report_upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/trivy-container-image.json
            ${{ runner.temp }}/trivy-container-image-licenses.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce container security and package-evidence gates
        if: always()
        env:
          TRIVY_IMAGE_SCAN_OUTCOME: ${{ steps.trivy_image_scan.outcome }}
          TRIVY_IMAGE_REPORT_OUTCOME: ${{ steps.trivy_image_report.outcome }}
          TRIVY_IMAGE_LICENSE_SCAN_OUTCOME: ${{ steps.trivy_image_license_scan.outcome }}
          TRIVY_IMAGE_LICENSE_REPORT_OUTCOME: ${{ steps.trivy_image_license_report.outcome }}
          CONTAINER_PACKAGE_INVENTORY_OUTCOME: ${{ steps.container_package_inventory.outcome }}
          CONTAINER_PACKAGE_REVIEWS_OUTCOME: ${{ steps.container_package_reviews.outcome }}
          CONTAINER_EVIDENCE_UPLOAD_OUTCOME: ${{ steps.container_evidence_upload.outcome }}
          TRIVY_IMAGE_UPLOAD_OUTCOME: ${{ steps.trivy_image_report_upload.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            "Trivy image scan:$TRIVY_IMAGE_SCAN_OUTCOME" \
            "Trivy image report:$TRIVY_IMAGE_REPORT_OUTCOME" \
            "Trivy image license scan:$TRIVY_IMAGE_LICENSE_SCAN_OUTCOME" \
            "Trivy image license report:$TRIVY_IMAGE_LICENSE_REPORT_OUTCOME" \
            "Container package inventory:$CONTAINER_PACKAGE_INVENTORY_OUTCOME" \
            "Container package review coverage:$CONTAINER_PACKAGE_REVIEWS_OUTCOME" \
            "Exact-SHA container evidence upload:$CONTAINER_EVIDENCE_UPLOAD_OUTCOME" \
            "Raw container security report upload:$TRIVY_IMAGE_UPLOAD_OUTCOME"; do
            name=${gate%%:*}
            outcome=${gate#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error title=Container security gate failed::${name} finished with ${outcome}."
              failed=1
            fi
          done
          exit "$failed"

      # Registry credentials are unavailable to PRs and every preceding step.
      # This stages image bytes only; it neither deploys a Worker nor promotes.
      # The token is the publisher's own, with no Workers Scripts or Pages
      # permission; the deployers hold a separate one.
      - name: Publish the tested production image
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_PUBLISH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dea2502fea1fef952043925374196ae9
          WRANGLER_SEND_METRICS: "false"
        run: >-
          node scripts/publish-tested-container.mjs
          "$RUNNER_TEMP/site-behavior-lab-container-release-evidence.json"
          "$RUNNER_TEMP/site-behavior-lab-published-container-evidence.json"

      - name: Preserve the published image identity
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-published-container-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-published-container-evidence.json
          if-no-files-found: error
          retention-days: 90

  # This job never checks out or executes candidate code. OIDC and attestation
  # writes are isolated here and are unavailable to pull-request code. The
  # subjects include the original manifests and package inventory, the same
  # container receipt after registry publication, the formal verification
  # execution report the tests job wrote, and the split build record with
  # every image-Node leg's verdict. The published receipt
  # binds the tested local image to its immutable registry reference; a live
  # deployment still requires independent provider and runtime readback.
  attest:
    name: Attest exact-SHA evidence manifests
    needs:
      - supply-chain
      - app
      - docker
      - smoke
      - image-tests
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact-SHA static evidence manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exact-sha-static-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/static

      - name: Download exact-SHA container evidence manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exact-sha-container-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container

      - name: Download published image evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exact-sha-published-container-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/published

      - name: Download exact-SHA formal verification execution report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exact-sha-formal-verification-report-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/formal-verification

      - name: Download every image-Node leg's verdict
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-test-verdict-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/site-behavior-lab-image-test-verdicts

      - name: Validate exact-SHA evidence subjects
        env:
          STATIC_EVIDENCE_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/static/site-behavior-lab-static-release-evidence.json
          CONTAINER_EVIDENCE_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-release-evidence.json
          CONTAINER_PACKAGE_INVENTORY_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-package-inventory.json
        run: |
          set -euo pipefail
          test -s "$STATIC_EVIDENCE_PATH"
          test -s "$CONTAINER_EVIDENCE_PATH"
          test -s "$CONTAINER_PACKAGE_INVENTORY_PATH"
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            for (const [label, file] of [["static", process.env.STATIC_EVIDENCE_PATH], ["container", process.env.CONTAINER_EVIDENCE_PATH]]) {
              const receipt = JSON.parse(readFileSync(file, "utf8"));
              if (receipt?.source?.commit !== process.env.GITHUB_SHA) {
                throw new Error(`${label} evidence identifies ${receipt?.source?.commit ?? "no commit"}, expected ${process.env.GITHUB_SHA}`);
              }
            }
            const container = JSON.parse(readFileSync(process.env.CONTAINER_EVIDENCE_PATH, "utf8"));
            const inventoryBytes = readFileSync(process.env.CONTAINER_PACKAGE_INVENTORY_PATH);
            const inventory = JSON.parse(inventoryBytes.toString("utf8"));
            const requireKeys = (value, expected, label) => {
              if (
                !value ||
                typeof value !== "object" ||
                Array.isArray(value) ||
                JSON.stringify(Object.keys(value)) !== JSON.stringify(expected)
              ) {
                throw new Error(`${label} does not contain exactly the canonical fields in canonical order`);
              }
            };
            requireKeys(
              inventory,
              ["schemaVersion", "artifactKind", "source", "image", "scanner", "summary", "packageSetDigest", "packages"],
              "Container package inventory"
            );
            requireKeys(inventory.source, ["commit"], "Container package inventory source");
            requireKeys(
              inventory.image,
              ["id", "digest", "os", "architecture", "rootfsLayers"],
              "Container package inventory image"
            );
            requireKeys(
              inventory.scanner,
              ["name", "version", "reportSchemaVersion", "scope", "licenseMode"],
              "Container package inventory scanner"
            );
            requireKeys(
              inventory.summary,
              ["packageCount", "packagesWithDetectedLicenses", "packagesWithoutDetectedLicenses", "classifiedLicenseFindingCount"],
              "Container package inventory summary"
            );
            const artifact = container?.artifacts?.filter(
              (value) => value?.name === "container-image" && value?.kind === "docker-image-inspection"
            );
            if (!Array.isArray(artifact) || artifact.length !== 1) {
              throw new Error("Container evidence does not contain exactly one inspected image");
            }
            const image = artifact[0];
            if (
              inventory?.schemaVersion !== 1 ||
              inventory?.artifactKind !== "site-behavior-container-image-package-inventory" ||
              inventory?.source?.commit !== process.env.GITHUB_SHA ||
              inventory?.image?.id !== image.imageId ||
              inventory?.image?.digest !== image.imageId?.replace(/^sha256:/, "") ||
              inventory?.image?.os !== image.os ||
              inventory?.image?.architecture !== image.architecture ||
              JSON.stringify(inventory?.image?.rootfsLayers) !== JSON.stringify(image.rootfsLayers)
            ) {
              throw new Error("Container package inventory does not bind the exact container evidence");
            }
            if (
              inventory?.scanner?.name !== "trivy" ||
              inventory?.scanner?.version !== "0.70.0" ||
              inventory?.scanner?.reportSchemaVersion !== 2 ||
              inventory?.scanner?.scope !== "os-packages" ||
              inventory?.scanner?.licenseMode !== "standard"
            ) {
              throw new Error("Container package inventory scanner contract is not the reviewed contract");
            }
            if (!Array.isArray(inventory.packages) || inventory.packages.length === 0) {
              throw new Error("Container package inventory contains no packages");
            }
            const sha256 = (value) => createHash("sha256").update(value).digest("hex");
            let previousKey = null;
            let packagesWithDetectedLicenses = 0;
            const keys = new Set();
            for (const pkg of inventory.packages) {
              const expectedFields = [
                "key", "packageType", "name", "version", "architecture",
                "sourceName", "sourceVersion", "detectedLicenses", "evidenceDigest"
              ];
              if (
                !pkg ||
                typeof pkg !== "object" ||
                JSON.stringify(Object.keys(pkg)) !== JSON.stringify(expectedFields)
              ) {
                throw new Error("Container package inventory contains a noncanonical package row");
              }
              const requiredStrings = [pkg.packageType, pkg.name, pkg.version, pkg.architecture];
              if (
                requiredStrings.some((value) => typeof value !== "string" || value.length === 0 || value !== value.trim()) ||
                ![pkg.sourceName, pkg.sourceVersion].every(
                  (value) => value === null || (typeof value === "string" && value.length > 0 && value === value.trim())
                ) ||
                !Array.isArray(pkg.detectedLicenses) ||
                pkg.detectedLicenses.some((value) => typeof value !== "string" || value.length === 0 || value !== value.trim()) ||
                new Set(pkg.detectedLicenses).size !== pkg.detectedLicenses.length ||
                JSON.stringify([...pkg.detectedLicenses].sort()) !== JSON.stringify(pkg.detectedLicenses)
              ) {
                throw new Error(`Container package inventory row ${pkg.key ?? "(missing key)"} is malformed`);
              }
              const expectedKey = `os:${pkg.packageType}:${pkg.name}@${pkg.version}#${pkg.architecture}`;
              const evidence = {
                packageType: pkg.packageType,
                name: pkg.name,
                version: pkg.version,
                architecture: pkg.architecture,
                sourceName: pkg.sourceName,
                sourceVersion: pkg.sourceVersion,
                detectedLicenses: pkg.detectedLicenses
              };
              if (
                pkg.key !== expectedKey ||
                pkg.evidenceDigest !== sha256(JSON.stringify(evidence)) ||
                keys.has(pkg.key) ||
                (previousKey !== null && previousKey >= pkg.key)
              ) {
                throw new Error(`Container package inventory row ${pkg.key ?? "(missing key)"} has stale identity or ordering`);
              }
              keys.add(pkg.key);
              previousKey = pkg.key;
              if (pkg.detectedLicenses.length > 0) packagesWithDetectedLicenses += 1;
            }
            if (
              inventory.packageSetDigest !== sha256(JSON.stringify(inventory.packages)) ||
              inventory?.summary?.packageCount !== inventory.packages.length ||
              inventory?.summary?.packagesWithDetectedLicenses !== packagesWithDetectedLicenses ||
              inventory?.summary?.packagesWithoutDetectedLicenses !== inventory.packages.length - packagesWithDetectedLicenses ||
              !Number.isSafeInteger(inventory?.summary?.classifiedLicenseFindingCount) ||
              inventory.summary.classifiedLicenseFindingCount <= 0
            ) {
              throw new Error("Container package inventory aggregate digests or counts are stale");
            }
            if (!inventoryBytes.equals(Buffer.from(`${JSON.stringify(inventory, null, 2)}\n`, "utf8"))) {
              throw new Error("Container package inventory is not canonical JSON");
            }
          '

      # The formal-verification job wrote this report only after its own run
      # met the formal-verification gate's rule at this commit. Candidate code
      # is not run here, so that rule is not run again: this step holds the
      # subject to its kind, to this exact commit and a full source tree, and
      # to its canonical bytes, and the release gate judges its content when a
      # carrier binds it.
      - name: Validate formal verification execution report subject
        env:
          FORMAL_VERIFICATION_REPORT_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/formal-verification/site-behavior-lab-formal-verification-report.json
        run: |
          set -euo pipefail
          test -s "$FORMAL_VERIFICATION_REPORT_PATH"
          node -e '
            const { readFileSync } = require("node:fs");
            const bytes = readFileSync(process.env.FORMAL_VERIFICATION_REPORT_PATH);
            const report = JSON.parse(bytes.toString("utf8"));
            if (
              report?.schemaVersion !== 2 ||
              report?.artifactKind !== "site-behavior-formal-verification-execution-report"
            ) {
              throw new Error("Formal verification report is not the expected artifact kind and version");
            }
            if (report?.source?.commit !== process.env.GITHUB_SHA) {
              throw new Error(`Formal verification report identifies ${report?.source?.commit ?? "no commit"}, expected ${process.env.GITHUB_SHA}`);
            }
            if (typeof report?.source?.tree !== "string" || !/^[0-9a-f]{40}$/.test(report.source.tree)) {
              throw new Error("Formal verification report identifies no valid source tree");
            }
            if (!Array.isArray(report.suites) || report.suites.length === 0) {
              throw new Error("Formal verification report names no suite");
            }
            if (!bytes.equals(Buffer.from(`${JSON.stringify(report, null, 2)}\n`, "utf8"))) {
              throw new Error("Formal verification report is not canonical JSON");
            }
          '

      - name: Validate the split build and every image-Node verdict
        # The release image was built without the unit suite, from the source
        # image the image-Node legs tested. It is attested only if the split
        # record binds it to that source image and every leg's verdict, exactly
        # one per leg, passed on that same source image at this commit and run.
        # The leg list is the planner's (scripts/unit-test-plan.mjs LEGS); a
        # test holds it equal to the planner and to both matrices.
        env:
          EXPECTED_LEGS: parallel serial-1 serial-2 serial-3 serial-4 tail
          SPLIT_BUILD_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-split-build.json
          CONTAINER_EVIDENCE_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-release-evidence.json
          VERDICT_DIR: ${{ runner.temp }}/site-behavior-lab-image-test-verdicts
          VERDICT_MANIFEST_PATH: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/image-tests/site-behavior-lab-image-test-verdicts.json
        run: |
          node <<'SPLIT'
          const { mkdirSync, readdirSync, readFileSync, writeFileSync } = require("node:fs");
          const path = require("node:path");
          const env = process.env;
          const DIGEST = /^sha256:[0-9a-f]{64}$/;
          const exactKeys = (value, keys, label) => {
            if (!value || typeof value !== "object" || Array.isArray(value) || JSON.stringify(Object.keys(value)) !== JSON.stringify(keys)) {
              throw new Error(`${label} does not hold exactly ${keys.join(", ")}`);
            }
          };
          const legs = (env.EXPECTED_LEGS ?? "").split(" ").filter(Boolean);
          if (legs.length === 0 || new Set(legs).size !== legs.length) throw new Error("No expected image-Node legs, or a leg named twice");
          const record = JSON.parse(readFileSync(env.SPLIT_BUILD_PATH, "utf8"));
          exactKeys(record, ["schema", "buildPath", "commit", "sourceOciDigest", "sourceImageId", "compiledOciDigest", "runnerImageId"], "Split build record");
          if (record.schema !== "site-behavior-lab/split-build/v1" || record.buildPath !== "split") throw new Error("Split build record is not a split build of the reviewed schema");
          if (record.commit !== env.GITHUB_SHA) throw new Error(`Split build record identifies ${record.commit}, expected ${env.GITHUB_SHA}`);
          for (const key of ["sourceOciDigest", "sourceImageId", "compiledOciDigest", "runnerImageId"]) {
            if (!DIGEST.test(record[key])) throw new Error(`Split build record ${key} is not a sha256 digest`);
          }
          const receipt = JSON.parse(readFileSync(env.CONTAINER_EVIDENCE_PATH, "utf8"));
          const images = receipt?.artifacts?.filter((value) => value?.name === "container-image" && value?.kind === "docker-image-inspection");
          if (!Array.isArray(images) || images.length !== 1) throw new Error("Container evidence does not contain exactly one inspected image");
          if (images[0].imageId !== record.runnerImageId) throw new Error("Split build record names another image than the container evidence");
          const files = readdirSync(env.VERDICT_DIR).sort();
          const expected = legs.map((leg) => `image-test-verdict-${leg}.json`).sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) throw new Error(`Image-Node verdicts are ${files.join(", ") || "none"}, expected ${expected.join(", ")}`);
          // Unset or malformed, Number() gives NaN, and no attempt is greater
          // than NaN, so the bound below would hold for any verdict.
          if (!/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ATTEMPT ?? "")) throw new Error("GITHUB_RUN_ATTEMPT must be a positive integer");
          const attempt = Number(env.GITHUB_RUN_ATTEMPT);
          const verdicts = legs.map((leg) => {
            const verdict = JSON.parse(readFileSync(path.join(env.VERDICT_DIR, `image-test-verdict-${leg}.json`), "utf8"));
            exactKeys(verdict, ["schema", "leg", "commit", "runId", "runAttempt", "sourceImageId", "exitCode"], `Verdict of leg ${leg}`);
            if (verdict.schema !== "site-behavior-lab/image-test-verdict/v1" || verdict.leg !== leg) throw new Error(`Verdict of leg ${leg} names ${verdict.leg}`);
            if (verdict.commit !== env.GITHUB_SHA || verdict.runId !== Number(env.GITHUB_RUN_ID)) throw new Error(`Verdict of leg ${leg} is not this commit's run`);
            if (!Number.isSafeInteger(verdict.runAttempt) || verdict.runAttempt < 1 || verdict.runAttempt > attempt) throw new Error(`Verdict of leg ${leg} names attempt ${verdict.runAttempt}`);
            if (verdict.sourceImageId !== record.sourceImageId) throw new Error(`Verdict of leg ${leg} tested another image than the split build's source`);
            if (verdict.exitCode !== 0) throw new Error(`Leg ${leg} did not pass`);
            return verdict;
          });
          mkdirSync(path.dirname(env.VERDICT_MANIFEST_PATH), { recursive: true });
          const manifest = { schema: "site-behavior-lab/image-test-verdicts/v1", commit: env.GITHUB_SHA, sourceImageId: record.sourceImageId, verdicts };
          writeFileSync(env.VERDICT_MANIFEST_PATH, `${JSON.stringify(manifest, null, 2)}\n`, { flag: "wx" });
          SPLIT

      - name: Attest static evidence manifest
        id: attest_static
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/static/site-behavior-lab-static-release-evidence.json

      - name: Attest container evidence manifest
        id: attest_container
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-release-evidence.json

      - name: Attest container OS-package inventory
        id: attest_container_packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-package-inventory.json

      - name: Bind published image to the original tested evidence
        env:
          TESTED_FILE: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-container-release-evidence.json
          PUBLISHED_FILE: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/published/site-behavior-lab-published-container-evidence.json
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          function assertPublishedImageIdentity(published, tested) {
            const prefix = "registry.cloudflare.com/dea2502fea1fef952043925374196ae9/site-behavior-lab-scanner@sha256:";
            const image = published?.artifacts?.[0];
            if (published?.artifacts?.length !== 1 || image?.name !== "container-image" ||
                image?.kind !== "docker-image-inspection" || image.os !== "linux" || image.architecture !== "amd64" ||
                !/^sha256:[0-9a-f]{64}$/.test(image.imageId) || image.repoDigests?.length !== 1 ||
                typeof image.repoDigests[0] !== "string" || !image.repoDigests[0].startsWith(prefix) ||
                !/^[0-9a-f]{64}$/.test(image.repoDigests[0].slice(prefix.length))) {
              throw new Error("Published container must identify one immutable production registry image");
            }
            const original = structuredClone(tested);
            const copy = structuredClone(published);
            if (original?.artifacts?.length !== 1 || original.artifacts[0].repoDigests?.length !== 0) {
              throw new Error("Expected the original, unpushed CI image receipt");
            }
            copy.artifacts[0].repoDigests = [];
            if (JSON.stringify(copy) !== JSON.stringify(original)) {
              throw new Error("Registry publication changed the tested image or its evidence");
            }
            return image.repoDigests[0];
          }
          const tested = JSON.parse(readFileSync(process.env.TESTED_FILE));
          const published = JSON.parse(readFileSync(process.env.PUBLISHED_FILE));
          assertPublishedImageIdentity(published, tested);
          NODE

      - name: Attest published container evidence
        id: attest_published
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/published/site-behavior-lab-published-container-evidence.json

      - name: Preserve published image attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-published-container-attestation-${{ github.sha }}
          path: ${{ steps.attest_published.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Collect attestation bundles and result references
        env:
          STATIC_BUNDLE: ${{ steps.attest_static.outputs.bundle-path }}
          STATIC_ATTESTATION_ID: ${{ steps.attest_static.outputs.attestation-id }}
          STATIC_ATTESTATION_URL: ${{ steps.attest_static.outputs.attestation-url }}
          CONTAINER_BUNDLE: ${{ steps.attest_container.outputs.bundle-path }}
          CONTAINER_ATTESTATION_ID: ${{ steps.attest_container.outputs.attestation-id }}
          CONTAINER_ATTESTATION_URL: ${{ steps.attest_container.outputs.attestation-url }}
          CONTAINER_PACKAGES_BUNDLE: ${{ steps.attest_container_packages.outputs.bundle-path }}
          CONTAINER_PACKAGES_ATTESTATION_ID: ${{ steps.attest_container_packages.outputs.attestation-id }}
          CONTAINER_PACKAGES_ATTESTATION_URL: ${{ steps.attest_container_packages.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -s "$STATIC_BUNDLE"
          test -n "$STATIC_ATTESTATION_ID"
          test -n "$STATIC_ATTESTATION_URL"
          test -s "$CONTAINER_BUNDLE"
          test -n "$CONTAINER_ATTESTATION_ID"
          test -n "$CONTAINER_ATTESTATION_URL"
          test -s "$CONTAINER_PACKAGES_BUNDLE"
          test -n "$CONTAINER_PACKAGES_ATTESTATION_ID"
          test -n "$CONTAINER_PACKAGES_ATTESTATION_URL"

          report_dir="$RUNNER_TEMP/site-behavior-lab-attestations"
          install -d -m 700 "$report_dir"
          install -m 600 "$STATIC_BUNDLE" "$report_dir/static-evidence-manifest.bundle.json"
          install -m 600 "$CONTAINER_BUNDLE" "$report_dir/container-evidence-manifest.bundle.json"
          install -m 600 "$CONTAINER_PACKAGES_BUNDLE" "$report_dir/container-package-inventory.bundle.json"
          node -e '
            const { writeFileSync } = require("node:fs");
            const result = {
              schemaVersion: 1,
              sourceCommit: process.env.GITHUB_SHA,
              subjects: {
                staticEvidenceManifest: {
                  attestationId: process.env.STATIC_ATTESTATION_ID,
                  attestationUrl: process.env.STATIC_ATTESTATION_URL
                },
                containerEvidenceManifest: {
                  attestationId: process.env.CONTAINER_ATTESTATION_ID,
                  attestationUrl: process.env.CONTAINER_ATTESTATION_URL
                },
                containerPackageInventory: {
                  attestationId: process.env.CONTAINER_PACKAGES_ATTESTATION_ID,
                  attestationUrl: process.env.CONTAINER_PACKAGES_ATTESTATION_URL
                }
              }
            };
            writeFileSync(process.argv[1], `${JSON.stringify(result, null, 2)}\n`, { encoding: "utf8", flag: "wx", mode: 0o600 });
          ' "$report_dir/attestation-results.json"

      - name: Preserve exact-SHA attestation bundles and results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-provenance-attestations-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-attestations/
          if-no-files-found: error
          retention-days: 90

      # Signed last, and kept as an artifact of its own. The bundle artifact
      # above has an exact member list that hosted-evidence verification reads,
      # so this subject is not added to it.
      - name: Attest formal verification execution report
        id: attest_formal_verification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/site-behavior-lab-attestation-subjects/formal-verification/site-behavior-lab-formal-verification-report.json

      - name: Collect formal verification report attestation bundle
        env:
          FORMAL_VERIFICATION_BUNDLE: ${{ steps.attest_formal_verification.outputs.bundle-path }}
          FORMAL_VERIFICATION_ATTESTATION_ID: ${{ steps.attest_formal_verification.outputs.attestation-id }}
          FORMAL_VERIFICATION_ATTESTATION_URL: ${{ steps.attest_formal_verification.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -s "$FORMAL_VERIFICATION_BUNDLE"
          test -n "$FORMAL_VERIFICATION_ATTESTATION_ID"
          test -n "$FORMAL_VERIFICATION_ATTESTATION_URL"
          bundle_dir="$RUNNER_TEMP/site-behavior-lab-formal-verification-attestation"
          install -d -m 700 "$bundle_dir"
          install -m 600 "$FORMAL_VERIFICATION_BUNDLE" "$bundle_dir/formal-verification-report.bundle.json"
          echo "Formal verification report attestation: $FORMAL_VERIFICATION_ATTESTATION_URL"

      - name: Preserve formal verification report attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-formal-verification-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/site-behavior-lab-formal-verification-attestation/
          if-no-files-found: error
          retention-days: 90

      # Also signed after the bundle artifact above, whose member list is
      # exact, and kept as an artifact of its own.
      - name: Attest split build record and image-Node verdicts
        id: attest_split_build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/site-behavior-lab-attestation-subjects/container/site-behavior-lab-split-build.json
            ${{ runner.temp }}/site-behavior-lab-attestation-subjects/image-tests/site-behavior-lab-image-test-verdicts.json

      - name: Preserve split build attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-sha-split-build-attestation-${{ github.sha }}
          path: ${{ steps.attest_split_build.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Advance production to the tested SHA
    needs:
      - supply-chain
      - app
      - docker
      - smoke
      - attest
    # PR code never receives a write token. Pushes and explicit dispatches must
    # both target this repository's main ref before they can promote.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.SITE_BEHAVIOR_LAB_PROMOTION_PAUSED != '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Shared with promote-production.yml so direct and workflow_run fallbacks
    # cannot race one another.
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # The push below authenticates explicitly as the promotion App;
          # nothing in this job may rely on credentials quietly persisted into
          # .git/config.
          persist-credentials: false

      # v3 deprecates app-id in favor of client-id. The client-id step takes
      # over the moment the operator stores the App's client id in
      # vars.PROMOTION_APP_CLIENT_ID; until then the app-id step runs and logs
      # the action's deprecation warning. Exactly one of the two mints.
      - name: Mint promotion App token (client id)
        id: promotion_app_token_client
        if: ${{ vars.PROMOTION_APP_CLIENT_ID }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Mint promotion App token
        id: promotion_app_token
        if: ${{ !vars.PROMOTION_APP_CLIENT_ID }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Fast-forward production to the tested SHA
        env:
          CANDIDATE: ${{ github.sha }}
          APP_TOKEN: ${{ steps.promotion_app_token_client.outputs.token || steps.promotion_app_token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin production || echo "No production branch yet; this promotion creates it."

          if ! git cat-file -e "${CANDIDATE}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "::error::Tested SHA ${CANDIDATE} is not reachable from main; refusing to promote rewritten or stale history."
            exit 1
          fi

          if git rev-parse --verify --quiet origin/production >/dev/null; then
            CURRENT="$(git rev-parse origin/production)"
            if [ "$CURRENT" = "$CANDIDATE" ]; then
              echo "production already points at ${CANDIDATE}; nothing to promote."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$CURRENT" "$CANDIDATE"; then
              echo "production (${CURRENT}) is ahead of or divergent from tested SHA ${CANDIDATE}; skipping out-of-order promotion."
              exit 0
            fi
          fi

          echo "Promotion push authenticates as the dedicated promotion App."
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="${auth_header}" push origin "${CANDIDATE}:refs/heads/production"
          echo "production advanced to ${CANDIDATE}."
