name: Update Brave Shields Lists

# Keeps the vendored Brave Shields snapshot current so the block simulation and
# tried-vs-blocked classification track Brave's real default lists:
#   1. Weekly refresh of the default filter lists from Brave's own catalog,
#      validated end to end (the WASM engine must load the new snapshot and
#      still block known ad URLs) before the refresh is committed. Scheduled
#      failures are tracked in a separate canonical issue and remain job-red.
#   2. A measurement-toolchain drift check against crates.io, npm, and Chrome's
#      consumer stable channel. Actionable drift is tracked in one canonical issue;
#      browser-channel lag without a stable Playwright upgrade remains informational.
#      malformed local pins or unavailable upstream metadata fail the job.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  # Lets the post-push step dispatch CI (see 'Trigger CI on the pushed commit').
  actions: write

# Shared with scan.yml and scan-featured.yml: one writer at a time per ref.
concurrency:
  group: site-behavior-repo-writers-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  refresh-lists:
    name: Refresh and validate filter lists
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # The unit suite includes real scanner regressions that launch the
        # pinned Playwright browser. npm ci installs the client package, not
        # chromium_headless_shell itself.
        run: npx playwright install --with-deps chromium

      - name: Fetch Brave default filter lists
        run: npm run lists:brave

      - name: Validate the refreshed engine snapshot
        run: npm run lists:verify

      - name: Run unit tests against the new snapshot
        run: npm run test:unit

      - name: Commit refreshed lists
        id: commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add lib/adblock-wasm/brave-default-filters.txt.gz lib/adblock-wasm/brave-default-filters.meta.json
          if git diff --cached --quiet; then
            echo "No filter list changes to commit."
            exit 0
          fi
          git commit -m "Refresh the vendored Brave Shields default filter lists"
          # A validated list refresh must not be lost to a non-fast-forward race
          # with a push that landed after checkout: rebase and retry.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto the latest ${GITHUB_REF_NAME}."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger CI on the pushed commit
        # Pushes made with GITHUB_TOKEN never fire `on: push` workflows, so the
        # commit above would stay untested and the CI-gated production branch
        # would never receive it. Dispatch CI explicitly; that tested CI run
        # advances `production` itself once all required jobs pass.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Prepare scheduled Brave-list refresh alert
        id: brave_list_alert
        if: always() && github.event_name == 'schedule'
        env:
          BRAVE_LIST_JOB_STATUS: ${{ job.status }}
          BRAVE_LIST_REPORT_FILE: ${{ runner.temp }}/brave-list-refresh.md
        run: |
          set -euo pipefail

          if [[ "$BRAVE_LIST_JOB_STATUS" == "success" ]]; then
            failed=false
            outcome=completed
            summary="The scheduled fetch, engine validation, unit suite, commit step, and any required CI dispatch completed."
          else
            failed=true
            outcome=failed
            summary="The scheduled refresh did not complete every required fetch, validation, publication, and dispatch step."
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s\n' \
            '<!-- site-behavior-lab:brave-list-refresh -->' \
            '# Scheduled Brave Shields list refresh' \
            '' \
            "$summary" \
            '' \
            "- Outcome: **${outcome}**" \
            "- Workflow run: [run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}](${run_url})" \
            '' \
            'This public issue intentionally contains only aggregate status. Use the linked workflow run for bounded diagnostics.' \
            > "$BRAVE_LIST_REPORT_FILE"

          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Reconcile the scheduled Brave-list refresh issue
        id: brave_list_issue
        # Manual dispatches are diagnostic and must never open or close the
        # repository-wide health issue. The sibling drift job is independent.
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          steps.brave_list_alert.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Repair the scheduled Brave Shields list refresh
          BRAVE_LIST_REPORT_FILE: ${{ runner.temp }}/brave-list-refresh.md
          REFRESH_FAILED: ${{ steps.brave_list_alert.outputs.failed }}
        run: |
          set -euo pipefail

          candidates=$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          match=$(printf '%s' "$candidates" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const marker = "<!-- site-behavior-lab:brave-list-refresh -->";
              const matches = JSON.parse(source)
                .flat()
                .filter((issue) => !issue.pull_request && typeof issue.body === "string" && issue.body.includes(marker));
              if (matches.length > 1) throw new Error(`Found ${matches.length} canonical Brave-list refresh issues; expected at most one.`);
              if (matches.length === 1) process.stdout.write(`${matches[0].number}|${matches[0].state}`);
            });
          ')

          issue_number="${match%%|*}"
          issue_state="${match#*|}"
          if [[ -z "$match" ]]; then
            issue_number=""
            issue_state=""
          fi

          if [[ "$REFRESH_FAILED" == "true" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$BRAVE_LIST_REPORT_FILE"
            else
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$BRAVE_LIST_REPORT_FILE"
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "The scheduled Brave Shields list refresh is failing again; the issue body links to the current run."
              fi
            fi
          elif [[ "$REFRESH_FAILED" == "false" ]]; then
            if [[ -n "$issue_number" && "$issue_state" == "open" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$BRAVE_LIST_REPORT_FILE"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "The scheduled Brave Shields list refresh completed successfully."
            fi
          else
            echo "::error title=Invalid Brave-list refresh status::The alert preparer returned an invalid failure status."
            exit 1
          fi

      - name: Preserve scheduled Brave-list refresh failure
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          (steps.brave_list_alert.outcome != 'success' ||
          steps.brave_list_issue.outcome != 'success' ||
          steps.brave_list_alert.outputs.failed == 'true')
        run: |
          message="The scheduled refresh or its required issue reconciliation did not complete."
          message+=" Inspect this workflow run; the canonical issue is updated when reconciliation succeeds."
          echo "::error title=Brave Shields list refresh failed::${message}"
          exit 1

  toolchain-drift-check:
    name: Check measurement toolchain drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install integrity-checked package metadata
        run: npm ci --ignore-scripts

      - name: Compare resolved pins with upstream stable versions
        id: drift
        env:
          DRIFT_REPORT_FILE: ${{ runner.temp }}/measurement-toolchain-drift.md
        run: node scripts/check-toolchain-drift.mjs --report "$DRIFT_REPORT_FILE"

      - name: Reconcile the measurement toolchain issue
        # workflow_dispatch may target a feature ref; only the default branch
        # is authoritative for the repository-wide maintenance issue.
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Update measurement toolchain pins
          DRIFT_REPORT_FILE: ${{ runner.temp }}/measurement-toolchain-drift.md
          HAS_DRIFT: ${{ steps.drift.outputs.drift }}
        run: |
          set -euo pipefail

          candidates=$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          match=$(printf '%s' "$candidates" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const marker = "<!-- site-behavior-lab:measurement-toolchain-drift -->";
              const matches = JSON.parse(source)
                .flat()
                .filter((issue) => !issue.pull_request && typeof issue.body === "string" && issue.body.includes(marker));
              if (matches.length > 1) throw new Error(`Found ${matches.length} canonical drift issues; expected at most one.`);
              if (matches.length === 1) process.stdout.write(`${matches[0].number}|${matches[0].state}`);
            });
          ')

          issue_number="${match%%|*}"
          issue_state="${match#*|}"
          if [[ -z "$match" ]]; then
            issue_number=""
            issue_state=""
          fi

          if [[ "$HAS_DRIFT" == "true" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$DRIFT_REPORT_FILE"
            else
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$DRIFT_REPORT_FILE"
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "Measurement toolchain drift is present again; the issue body has the current resolved and upstream versions."
              fi
            fi
          elif [[ "$HAS_DRIFT" == "false" ]]; then
            if [[ -n "$issue_number" && "$issue_state" == "open" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$DRIFT_REPORT_FILE"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "No actionable measurement-toolchain upgrades remain. The issue body retains any informational browser-channel lag until stable Playwright catches up."
            fi
          else
            echo "::error::The drift checker returned an invalid drift output: ${HAS_DRIFT}"
            exit 1
          fi
