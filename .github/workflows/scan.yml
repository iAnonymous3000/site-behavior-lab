name: Run Site Scan

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public URL to scan
        required: true
        type: string
      device:
        description: Viewport
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - mobile
      gpc_enabled:
        description: Send Global Privacy Control for single scans
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      compare_gpc:
        description: Run a GPC off/on comparison
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      compare_shields:
        description: Run a Shields off/on comparison (takes precedence over consent and GPC)
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      compare_consent:
        description: Run a consent accept-all/reject-all comparison (takes precedence over GPC)
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  repository_dispatch:
    types:
      - site-behavior-scan

permissions:
  contents: write
  # Lets the post-push step dispatch CI (see 'Trigger CI on the pushed commit').
  actions: write

# All three repo-writing workflows (scan, scan-featured, update-brave-lists)
# share one concurrency group per ref so their commit+push steps never race.
# A human push can still land mid-run, so publication fails closed on NFF.
concurrency:
  group: site-behavior-repo-writers-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Internal scanner builds still render canonical metadata. Keep the build
  # fail-closed on the same public origin as CI and the deployed Pages site.
  NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: "https://sitebehavior.org"
  # This workflow intentionally emits frozen v1 reports. Make both the mode and
  # exact source revision observable through `/api/health` before scanning.
  SITE_BEHAVIOR_LAB_PUBLIC_R2_REPORTS: "0"
  SITE_BEHAVIOR_LAB_BUILD_COMMIT: ${{ github.sha }}
  SCAN_URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
  SCAN_DEVICE: ${{ github.event.inputs.device || github.event.client_payload.device || 'desktop' }}
  SCAN_GPC_ENABLED: ${{ github.event.inputs.gpc_enabled || github.event.client_payload.gpc_enabled || 'true' }}
  SCAN_COMPARE_GPC: ${{ github.event.inputs.compare_gpc || github.event.client_payload.compare_gpc || 'false' }}
  SCAN_COMPARE_SHIELDS: ${{ github.event.inputs.compare_shields || github.event.client_payload.compare_shields || 'false' }}
  SCAN_COMPARE_CONSENT: ${{ github.event.inputs.compare_consent || github.event.client_payload.compare_consent || 'false' }}
  # Disclose the CI runner egress exactly as the featured-gallery workflow does.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS: ${{ vars.SCANNER_EGRESS || 'github-actions-ubuntu' }}
  # GitHub-hosted runners have no reliable region metadata, so the recorded r2
  # egress region stays empty (and comparison deltas stay refused) unless the
  # operator declares one that truthfully names the runner egress.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION: ${{ vars.SCANNER_EGRESS_REGION || '' }}

jobs:
  scan:
    name: Generate Static Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build scanner app
        run: npm run build

      # One dist/schema build for the WHOLE job (RFC 10.3): every later step
      # (the scan publisher, prune, manifest, corpus stats) sees the env flag
      # and skips its own compile of the same artifact.
      - name: Build the dist/schema artifact once
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Start scanner app
        run: |
          if node -e '
            const socket = require("node:net").createConnection({ host: "127.0.0.1", port: 3100 });
            socket.setTimeout(1000);
            socket.once("connect", () => { socket.destroy(); process.exit(0); });
            socket.once("error", () => process.exit(1));
            socket.once("timeout", () => { socket.destroy(); process.exit(1); });
          '; then
            echo "::error::Port 3100 was already occupied before startup; refusing a stale scanner process."
            exit 1
          fi
          if [[ -z "$SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION" ]]; then
            # Actions exports configured empty strings. The scanner treats an
            # explicit blank as invalid, so omit it for this truthful v1-only
            # runner whose region is intentionally unrecorded.
            unset SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION
          fi
          node node_modules/next/dist/bin/next start --port 3100 > /tmp/site-behavior-lab-scan.log 2>&1 &
          app_pid=$!
          echo "$app_pid" > /tmp/site-behavior-lab-scan.pid
          health_path="${RUNNER_TEMP}/site-behavior-lab-scan-health.json"
          for attempt in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The scanner process exited before it became ready; refusing a response from any stale port owner."
              cat /tmp/site-behavior-lab-scan.log
              exit 1
            fi
            if curl -fsS --connect-timeout 2 --max-time 5 \
              --output "$health_path" http://127.0.0.1:3100/api/health; then
              if node -e '
                const fs = require("node:fs");
                const [file, expectedSha] = process.argv.slice(1);
                let health;
                try {
                  health = JSON.parse(fs.readFileSync(file, "utf8"));
                } catch (error) {
                  console.error(`Health response is not valid JSON: ${error instanceof Error ? error.message : error}`);
                  process.exit(1);
                }
                const failures = [];
                const expect = (condition, message) => { if (!condition) failures.push(message); };
                expect(health?.ok === true, "health.ok is not true");
                expect(health?.deployment === expectedSha.toLowerCase(), `deployment is ${health?.deployment ?? "missing"}, expected ${expectedSha}`);
                expect(health?.scansAvailable === true, "scansAvailable is not true");
                expect(health?.checks?.publicR2Reports?.status === "disabled", `report mode is ${health?.checks?.publicR2Reports?.status ?? "missing"}, expected v1/disabled`);
                if (failures.length) {
                  console.error(`Scanner health contract rejected: ${failures.join("; ")}`);
                  process.exit(1);
                }
              ' "$health_path" "$GITHUB_SHA" && kill -0 "$app_pid" 2>/dev/null; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "::error::The scanner did not satisfy the expected process and health contract."
          cat /tmp/site-behavior-lab-scan.log
          exit 1

      - name: Run scan
        id: scan
        run: npm run scan:ci
        env:
          BASE_URL: http://127.0.0.1:3100

      - name: Prune retained static reports
        run: npm run reports:prune

      - name: Verify report redaction and provenance
        run: npm run reports:remediate -- --check

      - name: Build static report manifest
        run: npm run reports:manifest

      - name: Build corpus stats
        run: npm run corpus:stats

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-report-${{ steps.scan.outputs.report_id }}
          path: |
            ${{ steps.scan.outputs.report_path }}
            ${{ steps.scan.outputs.sidecar_path }}
            public/reports/index.json
            public/corpus-stats.json
          if-no-files-found: error

      - name: Commit static report
        id: commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add public/reports public/corpus-stats.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Add site behavior scan report"
          # Reports and pruning were validated against this exact checkout. If
          # the branch advanced, fail safely and rerun rather than transplanting
          # stale generated output onto a source tree it was never checked with.
          if ! git push; then
            echo "::error::The branch advanced after report validation; refusing to rebase stale generated output. Rerun this workflow from the latest branch head."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger CI on the pushed commit
        # Pushes made with GITHUB_TOKEN never fire `on: push` workflows, so the
        # commit above would stay untested and the CI-gated production branch
        # would never receive it. Dispatch CI explicitly; that tested CI run
        # advances `production` itself once all required jobs pass.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
