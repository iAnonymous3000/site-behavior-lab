name: Scan Featured Sites

on:
  workflow_dispatch:
    inputs:
      sites_file:
        description: Catalog to scan (featured gallery, or the corpus de-bias seed list)
        required: false
        default: public/featured-sites.json
        type: choice
        options:
          - public/featured-sites.json
          - public/corpus-seed-sites.json
      categories:
        description: Comma-separated category ids to scan (blank = all)
        required: false
        type: string
      limit:
        description: Max number of sites to scan (blank = all)
        required: false
        type: string
      compare_gpc:
        description: Run a GPC off/on comparison per site
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      compare_shields:
        description: Run a Shields off/on comparison per site (tried-vs-blocked; takes precedence over consent and GPC)
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      compare_consent:
        description: Run a consent accept-all/reject-all comparison per site (takes precedence over GPC; set compare_shields to false)
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      device:
        description: Viewport
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - mobile
      report_mode:
        description: Report contract (r2 requires controlled self-hosted egress)
        required: true
        default: v1
        type: choice
        options:
          - v1
          - r2
  repository_dispatch:
    types:
      - site-behavior-featured-scan
  schedule:
    # Weekly corpus refresh (Mondays 05:23 UTC). Scheduled runs use the input
    # defaults: Shields comparisons over the featured catalog, committed to the
    # default branch, which publishes via the Pages build. Each site's newest
    # generations are exempt from age pruning (scripts/prune-static-reports.mjs),
    # so the refresh feeds the directory's "changed since last scan" view instead
    # of replacing the corpus.
    - cron: "23 5 * * 1"

permissions:
  contents: write
  # Lets the post-push step dispatch CI (see 'Trigger CI on the pushed commit').
  actions: write
  # The authoritative full refresh reconciles one canonical failure issue.
  issues: write

# Shared with scan.yml and update-brave-lists.yml: one writer at a time per ref.
concurrency:
  group: site-behavior-repo-writers-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Internal scanner builds still render canonical metadata. Keep the build
  # fail-closed on the same public origin as CI and the deployed Pages site.
  NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: "https://sitebehavior.org"
  # `/api/health` must identify the exact checkout before a scan can start.
  SITE_BEHAVIOR_LAB_BUILD_COMMIT: ${{ github.sha }}
  FEATURED_SITES_FILE: ${{ github.event.inputs.sites_file || github.event.client_payload.sites_file || '' }}
  FEATURED_CATEGORIES: ${{ github.event.inputs.categories || github.event.client_payload.categories || '' }}
  FEATURED_LIMIT: ${{ github.event.inputs.limit || github.event.client_payload.limit || '' }}
  FEATURED_COMPARE_GPC: ${{ github.event.inputs.compare_gpc || github.event.client_payload.compare_gpc || 'false' }}
  FEATURED_COMPARE_SHIELDS: ${{ github.event.inputs.compare_shields || github.event.client_payload.compare_shields || 'true' }}
  FEATURED_COMPARE_CONSENT: ${{ github.event.inputs.compare_consent || github.event.client_payload.compare_consent || 'false' }}
  FEATURED_DEVICE: ${{ github.event.inputs.device || github.event.client_payload.device || 'desktop' }}
  # Scheduled runs remain on frozen v1 until a controlled runner is configured.
  # GitHub-hosted refreshes remain v1. The r2 gate requires operator-attested
  # self-hosted egress with a stable region, so the default Shields comparison
  # never invents placement or weakens comparison eligibility.
  FEATURED_REPORT_MODE: ${{ github.event.inputs.report_mode || github.event.client_payload.report_mode || vars.FEATURED_REPORT_MODE || 'v1' }}
  FEATURED_R2_EGRESS_ATTESTED: ${{ vars.FEATURED_R2_EGRESS_ATTESTED || '' }}
  # This adjustable gate measures success among currently eligible sites.
  # Operators can raise it, but never lower its 80% floor. A separate fixed,
  # non-overridable gate in the orchestrator also requires at least 80% of the
  # whole featured catalog and at least 50 sites to remain eligible.
  FEATURED_MIN_SUCCESS_RATE: ${{ vars.FEATURED_MIN_SUCCESS_RATE || '0.8' }}
  # Disclose that the corpus was scanned from CI (GitHub-hosted runner egress).
  # Override with a repo Actions variable named SCANNER_EGRESS if you scan elsewhere.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS: ${{ vars.SCANNER_EGRESS || 'github-actions-ubuntu' }}
  # GitHub-hosted runners have no reliable region metadata and remain v1. An r2
  # run reaches the scanner only after the preflight verifies the controlled
  # self-hosted runner's operator-declared stable region.
  SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION: ${{ vars.SCANNER_EGRESS_REGION || '' }}

jobs:
  scan-featured:
    name: Populate Featured Gallery
    # Keep the zero-configuration path on GitHub-hosted Ubuntu. To activate r2
    # comparisons, point FEATURED_RUNNER_LABEL at a controlled self-hosted
    # runner, configure SCANNER_EGRESS + SCANNER_EGRESS_REGION, then set the
    # explicit egress-attestation variable checked below.
    runs-on: ${{ vars.FEATURED_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One dist/schema build for the WHOLE job (RFC 10.3): every later step
      # (preflight, featured scans, prune, manifest, corpus stats) sees the env
      # flag and skips its own compile of the same artifact.
      - name: Build the dist/schema artifact once
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Prepare featured report production
        # Exact HEAD, a clean checkout, consent verification, and truthful
        # comparison egress are checked before Next or Chromium can scan.
        run: node dist/schema/lib/featured-report-preflight-cli.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build scanner app
        run: npm run build

      - name: Start scanner app
        run: |
          if node -e '
            const socket = require("node:net").createConnection({ host: "127.0.0.1", port: 3100 });
            socket.setTimeout(1000);
            socket.once("connect", () => { socket.destroy(); process.exit(0); });
            socket.once("error", () => process.exit(1));
            socket.once("timeout", () => { socket.destroy(); process.exit(1); });
          '; then
            echo "::error::Port 3100 was already occupied before startup; refusing a stale scanner process."
            exit 1
          fi
          expected_egress_region="$SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION"
          if [[ -z "$expected_egress_region" ]]; then
            # An empty Actions env entry is still present in Node's process
            # environment. Remove it so the v1 runner truthfully reports the
            # region as unrecorded instead of rejecting a blank declaration.
            unset SITE_BEHAVIOR_LAB_SCANNER_EGRESS_REGION
          fi
          node node_modules/next/dist/bin/next start --port 3100 > /tmp/site-behavior-lab-featured.log 2>&1 &
          app_pid=$!
          echo "$app_pid" > /tmp/site-behavior-lab-featured.pid
          health_path="${RUNNER_TEMP}/site-behavior-lab-featured-health.json"
          for attempt in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::The scanner process exited before it became ready; refusing a response from any stale port owner."
              cat /tmp/site-behavior-lab-featured.log
              exit 1
            fi
            if curl -fsS --connect-timeout 2 --max-time 5 \
              --output "$health_path" http://127.0.0.1:3100/api/health; then
              if node -e '
                const fs = require("node:fs");
                const [file, expectedSha, requestedMode, expectedRegion] = process.argv.slice(1);
                let health;
                try {
                  health = JSON.parse(fs.readFileSync(file, "utf8"));
                } catch (error) {
                  console.error(`Health response is not valid JSON: ${error instanceof Error ? error.message : error}`);
                  process.exit(1);
                }
                const mode = requestedMode.trim().toLowerCase();
                const failures = [];
                const expect = (condition, message) => { if (!condition) failures.push(message); };
                expect(mode === "v1" || mode === "r2", `unsupported requested mode ${requestedMode}`);
                expect(health?.ok === true, "health.ok is not true");
                expect(health?.deployment === expectedSha.toLowerCase(), `deployment is ${health?.deployment ?? "missing"}, expected ${expectedSha}`);
                expect(health?.scansAvailable === true, "scansAvailable is not true");
                const expectedR2Status = mode === "r2" ? "enabled" : "disabled";
                expect(health?.checks?.publicR2Reports?.status === expectedR2Status, `public r2 status is ${health?.checks?.publicR2Reports?.status ?? "missing"}, expected ${expectedR2Status}`);
                const expectedRegionStatus = expectedRegion.trim() ? "configured" : "unrecorded";
                expect(health?.checks?.scannerEgressRegion === expectedRegionStatus, `egress-region status is ${health?.checks?.scannerEgressRegion ?? "missing"}, expected ${expectedRegionStatus}`);
                const expectedConsentStatus = mode === "r2" ? "enabled" : "disabled";
                expect(health?.checks?.consentVerification === expectedConsentStatus, `consent-verification status is ${health?.checks?.consentVerification ?? "missing"}, expected ${expectedConsentStatus}`);
                if (mode === "r2") expect(expectedRegion.trim() !== "", "r2 requires an expected stable egress region");
                if (failures.length) {
                  console.error(`Scanner health contract rejected: ${failures.join("; ")}`);
                  process.exit(1);
                }
              ' "$health_path" "$GITHUB_SHA" "$FEATURED_REPORT_MODE" "$expected_egress_region" && \
                kill -0 "$app_pid" 2>/dev/null; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "::error::The scanner did not satisfy the expected process and health contract."
          cat /tmp/site-behavior-lab-featured.log
          exit 1

      - name: Run featured scans
        id: featured_scan
        continue-on-error: true
        run: npm run scan:featured
        env:
          BASE_URL: http://127.0.0.1:3100
          FEATURED_SUMMARY_PATH: ${{ runner.temp }}/featured-scan-summary.json

      - name: Classify reports for partial publication
        id: refresh_policy
        if: always()
        env:
          FEATURED_SUMMARY_PATH: ${{ runner.temp }}/featured-scan-summary.json
          FEATURED_SCAN_OUTCOME: ${{ steps.featured_scan.outcome }}
        run: node scripts/run-featured-scans-diagnostics.mjs --classify-publication

      - name: Prune retained static reports
        # Retention is independent of aggregate batch health. The pruner keeps
        # each cohort's newest generations and a broad per-site disappearance
        # guard, so failed targets retain evidence while validated successes do
        # not make a below-threshold corpus grow without bound.
        if: steps.refresh_policy.outputs.publishable == 'true'
        run: npm run reports:prune

      - name: Verify report redaction and provenance
        id: report_validation
        if: steps.refresh_policy.outputs.publishable == 'true'
        run: npm run reports:remediate -- --check

      - name: Build static report manifest
        id: report_manifest
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.report_validation.outcome == 'success'
        run: npm run reports:manifest

      - name: Build corpus stats
        id: corpus_stats
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.report_validation.outcome == 'success' &&
          steps.report_manifest.outcome == 'success'
        run: npm run corpus:stats

      - name: Summarize corpus
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.corpus_stats.outcome == 'success'
        run: |
          REPORTS=$(jq '.reports | length' public/reports/index.json 2>/dev/null || echo 0)
          SAMPLE=$(jq '.sampleSize' public/corpus-stats.json 2>/dev/null || echo 0)
          {
            echo "## Featured scan corpus"
            echo ""
            echo "- Listed reports in manifest: **$REPORTS**"
            echo "- Distinct sites in corpus (sampleSize): **$SAMPLE**"
            echo "- Corpus-relative percentile findings activate at 50 distinct sites (CORPUS_MIN_SAMPLE)."
            echo "- Branch \`${GITHUB_REF_NAME}\`: reports were committed here. Merge an ordinary feature branch to \`main\`; after CI passes, automation alone fast-forwards the protected \`production\` branch and publishes Pages. Never move \`production\` by hand."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.corpus_stats.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-featured-reports
          path: |
            public/reports
            public/corpus-stats.json
          if-no-files-found: error

      - name: Commit static reports
        id: commit
        # A below-threshold batch remains red below, but its independently
        # validated reports still advance the evidence base and corpus stats.
        if: >-
          steps.refresh_policy.outputs.publishable == 'true' &&
          steps.report_validation.outcome == 'success' &&
          steps.report_manifest.outcome == 'success' &&
          steps.corpus_stats.outcome == 'success'
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add public/reports public/corpus-stats.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Add featured site behavior scan reports"
          # Reports and pruning were validated against this exact checkout. If
          # the branch advanced, fail safely and rerun rather than transplanting
          # stale generated output onto a source tree it was never checked with.
          if ! git push; then
            echo "::error::The branch advanced after report validation; refusing to rebase stale generated output. Rerun this workflow from the latest branch head."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger CI on the pushed commit
        # Pushes made with GITHUB_TOKEN never fire `on: push` workflows, so the
        # commit above would stay untested and the CI-gated production branch
        # would never receive it. Dispatch CI explicitly; that tested CI run
        # advances `production` itself once all required jobs pass.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Prepare public-safe refresh alert
        id: refresh_alert
        if: always()
        env:
          FEATURED_ALERT_REPORT_PATH: ${{ runner.temp }}/featured-corpus-refresh.md
          FEATURED_SUMMARY_PATH: ${{ runner.temp }}/featured-scan-summary.json
          FEATURED_SCAN_OUTCOME: ${{ steps.featured_scan.outcome }}
          FEATURED_JOB_STATUS: ${{ job.status }}
          FEATURED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/run-featured-scans-diagnostics.mjs --prepare-alert

      - name: Upload failed-run diagnostics
        if: >-
          always() &&
          (steps.refresh_alert.outcome != 'success' ||
          steps.refresh_alert.outputs.failed == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: featured-scan-failure-diagnostics
          path: |
            ${{ runner.temp }}/featured-scan-summary.json
            ${{ runner.temp }}/featured-corpus-refresh.md
            /tmp/site-behavior-lab-featured.log
          if-no-files-found: warn

      - name: Reconcile the featured-corpus refresh issue
        # Only an unfiltered, default-mode full catalog run on the default
        # branch is authoritative. Filtered or alternate-mode dispatches cannot
        # open or close the repository-wide weekly-health issue.
        if: >-
          always() &&
          steps.refresh_alert.outcome == 'success' &&
          steps.refresh_alert.outputs.authoritative == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Repair the weekly featured corpus refresh
          MANAGED_ISSUE_LABEL: site-behavior-lab-featured-refresh
          REFRESH_REPORT_FILE: ${{ runner.temp }}/featured-corpus-refresh.md
          REFRESH_FAILED: ${{ steps.refresh_alert.outputs.failed }}
        run: |
          set -euo pipefail

          if ! gh api --silent "repos/${GITHUB_REPOSITORY}/labels/${MANAGED_ISSUE_LABEL}"; then
            gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f "name=${MANAGED_ISSUE_LABEL}" \
              -f color=1d76db \
              -f description="Managed by the Site Behavior Lab featured-refresh workflow" || \
              gh api --silent "repos/${GITHUB_REPOSITORY}/labels/${MANAGED_ISSUE_LABEL}"
          fi

          candidates=$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          match=$(printf '%s' "$candidates" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const marker = "<!-- site-behavior-lab:featured-corpus-refresh -->";
              const managedLabel = process.env.MANAGED_ISSUE_LABEL;
              const trusted = JSON.parse(source)
                .flat()
                .map((issue) => {
                  const labels = Array.isArray(issue.labels)
                    ? issue.labels.map((label) => typeof label === "string" ? label : label?.name)
                    : [];
                  return !issue.pull_request &&
                    issue.user?.login === "github-actions[bot]" &&
                    issue.user?.type === "Bot" &&
                    typeof issue.body === "string" &&
                    issue.body.includes(marker) ? { issue, labels } : null;
                })
                .filter(Boolean);
              const managed = trusted.filter(({ labels }) => labels.includes(managedLabel));
              const legacy = trusted.filter(({ issue, labels }) =>
                !labels.includes(managedLabel) && issue.title === process.env.ISSUE_TITLE);
              if (managed.length > 1 || legacy.length > 1 || (managed.length === 1 && legacy.length === 1)) {
                throw new Error("Found conflicting canonical refresh issues; expected at most one trusted managed or legacy issue.");
              }
              const selected = managed[0] ?? legacy[0];
              if (selected) {
                process.stdout.write(`${selected.issue.number}|${selected.issue.state}|${legacy.length === 1 ? "true" : "false"}`);
              }
            });
          ')

          IFS='|' read -r issue_number issue_state issue_needs_label <<< "$match"
          if [[ -z "$match" ]]; then
            issue_number=""
            issue_state=""
            issue_needs_label="false"
          elif [[ "$issue_needs_label" == "true" ]]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label "$MANAGED_ISSUE_LABEL"
          fi

          if [[ "$REFRESH_FAILED" == "true" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$REFRESH_REPORT_FILE" \
                --label "$MANAGED_ISSUE_LABEL"
            else
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$REFRESH_REPORT_FILE"
              if [[ "$issue_state" == "closed" ]]; then
                gh issue reopen "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "The authoritative featured-corpus refresh is failing again; the issue body now links to the current run."
              fi
            fi
          elif [[ "$REFRESH_FAILED" == "false" ]]; then
            if [[ -n "$issue_number" && "$issue_state" == "open" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$REFRESH_REPORT_FILE"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "The authoritative featured-corpus refresh completed successfully."
            fi
          else
            echo "::error title=Invalid featured refresh status::The alert preparer returned an invalid failure status."
            exit 1
          fi

      - name: Preserve featured-refresh failure
        if: >-
          always() &&
          (job.status != 'success' ||
          steps.refresh_alert.outcome != 'success' ||
          steps.refresh_alert.outputs.failed == 'true')
        run: |
          echo "::error title=Featured corpus refresh failed::The refresh or its required failure reconciliation did not complete. See the canonical issue for an authoritative full run and the failed-run diagnostics artifact for bounded details."
          exit 1
