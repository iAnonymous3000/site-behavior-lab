name: Scanner Fidelity

# Scan real websites and assert invariants of the SCANNER.
#
# Deliberately NOT a required pull-request gate. It depends on third-party sites
# being reachable, so making a merge wait on the BBC's uptime would teach people
# to ignore it. It runs on a schedule instead, where a red result is a signal to
# investigate rather than a blocked branch, and the required gates stay
# hermetic.
#
# What it is for: every other test here drives the scanner with a fixture, and a
# fixture never has a ninety-character headline in its footer. That is exactly
# how a link-label budget came to censor the detector evidence of two-thirds of
# all scans and publish "this scan was cut short" over complete request logs,
# while unit tests, audits and adversarial review all stayed green.

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Scan shape
        required: true
        default: single
        type: choice
        options:
          - single
          - shields
          - gpc
          - consent
      device:
        description: Viewport
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - mobile
      repetitions:
        description: Independent attempts per target
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

concurrency:
  group: scanner-fidelity
  cancel-in-progress: true

jobs:
  fidelity:
    name: Scan real sites and assert scanner invariants (${{ matrix.mode }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        # A manual dispatch runs exactly the requested scan shape. The
        # scheduled leg passes no inputs, so it fans out across all four modes
        # in parallel; the comparison shapes (shields, gpc, consent) have
        # caught the worst reader-facing defects when run by hand and must not
        # depend on someone remembering to dispatch them.
        mode: ${{ inputs.mode && fromJSON(format('["{0}"]', inputs.mode)) || fromJSON('["single", "shields", "gpc", "consent"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the repository's exact Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1

      - name: Verify the exact toolchain before install
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Allow the Chromium sandbox to initialize on the hosted runner
        run: |
          set -euo pipefail
          current="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)"
          if [[ "$current" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unavailable)"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: https://sitebehavior.org

      - name: Start the scanner
        run: |
          set -euo pipefail
          npm run start -- --port 3000 > /tmp/scanner-fidelity.log 2>&1 &
          echo $! > /tmp/scanner-fidelity.pid
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scanner-fidelity.log
          exit 1
        env:
          # r2 is the producer production runs, and the per-family quality block
          # these invariants read exists only there.
          SITE_BEHAVIOR_LAB_PUBLIC_R2_REPORTS: "1"
          SITE_BEHAVIOR_LAB_CONSENT_VERIFICATION: "1"
          SITE_BEHAVIOR_LAB_BUILD_COMMIT: ${{ github.sha }}
          SITE_BEHAVIOR_LAB_SCANNER_EGRESS: github-actions-ubuntu
          SITE_BEHAVIOR_LAB_CHROMIUM_SANDBOX: "1"

      - name: Assert scanner invariants against real sites
        run: npm run test:smoke:scanner-fidelity
        env:
          SCANNER_FIDELITY_SHARD_COUNT: "2"
          SCANNER_FIDELITY_SHARD_INDEX: ${{ matrix.shard }}
          # Keep the repeatability path live without pretending a target is
          # stable: both runs must independently be invariant-clean and
          # request-complete before they enter the denominator.
          SCANNER_FIDELITY_MODE: ${{ matrix.mode }}
          SCANNER_FIDELITY_DEVICE: ${{ inputs.device || 'desktop' }}
          SCANNER_FIDELITY_REPETITIONS: ${{ inputs.repetitions || '2' }}
          # A deliberate one-repetition manual smoke has no repeatability
          # denominator; scheduled/default runs require at least one target.
          SCANNER_FIDELITY_MIN_REPEATABLE_TARGETS: ${{ inputs.repetitions == '1' && '0' || '1' }}
          SCANNER_FIDELITY_OUTPUT: ${{ runner.temp }}/scanner-fidelity-attempts-${{ matrix.mode }}-${{ matrix.shard }}.json
          SITE_BEHAVIOR_LAB_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload the complete attempted-run ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-fidelity-attempts-${{ matrix.mode }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/scanner-fidelity-attempts-${{ matrix.mode }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Scanner log on failure
        if: failure()
        run: tail -100 /tmp/scanner-fidelity.log || true
