name: Production Health

on:
  schedule:
    # GitHub-hosted monitoring with no external uptime service. A 15-minute
    # interval is frequent enough to surface outages without creating noise.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  scanner:
    name: Verify scanner health and posture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve expected production revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: production
          fetch-depth: 1

      - name: Record expected production revision and gated feature states
        env:
          PRODUCTION_CONFIG_FILE: ${{ github.workspace }}/wrangler.container.jsonc
        run: |
          set -euo pipefail
          echo "EXPECTED_PRODUCTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require("node:fs");

          const source = fs.readFileSync(process.env.PRODUCTION_CONFIG_FILE, "utf8");
          const matches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_DURABLE_JOBS"\s*:\s*"([^"]*)"/g)
          ];
          if (matches.length !== 1 || (matches[0][1] !== "0" && matches[0][1] !== "1")) {
            console.error(
              "::error title=Invalid production durable-jobs expectation::" +
                "wrangler.container.jsonc must declare SITE_BEHAVIOR_LAB_DURABLE_JOBS exactly once as \"0\" or \"1\"."
            );
            process.exit(1);
          }

          const shardingMatches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_CONTAINER_SHARDING"\s*:\s*"([^"]*)"/g)
          ];
          const shardCountMatches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_CONTAINER_SHARD_COUNT"\s*:\s*"([^"]*)"/g)
          ];
          const shardingFlag = shardingMatches[0]?.[1];
          const shardCountWire = shardCountMatches[0]?.[1];
          const shardCount = Number(shardCountWire);
          if (
            shardingMatches.length !== 1 ||
            (shardingFlag !== "0" && shardingFlag !== "1") ||
            shardCountMatches.length !== 1 ||
            !/^[1-3]$/.test(shardCountWire ?? "") ||
            !Number.isSafeInteger(shardCount) ||
            (shardingFlag === "1" && (matches[0][1] !== "1" || shardCount < 2))
          ) {
            console.error(
              "::error title=Invalid production container-sharding expectation::" +
                "wrangler.container.jsonc must declare one exact 0/1 sharding flag and one shard count from 1 to 3; enabled sharding requires durable jobs and at least two shards."
            );
            process.exit(1);
          }

          const watchMatches = [
            ...source.matchAll(/"SITE_BEHAVIOR_LAB_ENCRYPTED_WATCHES"\s*:\s*"([^"]*)"/g)
          ];
          if (watchMatches.length !== 1 || (watchMatches[0][1] !== "0" && watchMatches[0][1] !== "1")) {
            console.error(
              "::error title=Invalid production encrypted-watches expectation::" +
                "wrangler.container.jsonc must declare SITE_BEHAVIOR_LAB_ENCRYPTED_WATCHES exactly once as \"0\" or \"1\"."
            );
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_DURABLE_JOBS=${matches[0][1]}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_CONTAINER_SHARDING=${shardingFlag}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_CONTAINER_SHARD_COUNT=${shardCountWire}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_ENCRYPTED_WATCHES=${watchMatches[0][1]}\n`);
          NODE

      - name: Wait for exact scanner and Pages revisions
        env:
          HEALTH_URL: https://scan.sitebehavior.org/api/health
          PAGES_DEPLOYMENT_URL: https://sitebehavior.org/deployment.json
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            scanner=""
            pages=""
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$HEALTH_URL" > "$RUNNER_TEMP/production-health.json"; then
              scanner=$(jq -r '.deployment // empty' "$RUNNER_TEMP/production-health.json" 2>/dev/null || true)
            fi
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$PAGES_DEPLOYMENT_URL" > "$RUNNER_TEMP/production-pages-deployment.json"; then
              pages=$(jq -r '.deployment // empty' "$RUNNER_TEMP/production-pages-deployment.json" 2>/dev/null || true)
            fi
            if [[ "$scanner" == "$EXPECTED_PRODUCTION_SHA" && "$pages" == "$EXPECTED_PRODUCTION_SHA" ]]; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "::error title=Production rollout stale::expected $EXPECTED_PRODUCTION_SHA, scanner=${scanner:-unavailable}, Pages=${pages:-unavailable}"
              exit 1
            fi
            echo "Waiting for production rollout (attempt $attempt/6): scanner=${scanner:-unavailable}, Pages=${pages:-unavailable}"
            sleep 15
          done

      - name: Fetch live Pages report contract
        env:
          SCHEMA_URL: https://sitebehavior.org/scan-report.schema.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 75 \
            "$SCHEMA_URL" > "$RUNNER_TEMP/production-scan-report-schema.json"

      - name: Validate availability and production posture
        env:
          HEALTH_FILE: ${{ runner.temp }}/production-health.json
          PAGES_DEPLOYMENT_FILE: ${{ runner.temp }}/production-pages-deployment.json
          SCHEMA_FILE: ${{ runner.temp }}/production-scan-report-schema.json
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function readJson(path, label) {
            try {
              return JSON.parse(fs.readFileSync(path, "utf8"));
            } catch (error) {
              console.error(`::error title=${label} is not valid JSON::${error.message}`);
              process.exit(1);
            }
          }

          const health = readJson(process.env.HEALTH_FILE, "Health response");
          const pagesDeployment = readJson(process.env.PAGES_DEPLOYMENT_FILE, "Pages deployment provenance");
          const schema = readJson(process.env.SCHEMA_FILE, "Pages report schema");
          const expectedDeployment = process.env.EXPECTED_PRODUCTION_SHA;
          const expectedDurableJobs = process.env.EXPECTED_DURABLE_JOBS;
          const expectedContainerSharding = process.env.EXPECTED_CONTAINER_SHARDING;
          const expectedContainerShardCount = Number(process.env.EXPECTED_CONTAINER_SHARD_COUNT);
          const expectedEncryptedWatches = process.env.EXPECTED_ENCRYPTED_WATCHES;
          const failures = [];
          const assertPosture = (condition, message) => {
            if (!condition) failures.push(message);
          };

          assertPosture(health?.ok === true, "ok must be true");
          assertPosture(health?.status === "ok", `status must be ok (received ${JSON.stringify(health?.status)})`);
          assertPosture(health?.scansAvailable === true, "scansAvailable must be true");
          assertPosture(Array.isArray(health?.warnings) && health.warnings.length === 0, "warnings must be an empty array");
          assertPosture(health?.authenticated === false, "temporary access-token authentication must be disabled");
          assertPosture(health?.openAccess === true, "public scan access must be enabled");
          assertPosture(health?.turnstile === true, "Turnstile must be enabled");
          assertPosture(health?.storage === "r2", "report storage must be R2");
          assertPosture(health?.checks?.scanAccess === "open", "scan access check must report open");
          assertPosture(health?.checks?.adblock?.active === true, "adblock engine must be active");
          assertPosture(health?.checks?.adblock?.engine === "loaded", "adblock engine must report loaded");
          assertPosture(health?.checks?.chromiumSandbox === "enabled", "Chromium sandbox must be enabled");
          assertPosture(health?.checks?.reportStore?.kind === "r2", "report store check must report R2");
          assertPosture(health?.checks?.reportStore?.configuredPath === true, "R2 report path must be configured");
          assertPosture(health?.checks?.reportStore?.maxAgeDays === 7, "R2 report retention must be seven days");
          // This endpoint intentionally proves configuration only. A future
          // scoped synthetic scan/read/delete monitor must cover remote R2
          // reachability without leaving test reports behind.
          assertPosture(health?.checks?.scannerEgress === "configured", "scanner egress proxy must be configured");
          assertPosture(health?.checks?.scannerEgressRegion === "configured",
            "scanner egress region must be recorded so r2 comparison metrics remain eligible");
          assertPosture(health?.checks?.consentVerification === "enabled",
            "consent registration verification must be enabled");
          assertPosture(health?.checks?.publicR2Reports?.status === "enabled",
            "public ScanReport v2/r2 production must be enabled");
          assertPosture(health?.checks?.v2ShadowEmission?.status === "disabled",
            "private v2 shadow emission must be disabled during normal public operation");
          assertPosture(health?.checks?.durableJobs?.faultInjection === undefined,
            "production must never advertise the staging replay-fault hook");
          if (expectedDurableJobs === "1") {
            assertPosture(health?.checks?.durableJobs?.requested === true,
              "durable jobs must report requested when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.enabled === true,
              "durable jobs must report enabled when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.readiness === "ready",
              "durable jobs must report ready when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.coordinatorOrigin === "https://scan.sitebehavior.org",
              "durable jobs must use the exact production coordinator origin");
          } else if (expectedDurableJobs === "0") {
            assertPosture(health?.checks?.durableJobs?.requested === false,
              "durable jobs must not report requested while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.enabled === false,
              "durable jobs must not report enabled while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.readiness === "disabled",
              "durable jobs must report disabled while disabled in production config");
          } else {
            failures.push(`production durable-jobs expectation must be 0 or 1 (received ${JSON.stringify(expectedDurableJobs)})`);
          }
          if (expectedContainerSharding === "1") {
            assertPosture(expectedDurableJobs === "1",
              "container sharding must not be enabled unless durable jobs are enabled");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.requested === true,
              "container sharding must report requested when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.enabled === true,
              "container sharding must report enabled when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.readiness === "ready",
              "container sharding must report ready when enabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.shardCount === expectedContainerShardCount,
              `container sharding must report configured count ${expectedContainerShardCount}`);
          } else if (expectedContainerSharding === "0") {
            assertPosture(health?.checks?.durableJobs?.containerSharding?.requested === false,
              "container sharding must not report requested while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.enabled === false,
              "container sharding must not report enabled while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.readiness === "disabled",
              "container sharding must report disabled while disabled in production config");
            assertPosture(health?.checks?.durableJobs?.containerSharding?.shardCount === 1,
              "disabled container sharding must collapse effective topology to one shard");
          } else {
            failures.push(`production container-sharding expectation must be 0 or 1 (received ${JSON.stringify(expectedContainerSharding)})`);
          }
          if (expectedEncryptedWatches === "1") {
            assertPosture(health?.checks?.encryptedWatches?.requested === true,
              "encrypted watches must report requested when enabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.enabled === true,
              "encrypted watches must report enabled when enabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.readiness === "ready",
              "encrypted watches must report ready when enabled in production config");
            assertPosture(health?.capabilities?.scheduledRescans === true,
              "scheduled rescans must be advertised when encrypted watches are ready");
          } else if (expectedEncryptedWatches === "0") {
            assertPosture(health?.checks?.encryptedWatches?.requested === false,
              "encrypted watches must not report requested while disabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.enabled === false,
              "encrypted watches must not report enabled while disabled in production config");
            assertPosture(health?.checks?.encryptedWatches?.readiness === "disabled",
              "encrypted watches must report disabled while disabled in production config");
            assertPosture(health?.capabilities?.scheduledRescans === false,
              "scheduled rescans must not be advertised while encrypted watches are disabled");
          } else {
            failures.push(`production encrypted-watches expectation must be 0 or 1 (received ${JSON.stringify(expectedEncryptedWatches)})`);
          }
          assertPosture(schema?.$id === "https://sitebehavior.org/schemas/scan-report.v2.r2.schema.json",
            "live Pages must advertise the ScanReport v2/r2 contract");
          assertPosture(Number.isFinite(health?.limits?.publicScanRateLimitPerMinute) && health.limits.publicScanRateLimitPerMinute > 0,
            "per-minute public scan rate limit must be active");
          assertPosture(Number.isFinite(health?.limits?.publicScanRateLimitPerDay) && health.limits.publicScanRateLimitPerDay > 0,
            "daily public scan rate limit must be active");
          assertPosture(typeof health?.deployment === "string" && /^[0-9a-f]{40}$/.test(health.deployment),
            "live deployment must report a full commit SHA");
          assertPosture(health?.deployment === expectedDeployment,
            `scanner deployment must match production (${expectedDeployment}, received ${health?.deployment})`);
          assertPosture(pagesDeployment?.schemaVersion === 1,
            "Pages deployment provenance must use schema version 1");
          assertPosture(typeof pagesDeployment?.deployment === "string" && /^[0-9a-f]{40}$/.test(pagesDeployment.deployment),
            "Pages deployment must report a full commit SHA");
          assertPosture(pagesDeployment?.deployment === expectedDeployment,
            `Pages deployment must match production (${expectedDeployment}, received ${pagesDeployment?.deployment})`);

          const timestamp = Date.parse(health?.timestamp);
          const ageMs = Date.now() - timestamp;
          assertPosture(Number.isFinite(timestamp), "health timestamp must be a valid date");
          assertPosture(ageMs >= -60_000, "health timestamp must not be more than one minute in the future");
          assertPosture(ageMs <= 5 * 60_000, "health timestamp must be no more than five minutes old");

          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error title=Production health regression::${failure}`);
            console.error(JSON.stringify(health, null, 2));
            process.exit(1);
          }

          const summary = [
            "## Production scanner health",
            "",
            "- Status: **ok**",
            "- Public scanning: **available** (Turnstile protected)",
            "- Public report contract: **ScanReport v2/r2**",
            "- Scanner egress region: **configured**",
            "- Consent registration verification: **enabled**",
            `- Durable jobs: **${expectedDurableJobs === "1" ? "ready" : "disabled"}** (matches production config)`,
            `- Container sharding: **${expectedContainerSharding === "1" ? `${expectedContainerShardCount} shards ready` : "disabled"}** (matches production config)`,
            `- Encrypted scheduled rescans: **${expectedEncryptedWatches === "1" ? "ready" : "disabled"}** (matches production config)`,
            "- Pages report contract: **v2/r2**",
            "- Report storage: **R2**, seven-day retention",
            `- Scanner deployment: \`${health.deployment}\``,
            `- Pages deployment: \`${pagesDeployment.deployment}\``,
            "- Warnings: **none**"
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(`Production scanner is healthy at ${health.timestamp}.`);
          NODE
