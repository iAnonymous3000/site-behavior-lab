name: Archive Deployment Records

# Each production container deployment leaves a signed record as a 90-day
# Actions artifact (.github/workflows/deploy-container.yml). This workflow,
# started by hand from main with a batch of deployment run ids, checks each
# run, each record and each record's signature
# (scripts/archive-deployment-records.mjs), and proposes the records and their
# attestation bundles under research/production-deployments/ through the
# reviewed automation/* pull-request path.
#
# It is started by hand, once a month, with the month's deployment runs,
# never per deployment: a merged proposal is a push to main, which deploys
# and leaves another record. It has no schedule on purpose; each proposal
# lands as a fresh commit on main by the maintainer, not on a day corpus
# refresh legs land.
# Nothing in the promotion path reads these files.

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Comma-separated run ids of completed Deploy Tested Container runs (at most 20)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: archive-deployment-records
  cancel-in-progress: false

jobs:
  archive:
    name: Propose the signed deployment records
    if: >-
      github.repository == 'iAnonymous3000/site-behavior-lab' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # The proposal's push-event CI run is parked for manual approval. This
      # permission starts separate non-promoting branch validation; that
      # workflow_dispatch run does not satisfy the PR's required checks.
      actions: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      # The script uses Node's own modules and the GitHub CLI only, so nothing
      # is installed from npm. Signatures are checked with the pinned CLI.
      - name: Collect and check the signed deployment records
        id: records
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          set -euo pipefail
          node scripts/archive-deployment-records.mjs collect --runs "$RUN_IDS" --into "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/written.txt"
          cat "$RUNNER_TEMP/written.txt"
          echo "count=$(grep -c '\.json$' "$RUNNER_TEMP/written.txt")" >> "$GITHUB_OUTPUT"

      - name: Publish reviewed deployment record proposal
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PROPOSAL_BRANCH: automation/production-deployments-${{ github.run_id }}-${{ github.run_attempt }}
          RECORD_COUNT: ${{ steps.records.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add research/production-deployments
          if git diff --cached --quiet; then
            echo "No record to propose."
            exit 0
          fi
          git checkout -B "$PROPOSAL_BRANCH"
          git commit -m "Keep ${RECORD_COUNT} signed production deployment records beyond the artifact window" \
            -m "Each record was held to its run's commit, id and attempt, and its attestation verified as signed by deploy-container.yml on the production branch."
          git push origin "HEAD:refs/heads/${PROPOSAL_BRANCH}"

          proposal_body="$RUNNER_TEMP/deployment-records-pr.md"
          printf '%s\n' \
            '<!-- site-behavior-lab:production-deployment-records-pr -->' \
            "# ${RECORD_COUNT} signed production deployment records" \
            '' \
            '- Each record names the image the provider reported running, the commit the live scanner reported, and the CI and deployment runs.' \
            '- Each was held to its run and its attestation verified before this proposal; each bundle sits beside its record.' \
            "- Before merge, manually approve this automation proposal's parked push-event CI run; the pull request's required checks remain expected until that run executes." \
            "- The separate non-promoting \`workflow_dispatch\` CI run validates this proposal branch but does not satisfy the pull request's required checks; trusted \`main\` CI runs only after merge." \
            > "$proposal_body"

          pr_error="$RUNNER_TEMP/deployment-records-pr-error.txt"
          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$PROPOSAL_BRANCH" \
            --title "Keep ${RECORD_COUNT} signed production deployment records" \
            --body-file "$proposal_body" 2>"$pr_error"; then
            cat "$pr_error" >&2
            if ! grep -q "not permitted to create or approve pull requests" "$pr_error"; then
              exit 1
            fi
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${PROPOSAL_BRANCH}?expand=1"
            echo "::error title=Open the proposal manually::Actions may not create PRs in this repository. Open ${compare_url}"
          fi
          gh workflow run ci.yml --ref "$PROPOSAL_BRANCH" --repo "$GITHUB_REPOSITORY"
