<text class="ts" x="168" y="241" text-anchor="middle">Turnstile, rate limit</text></g>

<g class="c-blue"><rect x="48" y="288" width="240" height="56" rx="8"/>
<text class="th" x="168" y="310" text-anchor="middle">Container scanner</text>
<text class="ts" x="168" y="326" text-anchor="middle">Node, Playwright Chromium</text></g>

<g class="c-blue"><rect x="48" y="440" width="240" height="52" rx="8"/>
<text class="th" x="168" y="461" text-anchor="middle">R2 report store</text>
<text class="ts" x="168" y="477" text-anchor="middle">durable saved reports</text></g>

<g class="c-gray"><rect x="410" y="120" width="230" height="48" rx="8"/>
<text class="th" x="525" y="140" text-anchor="middle">Target website</text>
<text class="ts" x="525" y="156" text-anchor="middle">public internet</text></g>

<g class="c-blue"><rect x="410" y="288" width="230" height="56" rx="8"/>
<text class="th" x="525" y="310" text-anchor="middle">SSRF egress proxy</text>
<text class="ts" x="525" y="326" text-anchor="middle">pins public IP at connect</text></g>

