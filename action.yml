name: "Site Behavior Lab v3 Privacy Gate"
description: "Run an automated Site Behavior Lab v3 privacy & behavior scan in CI, emit Markdown/SARIF 2.1.0 evidence, diff against a baseline, and enforce privacy regression gates."
branding:
  icon: "shield"
  color: "teal"

inputs:
  url:
    description: "Target URL to scan (e.g. staging preview URL or production site)."
    required: true
  device:
    description: "Browser device profile: desktop or mobile."
    required: false
    default: "desktop"
  region:
    description: "Regional locale/timezone profile: auto, us-east, eu-central, or ap-northeast."
    required: false
    default: "auto"
  compare:
    description: "Comma-separated concurrent comparison arms (e.g. shields-standard,gpc,consent-reject)."
    required: false
    default: "shields-standard,gpc"
  baseline:
    description: "Optional path to a baseline ScanReportV3 JSON file for temporal or staging-vs-prod regression diffing."
    required: false
    default: ""
  fail-on:
    description: "Comma-separated CI policy gates (keystrokes,cname,sgtm,fingerprinting,beacon-pii,dark-patterns>=35,third-parties>20,new-entities,regressions)."
    required: false
    default: "keystrokes,cname"
  fail-on-insufficient-evidence:
    description: "When a baseline is provided, fail with exit code 3 if visit conditions, load outcome, or probe coverage prevent a comparable regression judgment (default: true)."
    required: false
    default: "true"
  sarif-output:
    description: "Path where SARIF 2.1.0 findings JSON should be written."
    required: false
    default: "sbl-results.sarif"
  report-output:
    description: "Path where the redacted ScanReportV3 JSON artifact should be written."
    required: false
    default: "sbl-report.v3.json"
  allow-loopback:
    description: "Set to 'true' to scan a local 127.0.0.1 staging server started earlier in the job."
    required: false
    default: "false"

outputs:
  report-path:
    description: "Path to the saved redacted ScanReportV3 JSON report."
    value: ${{ inputs.report-output }}
  sarif-path:
    description: "Path to the generated SARIF 2.1.0 findings file."
    value: ${{ inputs.sarif-output }}
  baseline-comparability:
    description: "Comparability verdict when baseline is supplied: comparable, partial, insufficient-evidence, or none."
    value: ${{ steps.scan.outputs.baseline_comparability }}
  outcome:
    description: "Explicit gate outcome: pass, policy-violation, insufficient-evidence, or error."
    value: ${{ steps.scan.outputs.outcome }}

runs:
  using: "composite"
  steps:
    - name: Set up pinned Node runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.14.1"

    - name: Install Site Behavior Lab dependencies and Chromium
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npx playwright install --with-deps chromium

    - name: Run Site Behavior Lab v3 scan and privacy gates
      id: scan
      shell: bash
      env:
        SBL_ACTION_PATH: ${{ github.action_path }}
        SBL_URL: ${{ inputs.url }}
        SBL_DEVICE: ${{ inputs.device }}
        SBL_REGION: ${{ inputs.region }}
        SBL_COMPARE: ${{ inputs.compare }}
        SBL_BASELINE: ${{ inputs.baseline }}
        SBL_FAIL_ON: ${{ inputs.fail-on }}
        SBL_FAIL_ON_INSUFFICIENT: ${{ inputs.fail-on-insufficient-evidence }}
        SBL_SARIF_OUT: ${{ inputs.sarif-output }}
        SBL_REPORT_OUT: ${{ inputs.report-output }}
        SBL_ALLOW_LOOPBACK: ${{ inputs.allow-loopback }}
        SITE_BEHAVIOR_LAB_CHROMIUM_SANDBOX: "1"
      run: |
        set -euo pipefail
        ARGS=(
          scan "$SBL_URL"
          --device "$SBL_DEVICE"
          --region "$SBL_REGION"
          --format sarif
          --output "$SBL_SARIF_OUT"
          --save-report "$SBL_REPORT_OUT"
        )
        if [ -n "$SBL_COMPARE" ]; then
          ARGS+=(--compare "$SBL_COMPARE")
        fi
        if [ -n "$SBL_BASELINE" ]; then
          ARGS+=(--diff "$SBL_BASELINE")
          if [ "$SBL_FAIL_ON_INSUFFICIENT" != "false" ]; then
            ARGS+=(--fail-on-insufficient-evidence)
          fi
        fi
        if [ -n "$SBL_FAIL_ON" ]; then
          ARGS+=(--fail-on "$SBL_FAIL_ON")
        fi
        if [ "$SBL_ALLOW_LOOPBACK" = "true" ]; then
          ARGS+=(--allow-loopback)
        fi

        set +e
        node "$SBL_ACTION_PATH/bin/sbl.mjs" "${ARGS[@]}"
        SCAN_EXIT=$?
        set -e

        COMPARABILITY="none"
        if [ -f "$SBL_REPORT_OUT" ] && [ -n "$SBL_BASELINE" ]; then
          DIFF_JSON="$(node "$SBL_ACTION_PATH/bin/sbl.mjs" diff "$SBL_BASELINE" "$SBL_REPORT_OUT" --format json 2>/dev/null || true)"
          if [ -n "$DIFF_JSON" ]; then
            COMPARABILITY="$(node -e 'const d = JSON.parse(process.argv[1]); console.log(d?.comparability?.status || "unknown");' "$DIFF_JSON" 2>/dev/null || echo "unknown")"
          fi
        fi

        OUTCOME="error"
        if [ "$SCAN_EXIT" -eq 0 ]; then
          OUTCOME="pass"
        elif [ "$SCAN_EXIT" -eq 2 ]; then
          OUTCOME="policy-violation"
        elif [ "$SCAN_EXIT" -eq 3 ]; then
          OUTCOME="insufficient-evidence"
          echo "::error title=Site Behavior Lab baseline comparison unevaluable::Baseline comparability is '${COMPARABILITY}'. Visit conditions, load outcome, or probe coverage prevented a comparable regression judgment."
        fi

        if [ "$SCAN_EXIT" -eq 0 ] && [ "$COMPARABILITY" != "none" ] && [ "$COMPARABILITY" != "comparable" ]; then
          echo "::warning title=Site Behavior Lab baseline comparison unevaluable::Baseline comparability is '${COMPARABILITY}'; see step summary and SARIF for insufficient-evidence details."
        fi

        {
          echo "baseline_comparability=${COMPARABILITY}"
          echo "outcome=${OUTCOME}"
        } >> "$GITHUB_OUTPUT"

        if [ -f "$SBL_REPORT_OUT" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          if [ -n "$SBL_BASELINE" ]; then
            {
              echo "- **Gate outcome:** \`${OUTCOME}\` · **Baseline comparability:** \`${COMPARABILITY}\`"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            node "$SBL_ACTION_PATH/bin/sbl.mjs" diff "$SBL_BASELINE" "$SBL_REPORT_OUT" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          else
            node "$SBL_ACTION_PATH/bin/sbl.mjs" summary "$SBL_REPORT_OUT" >> "$GITHUB_STEP_SUMMARY" || true
          fi
        fi

        exit "$SCAN_EXIT"
