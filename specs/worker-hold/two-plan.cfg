\* The world of TWO_WORKER_WORLD under the plan's axioms: the rows that hold there and can be judged there (F4-READ,
\* and F4-TERM's first half). F4-AGE is not listed: with Stream FALSE the realm never goes past its first snapshot, so
\* every read is of that one snapshot and the row cannot tell a right read from a wrong one. stream-plan.cfg judges it.
CONSTANTS
  WorkerCount = 2
  CollapseSessions = TRUE
  Stream = FALSE
  StartReleased = FALSE
  Reduced = TRUE
  Assumed = {"A1", "A2", "notA3", "A4", "A5fifo", "A5bound"}
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  ReadHadItsObserver
  HeardLandsInOneTerm
