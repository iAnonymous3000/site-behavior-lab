name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Dispatched by the data workflows (scan, scan-featured, update-brave-lists)
  # after their GITHUB_TOKEN pushes, which never fire `on: push`: the corpus
  # commit gets a real CI run. This workflow promotes its own tested SHA because
  # a token-dispatched run does not reliably cascade into a third workflow via
  # `workflow_run`; Promote Production remains an idempotent fallback.
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_BEHAVIOR_LAB_SITE_URL: "https://sitebehavior.org"

jobs:
  app:
    name: Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit
        run: npm audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Cloudflare Worker typecheck
        run: npm run cf:typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: GitHub Pages static export
        run: npm run build:pages

      - name: Static export smoke test
        run: npm run test:smoke:static

  smoke:
    name: Chromium Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm run start -- --port 3100 > /tmp/site-behavior-lab.log 2>&1 &
          echo $! > /tmp/site-behavior-lab.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/site-behavior-lab.log
          exit 1

      - name: Smoke test
        run: BASE_URL=http://127.0.0.1:3100 npm run test:smoke

  docker:
    name: Docker Runtime and Public R2 Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the exact deployable image once, preserves the v1/filesystem
      # smoke, then restarts that image against a process-local S3-compatible
      # endpoint with the production public-v2/R2 gates enabled.
      - name: Smoke deployable Docker image
        run: npm run test:smoke:docker
        env:
          DOCKER_SMOKE_PUBLIC_R2: "1"

  promote:
    name: Advance production to the tested SHA
    needs:
      - app
      - docker
      - smoke
    # PR code never receives a write token. Pushes and explicit dispatches must
    # both target this repository's main ref before they can promote.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.SITE_BEHAVIOR_LAB_PROMOTION_PAUSED != '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with promote-production.yml so direct and workflow_run fallbacks
    # cannot race one another.
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - name: Checkout main history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward production to the tested SHA
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin production || echo "No production branch yet; this promotion creates it."

          if ! git cat-file -e "${CANDIDATE}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "::error::Tested SHA ${CANDIDATE} is not reachable from main; refusing to promote rewritten or stale history."
            exit 1
          fi

          if git rev-parse --verify --quiet origin/production >/dev/null; then
            CURRENT="$(git rev-parse origin/production)"
            if [ "$CURRENT" = "$CANDIDATE" ]; then
              echo "production already points at ${CANDIDATE}; nothing to promote."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$CURRENT" "$CANDIDATE"; then
              echo "production (${CURRENT}) is ahead of or divergent from tested SHA ${CANDIDATE}; skipping out-of-order promotion."
              exit 0
            fi
          fi

          git push origin "${CANDIDATE}:refs/heads/production"
          echo "production advanced to ${CANDIDATE}."
