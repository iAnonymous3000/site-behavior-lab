name: Durable Soak Exercises

on:
  workflow_dispatch:
    inputs:
      deployment_commit:
        description: Exact durable-enabled production deployment under soak
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: durable-soak-exercises
  cancel-in-progress: false

jobs:
  exercise:
    name: Exercise durable completion, cancellation, and recovery
    if: >-
      github.repository == 'iAnonymous3000/site-behavior-lab' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-evidence
    timeout-minutes: 30
    steps:
      - name: Require an isolated GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"

      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install the lockfile dependency graph
        run: npm ci --ignore-scripts

      - name: Compile the shared canonical evidence serializer
        run: npm run build:schema

      - name: Capture all non-restart durable soak behaviors
        env:
          EXPECTED_DURABLE_DEPLOYMENT: ${{ inputs.deployment_commit }}
          PRODUCTION_SYNTHETIC_MONITOR_TOKEN: ${{ secrets.PRODUCTION_SYNTHETIC_MONITOR_TOKEN }}
          SCAN_BASE_URL: https://scan.sitebehavior.org
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DURABLE_DEPLOYMENT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_DURABLE_DEPLOYMENT"
          output="$RUNNER_TEMP/durable-soak-exercises"
          test ! -e "$output"
          node scripts/durable-soak-exercise-evidence.mjs \
            --capture \
            --output-dir "$output" \
            --expected-deployment "$EXPECTED_DURABLE_DEPLOYMENT"
          node scripts/durable-soak-exercise-evidence.mjs \
            --verify \
            --directory "$output"

      - name: Preserve canonical durable behavior evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-durable-soak-exercises-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/durable-soak-exercises/exercise-evidence.json
            ${{ runner.temp }}/durable-soak-exercises/post-production-health.json
            ${{ runner.temp }}/durable-soak-exercises/production-health.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
          compression-level: 0
