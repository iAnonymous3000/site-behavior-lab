\* The small world under the plan's axioms: the rows that hold in the two-worker world and can be judged here (F4-READ,
\* and F4-TERM's first half). F4-AGE is not listed, as in two-plan.cfg: Stream is FALSE.
\* Neither exclusion row is listed, here or in any world: from fingerprint-observer@14 the readout excludes no shared
\* worker, so both have nothing to judge (NoWorkerExcluded holds with nothing assumed).
CONSTANTS
  WorkerCount = 1
  CollapseSessions = TRUE
  Stream = FALSE
  StartReleased = FALSE
  Reduced = TRUE
  Assumed = {"A1", "A2", "notA3", "A4", "A5fifo", "A5bound"}
INIT Init
NEXT Next
INVARIANTS
  TypeOK
  ReadHadItsObserver
  HeardLandsInOneTerm
