[package]
name = "sbl-trust-kernel"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.1"
description = "Canonical JSON (canon-v1) for Site Behavior Lab, with a machine-checked encoder"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

# The only dependency. vstd is the Verus standard library: it supplies the
# `verus!` macro that carries the specifications beside the code in
# src/encode.rs and erases them in an ordinary build. The version is exact
# because it is the one the encoder was checked against; pins.json names the
# Verus release that checks it. It brings 14 more crates into Cargo.lock,
# 13 of them macro machinery that runs at build time only.
[dependencies]
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(kani)'] }
