<text class="th" x="168" y="141" text-anchor="middle">Cloudflare Pages</text>
<text class="ts" x="168" y="157" text-anchor="middle">static UI, gallery, reports</text></g>

<g class="c-blue"><rect x="48" y="204" width="240" height="52" rx="8"/>
