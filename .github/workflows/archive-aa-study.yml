name: Archive A/A Repeatability Evidence

on:
  workflow_run:
    workflows:
      - A/A Repeatability Study
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: archive-aa-repeatability-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE: ${{ vars.SITE_BEHAVIOR_LAB_MEASUREMENT_FREEZE || '' }}
  FEATURED_RUNNER_LABEL: ${{ vars.FEATURED_RUNNER_LABEL || '' }}
  SCANNER_EGRESS: ${{ vars.SCANNER_EGRESS || '' }}
  SCANNER_EGRESS_REGION: ${{ vars.SCANNER_EGRESS_REGION || '' }}
  FEATURED_R2_EGRESS_ATTESTED: ${{ vars.FEATURED_R2_EGRESS_ATTESTED || '' }}

jobs:
  attest:
    name: Authenticate and attest the completed study
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      study_id: ${{ steps.context.outputs.study_id }}
      candidate_commit: ${{ steps.context.outputs.candidate_commit }}
      producer_head_commit: ${{ steps.context.outputs.run_head_commit }}
      producer_run_id: ${{ steps.context.outputs.run_id }}
      producer_run_attempt: ${{ steps.context.outputs.run_attempt }}
      producer_artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      producer_artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      attested_artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      attester_commit: ${{ github.sha }}
    steps:
      - name: Checkout the exact protected-main attester
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use the exact Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify pinned Node and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install and build the protected attestation verifier
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Read back the completed run and exact artifact metadata
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}" \
            > "$RUNNER_TEMP/aa-run.json"
          gh api --method GET \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/artifacts" \
            > "$RUNNER_TEMP/aa-artifacts.json"
          node <<'NODE'
          const fs = require("node:fs");
          const response = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/aa-artifacts.json`, "utf8"));
          const suffix = `-${process.env.PRODUCER_RUN_ID}-${process.env.PRODUCER_RUN_ATTEMPT}`;
          const matches = (response.artifacts ?? []).filter(
            (artifact) =>
              artifact?.expired === false &&
              typeof artifact?.name === "string" &&
              /^site-behavior-aa-study-[a-z0-9][a-z0-9._-]{0,99}-[1-9][0-9]*-[1-9][0-9]*$/.test(artifact.name) &&
              artifact.name.endsWith(suffix)
          );
          if (matches.length !== 1) throw new Error("The producer run must expose exactly one governed A/A artifact.");
          if (
            !Number.isSafeInteger(matches[0].id) ||
            matches[0].id <= 0 ||
            !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest ?? "")
          ) {
            throw new Error("The governed A/A artifact id or digest is malformed.");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_id=${matches[0].id}\nartifact_name=${matches[0].name}\nartifact_digest=${matches[0].digest}\n`);
          NODE

      - name: Download the exact completed-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/aa-study
          digest-mismatch: error

      - name: Bind artifact context to the activated freeze
        id: context
        run: >-
          node scripts/aa-study-archive-context.mjs
          --artifact-dir "$RUNNER_TEMP/aa-study"

      - name: Independently authenticate run, artifact, candidate, and evidence
        id: receipt
        run: >-
          node scripts/aa-study-attest.mjs
          --checkout-root "$GITHUB_WORKSPACE"
          --artifact-dir "$RUNNER_TEMP/aa-study"
          --run-metadata "$RUNNER_TEMP/aa-run.json"
          --artifact-metadata "$RUNNER_TEMP/aa-artifacts.json"
          --output "$RUNNER_TEMP/producer-receipt.json"
          --study-id "${{ steps.context.outputs.study_id }}"
          --candidate-commit "${{ steps.context.outputs.candidate_commit }}"
          --run-head-commit "${{ steps.context.outputs.run_head_commit }}"
          --attester-commit "$GITHUB_SHA"
          --run-id "${{ steps.context.outputs.run_id }}"
          --run-attempt "${{ steps.context.outputs.run_attempt }}"
          --artifact-id "${{ steps.artifact.outputs.artifact_id }}"
          --artifact-name "${{ steps.artifact.outputs.artifact_name }}"
          --archive-sha256 "${{ steps.artifact.outputs.artifact_digest }}"
          --runner-label-sha256 "${{ steps.context.outputs.runner_label_sha256 }}"
          --runner-identity-sha256 "${{ steps.context.outputs.runner_identity_sha256 }}"
          --egress-identity "${{ steps.context.outputs.egress_identity }}"
          --egress-region-sha256 "${{ steps.context.outputs.egress_region_sha256 }}"

      - name: Attest the independently validated producer receipt
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/producer-receipt.json

      - name: Build the exact attested handoff
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          test -n "$ATTESTATION_ID"
          test -n "$ATTESTATION_URL"
          install -d -m 700 "$RUNNER_TEMP/aa-attested"
          install -m 600 "$RUNNER_TEMP/producer-receipt.json" \
            "$RUNNER_TEMP/aa-attested/producer-receipt.json"
          install -m 600 "$BUNDLE_PATH" \
            "$RUNNER_TEMP/aa-attested/producer-receipt.sigstore.json"

      - name: Preserve receipt and Sigstore bundle for archive readback
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-aa-attested-${{ steps.context.outputs.study_id }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/aa-attested/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  propose:
    name: Verify readback and propose immutable evidence
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
      attestations: read
    env:
      PROPOSAL_BRANCH: automation/aa-study-${{ needs.attest.outputs.study_id }}-${{ needs.attest.outputs.producer_run_id }}-${{ needs.attest.outputs.producer_run_attempt }}
    steps:
      - name: Checkout the exact attester carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.attest.outputs.attester_commit }}
          fetch-depth: 0

      - name: Use the exact Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify pinned Node and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install and build the archive verifier
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p tsconfig.schema.json
          echo "SITE_BEHAVIOR_LAB_SCHEMA_DIST_READY=1" >> "$GITHUB_ENV"

      - name: Download exact raw study readback
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.producer_artifact_id }}
          run-id: ${{ needs.attest.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/aa-study
          digest-mismatch: error

      - name: Download exact attested receipt readback
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.attested_artifact_id }}
          path: ${{ runner.temp }}/aa-attested
          digest-mismatch: error

      - name: Verify the Sigstore bundle and archive exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/aa-study-archive.mjs
          --artifact-dir "$RUNNER_TEMP/aa-study"
          --attested-dir "$RUNNER_TEMP/aa-attested"
          --study-id "${{ needs.attest.outputs.study_id }}"
          --candidate-commit "${{ needs.attest.outputs.candidate_commit }}"
          --carrier-commit "${{ needs.attest.outputs.attester_commit }}"

      - name: Commit and reverify the evidence carrier
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_ID: ${{ needs.attest.outputs.study_id }}
        run: |
          set -euo pipefail
          study_root="research/aa-studies/$STUDY_ID"
          unexpected="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}' | grep -v -E "^(${study_root}/(attempt-ledger|evaluation|producer-receipt|producer-receipt\\.sigstore)\\.json|research/measurement-candidate-binding\\.json)$" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::A/A archive changed paths outside its governed evidence set."
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git config user.name "iAnonymous3000"
          git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
          git add -- "$study_root" research/measurement-candidate-binding.json
          git diff --cached --check
          git commit -m "Add governed A/A study $STUDY_ID"
          node -e '
            const binding = require("./dist/schema/lib/measurement-candidate-binding.js");
            const verified = binding.verifiedMeasurementCandidateAcquisitionContext(process.cwd(), { requireCleanWorktree: true });
            if (!verified) throw new Error("A/A evidence carrier did not pass the canonical measurement binding");
          '

      - name: Push the reviewed A/A proposal
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_ID: ${{ needs.attest.outputs.study_id }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$PROPOSAL_BRANCH"
          body="$RUNNER_TEMP/aa-study-pr.md"
          printf '%s\n' \
            '<!-- site-behavior-lab:aa-study-pr -->' \
            "# Add governed A/A study \`$STUDY_ID\`" \
            '' \
            'This proposal contains the exact unsharded attempt ledger and evaluation produced by the controlled runner, plus an isolated hosted-runner receipt and Sigstore bundle.' \
            '' \
            "- Candidate: \`${{ needs.attest.outputs.candidate_commit }}\`" \
            "- Producer: run \`${{ needs.attest.outputs.producer_run_id }}\`, attempt \`${{ needs.attest.outputs.producer_run_attempt }}\`, artifact \`${{ needs.attest.outputs.producer_artifact_id }}\`" \
            '- The archive job required a successful governed producer run, exact candidate/frame bytes, deterministic AB/BA order, complete attempt-set equality, artifact digest readback, protected workflow identity, hosted attestation, and local bundle verification.' \
            "- Before merge, manually approve this automation proposal's parked push-event CI run; the pull request's required checks remain expected until that run executes." \
            "- The separate non-promoting \`workflow_dispatch\` CI run validates this proposal branch but does not satisfy the pull request's required checks; trusted \`main\` CI runs only after merge." \
            '- If another evidence carrier merges first and this proposal conflicts in the measurement binding, close it and rerun; never transplant generated evidence.' \
            > "$body"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PROPOSAL_BRANCH" \
            --title "Add governed A/A study $STUDY_ID" \
            --body-file "$body"

      - name: Trigger CI on the proposal branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$PROPOSAL_BRANCH"
