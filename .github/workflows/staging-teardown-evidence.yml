name: Staging Teardown Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-teardown-evidence
  cancel-in-progress: false

jobs:
  capture:
    name: Capture sanitized staging teardown evidence
    if: >-
      github.repository == 'iAnonymous3000/site-behavior-lab' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-evidence
    # The adapter exports and tests its conservative request-count and
    # worst-case duration proof. This six-hour envelope must cover that checked
    # provider bound plus the exported 30-minute checkout, install, compile,
    # verification, and upload reserve; copied request totals here are not a
    # second source of truth.
    timeout-minutes: 360
    steps:
      - name: Require an isolated GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"

      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the exact Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify the exact runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install the lockfile dependency graph
        run: npm ci --ignore-scripts

      - name: Compile the shared canonical evidence serializer
        run: node node_modules/typescript/bin/tsc -p tsconfig.schema.json

      - name: Capture, sanitize, and destroy private provider responses
        env:
          STAGING_TEARDOWN_PROVIDER_KIND: ${{ vars.STAGING_TEARDOWN_PROVIDER_KIND }}
          STAGING_TEARDOWN_TARGETS_JSON: ${{ secrets.STAGING_TEARDOWN_TARGETS_JSON }}
          STAGING_TEARDOWN_TARGETS_SHA256: ${{ vars.STAGING_TEARDOWN_TARGETS_SHA256 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_TEARDOWN_CF_ZONE_ID: ${{ vars.STAGING_TEARDOWN_CF_ZONE_ID }}
          STAGING_TEARDOWN_CF_COMPUTE_TOKEN: ${{ secrets.STAGING_TEARDOWN_CF_COMPUTE_TOKEN }}
          STAGING_TEARDOWN_CF_DNS_TOKEN: ${{ secrets.STAGING_TEARDOWN_CF_DNS_TOKEN }}
          STAGING_TEARDOWN_CF_R2_TOKEN: ${{ secrets.STAGING_TEARDOWN_CF_R2_TOKEN }}
          STAGING_TEARDOWN_CF_TOKEN_ADMIN_TOKEN: ${{ secrets.STAGING_TEARDOWN_CF_TOKEN_ADMIN_TOKEN }}
          STAGING_TEARDOWN_CF_OBSERVATION_TOKEN: ${{ secrets.STAGING_TEARDOWN_CF_OBSERVATION_TOKEN }}
          # The capture code signs a bounded App JWT and refreshes the exact
          # repository-only Administration-write installation token before
          # expiry, so this long-running ceremony never relies on one 1h token.
          STAGING_TEARDOWN_RUNNER_APP_CLIENT_ID: ${{ vars.STAGING_TEARDOWN_RUNNER_APP_CLIENT_ID }}
          STAGING_TEARDOWN_RUNNER_APP_PRIVATE_KEY: ${{ secrets.STAGING_TEARDOWN_RUNNER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/staging-teardown-hosted-capture.mjs \
            --capture \
            --candidate-commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/staging-teardown-safe" \
            --private-dir "$RUNNER_TEMP/staging-teardown-private"
          node scripts/staging-teardown-hosted-capture.mjs \
            --verify \
            --directory "$RUNNER_TEMP/staging-teardown-safe"

      - name: Upload only the privacy-safe receipt and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-behavior-staging-teardown-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-teardown-safe/receipt.json
            ${{ runner.temp }}/staging-teardown-safe/sanitized-provider-manifest.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
          compression-level: 0
