          }
          const receipt = read("receipt.json");
          if (`${canonicalJson(receipt)}\n` !== receiptBytes.toString("utf8")) {
            fail("The release governance receipt is not canonical JSON.");
          }
          const readiness = read("readiness.json");
          const governanceGate =
            readiness?.gates?.["release-tag-governance"];
          const governancePath =
            `research/ops-receipts/release-tag-governance/${receiptDigest}.json`;
          if (
            governanceGate?.kind !== "release-tag-governance" ||
            governanceGate?.artifactDirectory !==
              "research/ops-receipts/release-tag-governance" ||
            !exactKeys(governanceGate?.digestBinding, ["kind", "name"]) ||
            governanceGate.digestBinding.kind !==
              "github-actions-prepare-snapshot" ||
            governanceGate.digestBinding.name !==
              "RELEASE_TAG_GOVERNANCE_RECEIPT_SHA256" ||
            governanceGate?.maxAgeDays !== 1 ||
            receiptDigest !==
              process.env.RELEASE_TAG_GOVERNANCE_RECEIPT_SHA256
          ) {
            fail(
              "RELEASE_READINESS.json must declare the static add-only receipt directory and prepare-snapshotted GitHub Actions selector."
            );
          }
          const bindingRequired =
            process.env.RELEASE_MEASUREMENT_BINDING_REQUIRED === "true"
              ? true
              : process.env.RELEASE_MEASUREMENT_BINDING_REQUIRED === "false"
                ? false
                : null;
          if (bindingRequired === null) {
            fail("The prepare-snapshotted measurement binding policy is malformed.");
          }
          if (bindingRequired) {
            const bindingBytes = fs.readFileSync(
              path.join(
                process.env.RUNNER_TEMP,
                "release-measurement-binding",
                "measurement-candidate-binding.json"
              )
            );
            const bindingDigest = crypto
              .createHash("sha256")
              .update(bindingBytes)
              .digest("hex");
            if (
              !/^[0-9a-f]{64}$/.test(
                process.env.RELEASE_MEASUREMENT_BINDING_SHA256 ?? ""
              ) ||
              bindingDigest !==
                process.env.RELEASE_MEASUREMENT_BINDING_SHA256
            ) {
              fail(
                "The pre-authority measurement-binding bytes no longer match the immutable maintainer pin."
              );
            }
            const binding = JSON.parse(bindingBytes.toString("utf8"));
            const selectedBindingEntries = Array.isArray(binding?.evidence)
              ? binding.evidence.filter(
                  (entry) =>
                    entry?.category === "release-tag-governance-receipt" &&
                    entry?.path === governancePath
                )
              : [];
            if (
              selectedBindingEntries.length !== 1 ||
              selectedBindingEntries[0]?.change !== "added" ||
              selectedBindingEntries[0]?.sha256 !== receiptDigest
            ) {
              fail(
                "The prepare-snapshotted governance receipt must be add-only digest-enumerated evidence in the authenticated whole measurement-candidate binding."
              );
            }
          } else if (
            process.env.RELEASE_MEASUREMENT_BINDING_SHA256 !== "not-required"
          ) {
            fail(
              "A non-binding release must carry the immutable not-required sentinel."
            );
          }
          const app = read("release-app.json");
          if (
            !Number.isSafeInteger(releaseAppId) ||
            releaseAppId < 1 ||
            app?.id !== releaseAppId ||
            app?.client_id !== process.env.RELEASE_APP_CLIENT_ID ||
            app?.slug !== process.env.RELEASE_APP_SLUG ||
            !exactKeys(app?.permissions, ["contents", "metadata"]) ||
            app.permissions.contents !== "write" ||
            app.permissions.metadata !== "read" ||
            !Array.isArray(app?.events) ||
            app.events.length !== 0
          ) {
            fail(
              "The minted release token's App identity, exact contents-write/metadata-read permissions, or empty event subscription differs."
            );
          }
          const promotionApp = read("promotion-app.json");
          if (
            !Number.isSafeInteger(promotionAppId) ||
            promotionAppId < 1 ||
            promotionApp?.id !== promotionAppId ||
            promotionApp?.client_id !== process.env.PROMOTION_APP_CLIENT_ID ||
            promotionApp?.slug !== process.env.PROMOTION_APP_SLUG ||
            promotionAppId === releaseAppId ||
            promotionApp?.client_id === process.env.RELEASE_APP_CLIENT_ID ||
            promotionApp?.slug === process.env.RELEASE_APP_SLUG ||
            !exactKeys(promotionApp?.permissions, [
              "contents",
              "metadata"
            ]) ||
            promotionApp.permissions.contents !== "write" ||
            promotionApp.permissions.metadata !== "read" ||
            !Array.isArray(promotionApp?.events) ||
            promotionApp.events.length !== 0
          ) {
            fail(
              "The configured promotion App identity, exact contents-write/metadata-read permissions, or empty event subscription differs or overlaps the release App."
            );
          }
          if (
            !exactKeys(receipt, [
              "schemaVersion",
              "artifactKind",
              "repository",
              "capturedAt",
              "releaseApp",
              "promotionApp",
              "secretScope",
              "rulesets"
            ]) ||
            receipt.schemaVersion !== 1 ||
            receipt.artifactKind !==
              "site-behavior-release-tag-governance-setup" ||
            receipt.repository !== process.env.GITHUB_REPOSITORY ||
            !Number.isFinite(Date.parse(receipt.capturedAt)) ||
            new Date(receipt.capturedAt).toISOString() !== receipt.capturedAt ||
            !exactKeys(receipt.releaseApp, [
              "clientId",
              "integrationId",
              "slug",
              "permissions",
              "events",
              "installation"
            ]) ||
            receipt.releaseApp.clientId !==
              process.env.RELEASE_APP_CLIENT_ID ||
            receipt.releaseApp.integrationId !== releaseAppId ||
            receipt.releaseApp.slug !== process.env.RELEASE_APP_SLUG ||
            canonicalJson(receipt.releaseApp.permissions) !==
              canonicalJson(app.permissions) ||
            canonicalJson(receipt.releaseApp.events) !==
              canonicalJson(app.events) ||
            !exactKeys(receipt.promotionApp, [
              "clientId",
              "integrationId",
              "slug",
              "permissions",
              "events",
              "installation"
            ]) ||
            receipt.promotionApp.clientId !==
              process.env.PROMOTION_APP_CLIENT_ID ||
            receipt.promotionApp.integrationId !== promotionAppId ||
            receipt.promotionApp.slug !== process.env.PROMOTION_APP_SLUG ||
            canonicalJson(receipt.promotionApp.permissions) !==
              canonicalJson(promotionApp.permissions) ||
            canonicalJson(receipt.promotionApp.events) !==
              canonicalJson(promotionApp.events) ||
            !exactKeys(receipt.rulesets, [
              "immutableTags",
              "tagCreation",
              "productionEvidence",
              "productionUpdater"
            ])
          ) {
            fail(
              "The pinned governance receipt schema, repository, or release App identity is invalid."
            );
          }
          const ownerLogin = process.env.GITHUB_REPOSITORY.split("/")[0];
          const exactInstallation = (installation) =>
            exactKeys(installation, [
              "id",
              "accountLogin",
              "accountType",
              "repositorySelection",
              "proofKind",
              "repositories"
            ]) &&
            Number.isSafeInteger(installation.id) &&
            installation.id > 0 &&
            installation.accountLogin === ownerLogin &&
            ["User", "Organization"].includes(installation.accountType) &&
            installation.repositorySelection === "selected" &&
            installation.proofKind ===
              "app-jwt-full-installation-repository-enumeration" &&
            Array.isArray(installation.repositories) &&
            installation.repositories.length === 1 &&
            installation.repositories[0] === process.env.GITHUB_REPOSITORY;
          if (
            !exactInstallation(receipt.releaseApp.installation) ||
            !exactInstallation(receipt.promotionApp.installation) ||
            receipt.releaseApp.installation.id ===
              receipt.promotionApp.installation.id
          ) {
            fail(
              "The maintainer capture does not bind two distinct selected-repository App installations whose full App-JWT enumerations contain only this repository."
            );
          }
          const secretScope = receipt.secretScope;
          if (
            !exactKeys(secretScope, [
              "name",
              "observedAt",
              "scopeKind",
              "environment",
              "environmentPresent",
              "repositoryPresent",
              "ownerLogin",
              "ownerType",
              "organizationPresent"
            ]) ||
            secretScope.name !== "RELEASE_APP_PRIVATE_KEY" ||
            secretScope.scopeKind !== "point-in-time-name-inventory" ||
            secretScope.environment !== "release-tag" ||
            secretScope.environmentPresent !== true ||
            secretScope.repositoryPresent !== false ||
            secretScope.ownerLogin !== ownerLogin ||
            !["User", "Organization"].includes(secretScope.ownerType) ||
            !Number.isFinite(Date.parse(secretScope.observedAt)) ||
            new Date(secretScope.observedAt).toISOString() !==
              secretScope.observedAt ||
            secretScope.observedAt !== receipt.capturedAt ||
            (secretScope.ownerType === "Organization"
              ? secretScope.organizationPresent !== false
              : secretScope.organizationPresent !== null)
          ) {
            fail(
              "The maintainer capture does not carry a valid point-in-time name inventory proving RELEASE_APP_PRIVATE_KEY existed only on release-tag and not at repository or applicable organization scope."
            );
          }
          const governanceCapturedAt = Date.parse(receipt.capturedAt);
          const ceremonyNow = Date.now();
          if (
            governanceCapturedAt > ceremonyNow + 10 * 60 * 1000 ||
            ceremonyNow - governanceCapturedAt > 24 * 60 * 60 * 1000
          ) {
            fail(
              "The release governance receipt is outside its fixed 24-hour ceremony window; recapture App installation and secret-scope evidence immediately before a fresh dispatch."
            );
          }
          const receiptRulesetKeys = [
            "id",
            "name",
            "target",
            "sourceType",
            "source",
            "enforcement",
            "conditions",
            "rules",
            "createdAt",
            "updatedAt",
            "bypassActors"
          ];
          const receiptBypassKeys = [
            "actorId",
            "actorType",
            "bypassMode"
          ];
          const roles = [
            ["immutableTags", "immutable-tags.json"],
            ["tagCreation", "tag-creation.json"],
            ["productionEvidence", "production-evidence.json"],
            ["productionUpdater", "production-updater.json"]
          ];
          const publicProjection = (ruleset) => ({
            id: ruleset?.id,
            name: ruleset?.name,
            target: ruleset?.target,
            sourceType: ruleset?.source_type,
            source: ruleset?.source,
            enforcement: ruleset?.enforcement,
            conditions: ruleset?.conditions,
            rules: ruleset?.rules,
            createdAt: ruleset?.created_at,
            updatedAt: ruleset?.updated_at
          });
          const receiptPublicProjection = (ruleset) => ({
            id: ruleset.id,
            name: ruleset.name,
            target: ruleset.target,
            sourceType: ruleset.sourceType,
            source: ruleset.source,
            enforcement: ruleset.enforcement,
            conditions: ruleset.conditions,
            rules: ruleset.rules,
            createdAt: ruleset.createdAt,
            updatedAt: ruleset.updatedAt
          });
          for (const [role, filename] of roles) {
            const pinned = receipt.rulesets[role];
            if (
              !exactKeys(pinned, receiptRulesetKeys) ||
              !Number.isSafeInteger(pinned.id) ||
              pinned.id < 1 ||
              pinned.sourceType !== "Repository" ||
              pinned.source !== process.env.GITHUB_REPOSITORY ||
              !Array.isArray(pinned.bypassActors) ||
              pinned.bypassActors.some(
                (actor) =>
                  !exactKeys(actor, receiptBypassKeys) ||
                  !Number.isSafeInteger(actor.actorId) ||
                  actor.actorId < 1 ||
                  typeof actor.actorType !== "string" ||
                  typeof actor.bypassMode !== "string"
              ) ||
              !Array.isArray(pinned.rules) ||
              !isRecord(pinned.conditions) ||
              !Number.isFinite(Date.parse(pinned.createdAt)) ||
              !Number.isFinite(Date.parse(pinned.updatedAt))
            ) {
              fail(`The pinned ${role} ruleset record is malformed.`);
            }
            const live = publicProjection(read(filename));
            if (
              canonicalJson(live) !==
              canonicalJson(receiptPublicProjection(pinned))
            ) {
              fail(
                `Live ${role} public shape or GitHub updated_at differs from the maintainer-captured receipt.`
              );
            }
          }
          const immutable = receipt.rulesets.immutableTags;
          const creation = receipt.rulesets.tagCreation;
          const productionEvidence = receipt.rulesets.productionEvidence;
          const productionUpdater = receipt.rulesets.productionUpdater;
          const exactTagCondition = (ruleset) =>
            ruleset?.target === "tag" &&
            ruleset?.enforcement === "active" &&
            exactKeys(ruleset?.conditions, ["ref_name"]) &&
            exactKeys(ruleset?.conditions?.ref_name, ["include", "exclude"]) &&
            Array.isArray(ruleset?.conditions?.ref_name?.include) &&
            ruleset.conditions.ref_name.include.length === 1 &&
            ruleset.conditions.ref_name.include[0] === "refs/tags/v*" &&
            Array.isArray(ruleset?.conditions?.ref_name?.exclude) &&
            ruleset.conditions.ref_name.exclude.length === 0;
          const exactProductionCondition = (ruleset) =>
            ruleset?.target === "branch" &&
            ruleset?.enforcement === "active" &&
            exactKeys(ruleset?.conditions, ["ref_name"]) &&
            exactKeys(ruleset?.conditions?.ref_name, [
              "include",
              "exclude"
            ]) &&
            Array.isArray(ruleset?.conditions?.ref_name?.include) &&
            ruleset.conditions.ref_name.include.length === 1 &&
            ruleset.conditions.ref_name.include[0] ===
              "refs/heads/production" &&
            Array.isArray(ruleset?.conditions?.ref_name?.exclude) &&
            ruleset.conditions.ref_name.exclude.length === 0;
          if (
            immutable?.id !== 20050122 ||
            !exactTagCondition(immutable) ||
            immutable.bypassActors.length !== 0 ||
            !Array.isArray(immutable.rules) ||
            immutable.rules.length !== 2
          ) {
            fail(
              "Immutable tag ruleset 20050122 must be active on only refs/tags/v* with zero bypass and exactly update plus deletion."
            );
          }
          const immutableTypes = immutable.rules.map((rule) => rule?.type).sort();
          if (
            JSON.stringify(immutableTypes) !==
              JSON.stringify(["deletion", "update"]) ||
            immutable.rules.some(
              (rule) => !exactKeys(rule, ["type"])
            )
          ) {
            fail(
              "Immutable tag ruleset must contain only GitHub's canonical bare deletion and update rules."
            );
          }
          if (
            creation?.id !== creationRulesetId ||
            creationRulesetId === 20050122 ||
            !exactTagCondition(creation) ||
            creation.bypassActors.length !== 1 ||
            creation.bypassActors[0]?.actorId !== releaseAppId ||
            creation.bypassActors[0]?.actorType !== "Integration" ||
            creation.bypassActors[0]?.bypassMode !== "always" ||
            !Array.isArray(creation.rules) ||
            creation.rules.length !== 1 ||
            creation.rules[0]?.type !== "creation" ||
            Object.keys(creation.rules[0] ?? {}).sort().join(",") !== "type"
          ) {
            fail(
              "The separate active tag-creation ruleset must contain only creation and the release App as its sole always bypass."
            );
          }
          for (const [name, ruleset] of [
            ["production evidence", productionEvidence],
            ["production updater", productionUpdater]
          ]) {
            if (!exactProductionCondition(ruleset)) {
              fail(
                `${name} ruleset is not active on exactly refs/heads/production.`
              );
            }
            if (
              ruleset.bypassActors.some(
                (actor) =>
                  actor?.actorType === "Integration" &&
                  actor?.actorId === releaseAppId
              )
            ) {
              fail(`The release App must not bypass the ${name} ruleset.`);
            }
          }
          if (
            productionEvidence.id !== 20050303 ||
            productionEvidence.bypassActors.length !== 0 ||
            !Array.isArray(productionEvidence.rules) ||
            productionEvidence.rules.length !== 4
          ) {
            fail(
              "The production evidence ruleset must retain zero bypass actors and exactly four rules."
            );
          }
          const requiredCiJobs = read("required-ci-jobs.json");
          if (
            requiredCiJobs?.schemaVersion !== 1 ||
            !Array.isArray(requiredCiJobs.jobs) ||
            requiredCiJobs.jobs.length === 0 ||
            requiredCiJobs.jobs.some(
              (job) => typeof job !== "string" || job.trim() === ""
            ) ||
            new Set(requiredCiJobs.jobs).size !== requiredCiJobs.jobs.length
          ) {
            fail(
              "required-ci-jobs.json at the release SHA must list unique required job names under schemaVersion 1."
            );
          }
          const expectedChecks = requiredCiJobs.jobs;
          const [
            deletion,
            nonFastForward,
            linearHistory,
            requiredStatusChecks
          ] = productionEvidence.rules;
          if (
            !exactKeys(deletion, ["type"]) ||
            deletion.type !== "deletion" ||
            !exactKeys(nonFastForward, ["type"]) ||
            nonFastForward.type !== "non_fast_forward" ||
            !exactKeys(linearHistory, ["type"]) ||
            linearHistory.type !== "required_linear_history" ||
            !exactKeys(requiredStatusChecks, ["type", "parameters"]) ||
            requiredStatusChecks.type !== "required_status_checks" ||
            !exactKeys(requiredStatusChecks.parameters, [
              "do_not_enforce_on_create",
              "required_status_checks",
              "strict_required_status_checks_policy"
            ]) ||
            requiredStatusChecks.parameters.do_not_enforce_on_create !==
              false ||
            requiredStatusChecks.parameters
              .strict_required_status_checks_policy !== false ||
            !Array.isArray(
              requiredStatusChecks.parameters.required_status_checks
            ) ||
            requiredStatusChecks.parameters.required_status_checks.length !==
              expectedChecks.length ||
            requiredStatusChecks.parameters.required_status_checks.some(
              (check, index) =>
                !exactKeys(check, ["context", "integration_id"]) ||
                check.context !== expectedChecks[index] ||
                check.integration_id !== 15368
            )
          ) {
            fail(
              `The production evidence ruleset must contain canonical deletion, non-fast-forward, linear-history, and the exact ${expectedChecks.length} GitHub Actions checks with Integration id 15368 and fixed false parameters.`
            );
          }
          if (
            productionUpdater.id !== 20050309 ||
            !Array.isArray(productionUpdater.rules) ||
            productionUpdater.rules.length !== 1 ||
            !exactKeys(productionUpdater.rules[0], ["type"]) ||
            productionUpdater.rules[0].type !== "update" ||
            productionUpdater.bypassActors.length !== 1 ||
            productionUpdater.bypassActors[0]?.actorType !== "Integration" ||
            productionUpdater.bypassActors[0]?.bypassMode !== "always" ||
            productionUpdater.bypassActors[0]?.actorId !== promotionAppId
          ) {
            fail(
              "The production updater ruleset must retain the distinct promotion App as its sole always bypass."
            );
          }
          console.log(
            `Verified maintainer-pinned full bypass lists plus unchanged live public ruleset shapes for release App ${releaseAppId}.`
          );
          NODE

      - name: Create the annotated release tag atomically through the Git database API
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ATTESTATION_URL: ${{ needs.attest.outputs.attestation_url }}
          RECEIPT_SHA256: ${{ needs.attest.outputs.receipt_sha256 }}
          RELEASE_TAG_GOVERNANCE_RECEIPT_SHA256: ${{ needs.prepare.outputs.governance_receipt_sha256 }}
          RELEASE_MEASUREMENT_BINDING_REQUIRED: ${{ needs.prepare.outputs.measurement_binding_required }}
          RELEASE_MEASUREMENT_BINDING_SHA256: ${{ needs.prepare.outputs.measurement_binding_sha256 }}
        run: |
          set -euo pipefail
          set +e
          preflight_status="$(
            curl \
              --silent \
              --show-error \
              --request GET \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --output "$RUNNER_TEMP/preflight-tag-ref.json" \
              --write-out "%{http_code}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          preflight_exit="$?"
          set -e
          if [[ "$preflight_exit" -ne 0 ||
                ( "$preflight_status" != "200" && "$preflight_status" != "404" ) ]]; then
            echo "::error title=Release refused::Tag-ref preflight failed with transport exit ${preflight_exit} and HTTP ${preflight_status}."
            exit 1
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" == "1" && "$preflight_status" != "404" ]]; then
            echo "::error title=Release refused::A first-attempt release may proceed only when the exact tag ref returns HTTP 404."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const fail = (message) => {
            console.error(`::error title=Release refused::${message}`);
            process.exit(1);
          };
          if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_SHA)) fail("Release SHA is malformed.");
          if (!/^v(?:0\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?|1\.0\.0(?:-rc\.[1-9]\d*)?)$/.test(process.env.RELEASE_TAG)) {
            fail("Release tag is malformed.");
          }
          if (!/^[0-9a-f]{64}$/.test(process.env.RECEIPT_SHA256)) fail("Receipt digest is malformed.");
          if (!/^[0-9a-f]{64}$/.test(process.env.RELEASE_TAG_GOVERNANCE_RECEIPT_SHA256)) {
            fail("Release governance receipt digest is malformed.");
          }
          const exactOneBindingRequired =
            /^v1\.0\.0(?:-rc\.[1-9]\d*)?$/.test(process.env.RELEASE_TAG);
          const snapshottedBindingRequired =
            process.env.RELEASE_MEASUREMENT_BINDING_REQUIRED === "true"
              ? true
              : process.env.RELEASE_MEASUREMENT_BINDING_REQUIRED === "false"
                ? false
                : null;
          if (
            snapshottedBindingRequired !== exactOneBindingRequired ||
            (exactOneBindingRequired
              ? !/^[0-9a-f]{64}$/.test(
                  process.env.RELEASE_MEASUREMENT_BINDING_SHA256 ?? ""
                )
              : process.env.RELEASE_MEASUREMENT_BINDING_SHA256 !==
                "not-required")
          ) {
            fail("Release measurement-binding trust-root output is malformed.");
          }
          if (!/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ID ?? "")) {
            fail("Workflow run id is malformed.");
          }
          const expectedPrefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/attestations/`;
          if (
            !process.env.ATTESTATION_URL.startsWith(expectedPrefix) ||
            !/^\d+$/.test(process.env.ATTESTATION_URL.slice(expectedPrefix.length))
          ) {
            fail("Attestation URL is not repository-bound.");
          }
          const message = [
            `Site Behavior Lab ${process.env.RELEASE_TAG}`,
            "",
            "Curated release. No blanket stable public API and no npm publication.",
            `Attested exact-source release receipt: ${process.env.ATTESTATION_URL}`,
            `Release receipt sha256: ${process.env.RECEIPT_SHA256}`,
            `Release governance receipt sha256: ${process.env.RELEASE_TAG_GOVERNANCE_RECEIPT_SHA256}`,
            `Release measurement binding required: ${process.env.RELEASE_MEASUREMENT_BINDING_REQUIRED}`,
            `Release measurement binding sha256: ${process.env.RELEASE_MEASUREMENT_BINDING_SHA256}`,
            `Release workflow run: https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          ].join("\n");
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, "tag-object.json"),
            JSON.stringify({
              tag: process.env.RELEASE_TAG,
              message,
              object: process.env.RELEASE_SHA,
              type: "commit"
            })
          );
          NODE
          tag_object_sha="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/tags" \
              --input "$RUNNER_TEMP/tag-object.json" \
              --jq '.sha'
          )"
          TAG_OBJECT_SHA="$tag_object_sha" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          if (!/^[0-9a-f]{40}$/.test(process.env.TAG_OBJECT_SHA)) {
            throw new Error("GitHub did not return an annotated tag-object SHA.");
          }
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, "tag-ref.json"),
            JSON.stringify({
              ref: `refs/tags/${process.env.RELEASE_TAG}`,
              sha: process.env.TAG_OBJECT_SHA
            })
          );
          NODE
          # POST is atomic and fails if the ref already exists. Never PATCH,
          # force-update, delete, or move a release tag. A lost response or a
          # later step failure can leave the exact intended ref behind while
          # the run is marked failed, so a failed-job rerun may reconcile that
          # immutable ref. It accepts only the exact annotated object this run
          # intended; every mismatch remains a hard refusal.
          set +e
          create_status="$(
            curl \
              --silent \
              --show-error \
              --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@$RUNNER_TEMP/tag-ref.json" \
              --output "$RUNNER_TEMP/created-tag-ref.json" \
              --write-out "%{http_code}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs"
          )"
          create_exit="$?"
          set -e
          if [[ "$create_exit" -ne 0 ]]; then
            echo "::error title=Release refused::Tag creation failed at the transport layer; reconciliation is forbidden."
            exit 1
          fi
          if [[ "$create_status" == "201" ]]; then
            echo "Tagged ${RELEASE_TAG} at ${RELEASE_SHA}."
          elif [[ "$create_status" == "422" ]] &&
            CREATE_RESPONSE="$RUNNER_TEMP/created-tag-ref.json" node <<'NODE'
          const fs = require("node:fs");
          let response;
          try {
            response = JSON.parse(
              fs.readFileSync(process.env.CREATE_RESPONSE, "utf8")
            );
          } catch {
            process.exit(1);
          }
          process.exit(
            response &&
              !Array.isArray(response) &&
              response.message === "Reference already exists"
              ? 0
              : 1
          );
          NODE
          then
            echo "::warning title=Exact tag already exists::HTTP 422 Reference already exists; checking this run's immutable intent."
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              > "$RUNNER_TEMP/existing-tag-ref.json"
            existing_tag_object_sha="$(
              node -e '
                const fs = require("node:fs");
                const ref = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (!/^[0-9a-f]{40}$/.test(ref?.object?.sha ?? "")) {
                  throw new Error("The existing tag ref does not name a Git tag object.");
                }
                process.stdout.write(ref.object.sha);
              ' "$RUNNER_TEMP/existing-tag-ref.json"
            )"
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${existing_tag_object_sha}" \
              > "$RUNNER_TEMP/existing-tag-object.json"
            node <<'NODE'
            const fs = require("node:fs");
            const path = require("node:path");
            const fail = (message) => {
              console.error(`::error title=Release refused::${message}`);
              process.exit(1);
            };
            const read = (name) =>
              JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, name), "utf8"));
            const expected = read("tag-object.json");
            const ref = read("existing-tag-ref.json");
            const actual = read("existing-tag-object.json");
            if (ref?.ref !== `refs/tags/${expected.tag}`) {
              fail("The existing release ref has the wrong name.");
            }
            if (ref?.object?.type !== "tag") {
              fail("The existing release ref is not annotated.");
            }
            if (
              !/^[0-9a-f]{40}$/.test(actual?.sha ?? "") ||
              ref.object.sha !== actual.sha
            ) {
              fail("The existing release ref does not identify the fetched tag object.");
            }
            if (actual?.tag !== expected.tag) {
              fail("The existing annotated object has the wrong tag name.");
            }
            if (
              actual?.object?.type !== expected.type ||
              actual?.object?.sha !== expected.object
            ) {
              fail("The existing annotated object names a different release commit or object type.");
            }
            if (actual?.message !== expected.message) {
              fail("The existing annotated object has different attestation or receipt evidence.");
            }
            console.log(
              `Reconciled exact existing annotated tag ${expected.tag} at ${expected.object}.`
            );
          NODE
          else
            echo "::error title=Release refused::Tag creation returned HTTP ${create_status}; only exact HTTP 422 Reference already exists may enter reconciliation."
            exit 1
          fi

      - name: Record the release in the run summary
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_DECLARING_SHA: ${{ needs.prepare.outputs.release_declaring_sha }}
          RELEASE_COMMITS_AFTER_DECLARATION: ${{ needs.prepare.outputs.release_commits_after_declaration }}
          ATTESTATION_URL: ${{ needs.attest.outputs.attestation_url }}
          RECEIPT_SHA256: ${{ needs.attest.outputs.receipt_sha256 }}
          RELEASE_TAG_GOVERNANCE_RECEIPT_SHA256: ${{ needs.prepare.outputs.governance_receipt_sha256 }}
          RELEASE_MEASUREMENT_BINDING_REQUIRED: ${{ needs.prepare.outputs.measurement_binding_required }}
          RELEASE_MEASUREMENT_BINDING_SHA256: ${{ needs.prepare.outputs.measurement_binding_sha256 }}
        run: |
          {
            echo "- Tag: \`${RELEASE_TAG}\` at \`${RELEASE_SHA}\`"
            echo "- Version declared at \`${RELEASE_DECLARING_SHA}\` (${RELEASE_COMMITS_AFTER_DECLARATION} later commit(s) included)"
            echo "- Promoted to production and CI-green before tagging"
            echo "- Attested release receipt: ${ATTESTATION_URL}"
            echo "- Release receipt sha256: \`${RECEIPT_SHA256}\`"
            echo "- Release governance receipt sha256: \`${RELEASE_TAG_GOVERNANCE_RECEIPT_SHA256}\`"
            echo "- Release measurement binding required: \`${RELEASE_MEASUREMENT_BINDING_REQUIRED}\`"
            echo "- Release measurement binding sha256: \`${RELEASE_MEASUREMENT_BINDING_SHA256}\`"
            echo "- Claims: governed compatibility surfaces only; no blanket stable public API, no npm publication"
          } >> "$GITHUB_STEP_SUMMARY"
