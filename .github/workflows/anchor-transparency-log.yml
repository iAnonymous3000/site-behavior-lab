name: Anchor Transparency Log

# Every published report is chained into public/transparency-log.json, but a
# chain proves order, not time. The external time bound comes from anchoring
# the chain HEAD through OpenTimestamps, and an anchor only covers entries
# beneath the head it names. So an anchor taken once and never repeated leaves
# every later publication with no bound at all: at the time this workflow
# landed, 99 of 577 published entries sat above the newest anchored head.
#
# This runs weekly, submits the CURRENT head to the calendars, and proposes the
# updated log through the normal reviewed automation/* pull-request path. It
# never rewrites an existing anchor: the anchor list is append-only, and
# assertTransparencyLogHistory compares committed anchors by whole object, so
# an in-place edit fails CI by design.
#
# The proposal lives on ONE fixed branch that each run extends. A per-run
# branch re-proposed the same head every week while the first proposal sat
# unmerged (PRs #238 and #243 both anchored entry 1026), and only one could
# ever merge. Replacing the branch instead would be lossy: an OpenTimestamps
# proof only bounds a head from above, so the earlier pending proof is the
# tighter bound. Each run therefore carries the open proposal's anchors into
# the candidate, skips calendars that already anchored the current head
# there, and force-pushes only against the exact commit it carried from.
# Deleting the branch is how a reviewer discards a pending proposal.
#
# A run that pushed the branch but never opened its pull request leaves the
# anchors there. The next run carries them and appends nothing, so it opens
# the pull request from the branch as it stands instead of reading the quiet
# working tree as nothing to propose.
#
# It does NOT upgrade a pending calendar promise into a Bitcoin attestation.
# That needs the external opentimestamps client to replay the proof's operation
# tree, which this repository deliberately does not reimplement; run
# `npm run transparency:log:anchor:status` for the exact invocation.

on:
  schedule:
    # Thursdays, deliberately away from the Monday corpus refresh so the two
    # repo-writing runs do not queue behind each other on the shared group.
    - cron: "23 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

# The scan, featured-scan, and brave-list workflows all commit to the same
# tree, and this one writes public/transparency-log.json, which scan.yml and
# scan-featured.yml also write. Join their group or the pushes race.
concurrency:
  group: site-behavior-repo-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  anchor:
    name: Anchor the current chain head
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The proposal's push-event CI run is parked for manual approval; this
      # starts separate non-promoting branch validation.
      actions: write
    env:
      PROPOSAL_BRANCH: automation/transparency-anchor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify pinned Node and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Report the anchor state before submitting
        run: |
          set -euo pipefail
          npm run transparency:log:anchor:status | tee "$RUNNER_TEMP/anchor-before.txt"

      - name: Carry the pending anchor proposal
        id: pending
        run: |
          set -euo pipefail
          # Absent (exit 2) and unreadable (anything else) are different
          # answers: anchoring without knowing what the open proposal holds
          # would submit its head again and then fail to push over it.
          listed=0
          git ls-remote --exit-code --heads origin "refs/heads/${PROPOSAL_BRANCH}" > /dev/null || listed=$?
          if [[ "$listed" -eq 2 ]]; then
            echo "remote_oid=" >> "$GITHUB_OUTPUT"
            echo "carry_log=" >> "$GITHUB_OUTPUT"
            echo "No pending anchor proposal on ${PROPOSAL_BRANCH}; anchoring against main alone."
            exit 0
          fi
          if [[ "$listed" -ne 0 ]]; then
            echo "::error title=Pending anchor proposal unreadable::git ls-remote exited ${listed} for ${PROPOSAL_BRANCH}"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/heads/${PROPOSAL_BRANCH}"
          remote_oid="$(git rev-parse FETCH_HEAD)"
          carry_log="$RUNNER_TEMP/pending-transparency-log.json"
          git show "${remote_oid}:public/transparency-log.json" > "$carry_log"
          echo "remote_oid=${remote_oid}" >> "$GITHUB_OUTPUT"
          echo "carry_log=${carry_log}" >> "$GITHUB_OUTPUT"
          echo "Carrying the pending anchor proposal ${PROPOSAL_BRANCH} at ${remote_oid}."

      - name: Submit the current head to the calendars
        id: anchor
        env:
          CARRY_LOG: ${{ steps.pending.outputs.carry_log }}
        run: |
          set -euo pipefail
          # Anchoring is redundancy across independent calendars: the CLI exits
          # nonzero only when every calendar failed, in which case nothing
          # changed and the run should be visibly red rather than silently
          # proposing an unchanged file. The CLI validates every carried anchor
          # against main's chain before anything is submitted.
          carry_args=()
          if [[ -n "$CARRY_LOG" ]]; then
            carry_args=(--carry-anchors "$CARRY_LOG")
          fi
          npm run transparency:log:anchor -- "${carry_args[@]}" | tee "$RUNNER_TEMP/anchor-submit.txt"
          if git diff --quiet -- public/transparency-log.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "The current head is already anchored on main or in the pending proposal by every calendar; nothing to propose."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-verify the log after anchoring
        if: steps.anchor.outputs.changed == '1'
        run: |
          set -euo pipefail
          # The proposal must satisfy the same checks main enforces: the chain
          # recomputes, the append-only history holds against the committed
          # version, and every committed report is covered.
          #
          # The base is HEAD, explicitly, for two independent reasons. The
          # anchor edit is still UNCOMMITTED here, so the committed state to
          # compare against is HEAD itself; the CLI's HEAD^ default is built
          # for CI, where the change is already a commit, and would compare
          # against the wrong tree. And actions/checkout defaults to depth 1,
          # where HEAD^ does not resolve at all: the CLI would refuse, the job
          # would fail AFTER the calendars had already issued real timestamps,
          # and the anchor would be discarded with the workspace every week.
          npm run transparency:verify-history -- HEAD
          npm run transparency:log:check
          npm run transparency:log:anchor:status | tee "$RUNNER_TEMP/anchor-after.txt"

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Transparency log anchoring"
            echo
            echo '### Before'
            echo '```'
            cat "$RUNNER_TEMP/anchor-before.txt" 2>/dev/null || echo "(not captured)"
            echo '```'
            echo '### After'
            echo '```'
            cat "$RUNNER_TEMP/anchor-after.txt" 2>/dev/null || echo "(unchanged)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A run that pushed the branch and then failed to open its pull request
      # (a transient API error, or the repository refusing Actions-created
      # pull requests) leaves the anchors on the branch. A re-run carries them,
      # appends nothing, and must still open that pull request, so this step
      # also runs when the carried proposal holds anchors main lacks. It then
      # pushes nothing. A pull request closed with its branch left in place is
      # opened again on every run; deleting the branch discards the proposal.
      - name: Publish reviewed anchor proposal
        if: steps.anchor.outputs.changed == '1' || steps.anchor.outputs.carried_pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REMOTE_OID: ${{ steps.pending.outputs.remote_oid }}
          CHANGED: ${{ steps.anchor.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" == "1" ]]; then
            git config user.name "iAnonymous3000"
            git config user.email "32236127+iAnonymous3000@users.noreply.github.com"
            # Only the log. Anything else in the tree at this point is an
            # unrelated change that must not ride an automation proposal.
            git add public/transparency-log.json
            if ! git diff --cached --quiet -- ':!public/transparency-log.json'; then
              echo "::error title=Refused::the anchoring run staged a file other than the transparency log"
              exit 1
            fi
            git checkout -B "$PROPOSAL_BRANCH"
            git commit -m "Anchor the current transparency-log head" \
              -m "Carries the pending proposal's anchors unchanged and appends one anchor per calendar that replied for the head at this run. Existing anchors are untouched; the list is append-only and CI compares committed anchors by whole object."
            # Lease against exactly the commit whose anchors were carried. A
            # branch that moved since then holds proofs this run never saw, and
            # overwriting it would discard them.
            if [[ -n "$REMOTE_OID" ]]; then
              git push \
                --force-with-lease="refs/heads/${PROPOSAL_BRANCH}:${REMOTE_OID}" \
                origin "HEAD:refs/heads/${PROPOSAL_BRANCH}"
            else
              git push origin "HEAD:refs/heads/${PROPOSAL_BRANCH}"
            fi
          else
            # Nothing is pushed on recovery, so the pull request proposes the
            # branch exactly as it stands. Hold it to the rule a fresh proposal
            # meets above: one commit on the base that changes only the log.
            proposal_shape="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${REMOTE_OID}" \
              --jq '"\(.ahead_by) \([.files[].filename] | join(","))"')"
            if [[ "$proposal_shape" != "1 public/transparency-log.json" ]]; then
              echo "::error title=Refused::${PROPOSAL_BRANCH} at ${REMOTE_OID} is not one commit on ${BASE_BRANCH} that changes only the transparency log (${proposal_shape})"
              exit 1
            fi
          fi

          proposal_body="$RUNNER_TEMP/anchor-pr.md"
          printf '%s\n' \
            '<!-- site-behavior-lab:transparency-anchor-pr -->' \
            '# Anchor the current transparency-log head' \
            '' \
            '- Appends a detached OpenTimestamps proof for the head this run observed.' \
            '- Anchors this proposal already held are carried byte for byte. An earlier pending proof is the tighter time bound, so a later run extends this proposal instead of replacing it; delete the branch to discard it.' \
            '- Existing anchors are untouched. An in-place edit would fail `transparency:verify-history`.' \
            '- Fresh anchors carry a calendar promise; the Bitcoin attestation appears after the aggregation window and needs the external `ots upgrade` client.' \
            "- Before merge, manually approve this automation proposal's parked push-event CI run; the pull request's required checks remain expected until that run executes." \
            "- The separate non-promoting \`workflow_dispatch\` CI run validates this proposal branch but does not satisfy the pull request's required checks; trusted \`main\` CI runs only after merge." \
            > "$proposal_body"

          # Only a same-repository pull request is this proposal; a fork can
          # name its branch the same.
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$PROPOSAL_BRANCH" \
            --limit 10 \
            --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)] | if length > 1 then error("multiple open transparency-anchor PRs") elif length == 1 then .[0].number else empty end')
          pr_refused=0
          if [[ -n "$pr_number" ]]; then
            # Nothing new was pushed, so the open pull request already shows
            # this branch; editing it or dispatching CI again changes nothing.
            if [[ "$CHANGED" != "1" ]]; then
              echo "Pull request #${pr_number} already proposes ${PROPOSAL_BRANCH}; nothing new to push."
              exit 0
            fi
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Anchor the current transparency-log head" \
              --body-file "$proposal_body"
          else
            pr_error="$RUNNER_TEMP/anchor-pr-error.txt"
            if ! gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$PROPOSAL_BRANCH" \
              --title "Anchor the current transparency-log head" \
              --body-file "$proposal_body" 2>"$pr_error"; then
              cat "$pr_error" >&2
              if ! grep -q "not permitted to create or approve pull requests" "$pr_error"; then
                exit 1
              fi
              compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${PROPOSAL_BRANCH}?expand=1"
              echo "::error title=Open the proposal manually::Actions may not create PRs in this repository. Open ${compare_url}"
              pr_refused=1
            fi
          fi
          gh workflow run ci.yml --ref "$PROPOSAL_BRANCH" --repo "$GITHUB_REPOSITORY"
          # Validation still starts on the pushed branch, but a proposal no one
          # can see is not published: the run is red until the pull request
          # exists. A refusal leaves the anchors on the branch, and a green run
          # here would read as a published proposal.
          if [[ "$pr_refused" == "1" ]]; then
            exit 1
          fi
