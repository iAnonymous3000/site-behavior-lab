<text class="th" x="544" y="568" text-anchor="middle">PageGraph import</text>
<text class="ts" x="544" y="584" text-anchor="middle">GraphML + meta, request-only r2</text></g>

<line x1="168" y1="88" x2="168" y2="118" stroke="#94a3b8" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="ts" x="176" y="108">loads UI</text>
