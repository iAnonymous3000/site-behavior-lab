name: Trust Kernel

# The Rust trust kernel in tools/trust-kernel: canonical JSON (phase 0 of
# the language plan) and the address classifier. Nothing in the scanner, the
# Worker or the site calls it.
#
# This is a workflow of its own, not a job of CI, on purpose. The release
# workflow, the hosted evidence archive and the durable transition receipt
# read the conclusion of the CI RUN and refuse a failed one, so a job in
# ci.yml that fails for a reason of its own (an unreachable release asset, a
# solver limit) would stop a release of code it does not touch. Nothing reads
# this workflow's conclusion: it is not in .github/required-ci-jobs.json, no
# other workflow is triggered by it, and it promotes and publishes nothing.
# A failure here says something about the kernel only.
#
# The Verus step writes a receipt for the commit it ran at, and on main a
# separate job signs it. The signature shows that this workflow, at this
# commit, wrote the receipt. It does not show that Verus is right, and no
# release gate reads it.

on:
  push:
    branches:
      - main
    paths:
      - "tools/trust-kernel/**"
      - "lib/address-kernel*"
      - "lib/ip-safety.ts"
      - "lib/trust-kernel-wasm/**"
      - "scripts/trust-kernel*"
      - ".github/workflows/trust-kernel.yml"
  pull_request:
    paths:
      - "tools/trust-kernel/**"
      - "lib/address-kernel*"
      - "lib/ip-safety.ts"
      - "lib/trust-kernel-wasm/**"
      - "scripts/trust-kernel*"
      - ".github/workflows/trust-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request revisions need no further feedback.
concurrency:
  group: trust-kernel-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"

jobs:
  trust-kernel:
    name: Trust Kernel Checks
    runs-on: ubuntu-24.04
    # A hosted runner has not run these steps yet. In a linux/amd64
    # container emulated on an arm64 machine the steps after npm ci and the
    # TypeScript compile took about eleven minutes: the two builds under one
    # minute, the comparison with the references seven and a half (the
    # addresses three and a half of that), the Verus step two and a half.
    # A step that hangs must fail this job, not hold the run.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Verify exact Node and npm runtime
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      # rustup, the one in the runner image, installs the compiler named in
      # tools/trust-kernel/pins.json. What ties the result to the pin is
      # checked after the install and again before every build: rustc
      # reports the pinned commit, and rustup's record of the install lists
      # the pinned archive hashes for rustc, cargo and both standard
      # libraries. The step also requires the release's channel manifest to
      # have the pinned sha256 and to list those hashes. rustup itself is
      # not pinned.
      - name: Install the pinned Rust toolchain
        run: node scripts/trust-kernel-build.mjs toolchain

      - name: Rebuild the WebAssembly module twice and compare
        run: >-
          node scripts/trust-kernel-build.mjs verify
          --out "$RUNNER_TEMP/sbl_trust_kernel_wasm.wasm"

      - name: Compile the TypeScript reference
        run: npx tsc -p tsconfig.test.json

      - name: Compare the address kernel with the TypeScript reference
        run: >-
          node scripts/trust-kernel-address-differential.mjs
          --wasm "$RUNNER_TEMP/sbl_trust_kernel_wasm.wasm"
          --report "$RUNNER_TEMP/trust-kernel-differential.json"

      - name: Install the pinned Verus release
        run: node scripts/trust-kernel-verus.mjs install --into "$RUNNER_TEMP/verus"

      - name: Check the address classifier with Verus
        run: >-
          node scripts/trust-kernel-verus.mjs verify --verus "$RUNNER_TEMP/verus/verus-x86-linux"
          --receipt "$RUNNER_TEMP/site-behavior-lab-trust-kernel-verus-receipt.json"

      - name: Hold the Verus receipt to this commit
        run: >-
          node scripts/trust-kernel-verus-receipt.mjs check
          --receipt "$RUNNER_TEMP/site-behavior-lab-trust-kernel-verus-receipt.json" --commit "$GITHUB_SHA"

      - name: Preserve the Verus receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trust-kernel-verus-receipt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/site-behavior-lab-trust-kernel-verus-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve the comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trust-kernel-differential-${{ github.sha }}
          path: ${{ runner.temp }}/trust-kernel-differential.json
          if-no-files-found: warn
          retention-days: 30

  # This job never checks out or executes the commit's code. The signature
  # shows that this workflow, at this commit, produced the receipt. It does
  # not show Verus is right, and no release gate reads it.
  attest:
    name: Attest the Verus receipt
    needs:
      - trust-kernel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the Verus receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trust-kernel-verus-receipt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/trust-kernel-verus-receipt

      - name: Hold the Verus receipt to this commit
        env:
          RECEIPT: ${{ runner.temp }}/trust-kernel-verus-receipt/site-behavior-lab-trust-kernel-verus-receipt.json
        run: |
          set -euo pipefail
          test -s "$RECEIPT"
          node -e '
            const receipt = JSON.parse(require("node:fs").readFileSync(process.env.RECEIPT, "utf8"));
            if (receipt?.source?.commit !== process.env.GITHUB_SHA) {
              throw new Error(`the receipt is of ${receipt?.source?.commit ?? "no commit"}, not ${process.env.GITHUB_SHA}`);
            }
            const results = receipt?.results;
            if (results?.errors !== 0 || !(results?.verifiedItems > 0) || results.verifiedItems !== results.pinnedItems ||
                results.treeCleanBefore !== true || results.treeCleanAfter !== true) {
              throw new Error("the receipt does not show a passing run");
            }
          '

      - name: Attest the Verus receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/trust-kernel-verus-receipt/site-behavior-lab-trust-kernel-verus-receipt.json

  # The kernel's lock file against the RustSec advisory database, with the
  # same tool, version and flags as the audit of tools/adblock-wasm/Cargo.lock
  # in ci.yml. It stands here and not in that required job for the reason
  # this whole file exists: an advisory against a build-time macro crate of
  # code nothing ships must not stop a promotion or a release.
  trust-kernel-audit:
    name: Trust Kernel Dependency Audit
    runs-on: ubuntu-24.04
    # Most of the time is compiling cargo-audit.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A unique database path forces cargo-audit to fetch RustSec during
      # this run. Omitting --no-fetch and --stale makes an unavailable or
      # stale advisory database a failure, not a cache-only success.
      - name: Audit the kernel's Rust dependencies against a fresh RustSec database
        env:
          RUSTSEC_DB: ${{ runner.temp }}/rustsec-advisory-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$RUSTSEC_DB"
          cargo install cargo-audit --locked --version 0.22.1 --force
          test "$(cargo audit --version)" = "cargo-audit-audit 0.22.1"
          cargo audit \
            --db "$RUSTSEC_DB" \
            --url https://github.com/RustSec/advisory-db.git \
            --file tools/trust-kernel/Cargo.lock \
            --deny warnings
